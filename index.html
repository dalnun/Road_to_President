/* ---------- C-4. 주변 인물 한마디 (한 턴에 최대 1번) ---------- */
const CONFIDANT_LINES = [
  /* 4차 B-2. 멘토는 판 내내 같은 사람이다 */
  { who:function(s){ return s.mentor ? s.mentor.name : '선배'; },
    when:function(s){ return !!(s.mentor && s.chain && s.chain.metMentor); },
    lines:function(s){ return (s.mentor && s.mentor.lines) || ['"조심해서 가라."']; } },
  { who:'배우자', when:function(s){ return s.flags.life === '결혼과 가정'; },
    lines:['"요즘 얼굴 보기 힘들다."','"몸은 챙기면서 해."'] },
  { who:'참모', when:function(s){ return !!s.flags.aide; },
    lines:['"이번 판, 해볼 만합니다."','"조직이 예전 같지 않습니다."'] },
  { who:'오랜 동지', when:function(s){ return true; },
    lines:['"처음 그 마음, 아직 있지?"','"너무 멀리 온 건 아닌가 싶다."'] },
  { who:'어머니', when:function(s){ return true; },
    lines:['"밥은 먹고 다니냐."','"남들한테 싫은 소리 듣지 말고."'] }
];
function maybeConfidant(s){
  if(s.flags.confidantThisTurn) return null;
  if(Math.random() > 0.5) return null;
  var pool = CONFIDANT_LINES.filter(function(c){ return c.when(s); });
  if(!pool.length) return null;
  var c = pool[rnd(pool.length - 1)];
  s.flags.confidantThisTurn = true;
  var lines = val(c.lines, s) || [];
  return { who:val(c.who, s), line:lines[rnd(lines.length - 1)] };
}

/* ============================================================================
   턴 진행 = 계획 화면 → 타임라인 → 턴 정리 화면
   ============================================================================ */
function beginTurn(){
  var t = TURNS[S.turnIndex];
  S.turnPt = 0; S.phase = 'intro'; S.currentEvent = null; S.bonusNotes = [];
  S.planPicks = {};          /* 계획 화면에서 고른 것 (아직 효과는 적용 전) */
  S.planLocked = false;
  S.recheckNote = null;
  S.tlIndex = 0; S.tlFeed = []; S.curAge = null;
  S.turnStartStats = Object.assign({}, S.stats);   /* 턴 정리 화면에서 변화를 비교하려고 */
  S.usedStats = {};                                /* 이번 턴에 오른 능력치 기록 (자연 감소용) */
  S.warnLinesThisTurn = 0;
  S.tierAtTurnStart = tierLevel(S);
  S.flags.skipRaceThisTurn = false;
  S.flags.confidantThisTurn = false;
  S.confidant = null;
  S.iconNote = null;
  S.feedTurnStart = (S.feed || []).length;   /* 이번 턴의 여론 글이 어디서부터인지 (설계 A-4) */
  /* 5차 B-2. 마흔이 되면 남은 잠재력 칸이 모두 열린다 */
  if(S.turnIndex >= CONFIG.talent.scout.revealAllTurn) revealAllScout(S);
  /* 연출 — 선거가 끝나면 하늘은 내린다 (설계 C-4) */
  S.flags.skyOn = false; S.sky = null; S.attackGood = false; S.debateMood = null; S.primaryPos = 0.5;
  /* 이번 5년의 시대 분위기를 정한다 (설계 B-2) */
  S.era = ERAS[rnd(ERAS.length - 1)];
  planScrollTarget = null;
  if(t.onStart) t.onStart(S);
}

/* ---------- 계획 화면 ---------- */
/* 지금 보여 줄 단계 목록. show()가 false면 건너뛴다. */
function planSteps(){
  var t = TURNS[S.turnIndex];
  return (t.plan || []).filter(function(st){ return !st.show || st.show(S, S.planPicks); });
}
/* 아직 고르지 않은 첫 단계 (없으면 null = 전부 고름) */
function nextPlanStep(){
  var list = planSteps();
  for(var i = 0; i < list.length; i++){ if(!S.planPicks[list[i].id]) return list[i]; }
  return null;
}
function planComplete(){ return nextPlanStep() === null; }

/* 어떤 단계를 다시 고르면, 그 단계에 영향받는 아래 단계만 비운다 */
function clearDependents(stepId){
  var t = TURNS[S.turnIndex], cleared = [];
  var changed = true, dirty = { };
  dirty[stepId] = true;
  while(changed){
    changed = false;
    (t.plan || []).forEach(function(st){
      if(dirty[st.id]) return;
      var dep = (st.deps || []).some(function(d){ return dirty[d]; });
      if(dep){ dirty[st.id] = true; changed = true; }
    });
  }
  (t.plan || []).forEach(function(st){
    if(st.id !== stepId && dirty[st.id] && S.planPicks[st.id]){
      cleared.push(val(st.label, S) || val(st.title, S));
      delete S.planPicks[st.id];
    }
  });
  delete S.planPicks[stepId];
  return cleared;
}
function pickPlanOption(stepId, idx){
  var st = planSteps().filter(function(x){ return x.id === stepId; })[0];
  if(!st) return;
  var opts = st.options(S, S.planPicks);
  /* 6차 C-4. 잠긴 선택지는 고를 수 없다.
     화면에서는 눌리지 않지만, 혹시 다른 경로로 들어와도 계획이 멈추지 않게
     열려 있는 첫 선택지로 되돌린다. */
  if(isLocked(S, opts[idx])){
    var free = opts.filter(function(o){ return !isLocked(S, o); });
    if(!free.length) return;
    idx = opts.indexOf(free[0]);
  }
  S.planPicks[stepId] = opts[idx];
  rivalTakes(S, stepId, opts, idx);         /* 6차 C-1. 내가 안 고른 자리를 라이벌이 가져간다 */
  S.recheckNote = null;
  planScrollTarget = stepId;
  render();
}
/* ── 6차 C-1. 라이벌이 내가 고르지 않은 자리를 가져간다 ────────────────────
   같은 판에서 같은 사람이 계속 앞을 가로막는다. 화면에는 여론 한 줄로만 나온다. */
const RIVAL_TAKE_STEPS = { career:1, s1:1, s2:1, entry:1, race:1, run:1, prep:1, where:1 };
function rivalTakes(s, stepId, opts, idx){
  if(!s.rival || !RIVAL_TAKE_STEPS[stepId]) return;
  if(!s.rival.met) return;                        /* 아직 만나지 않았으면 조용하다 */
  if(Math.random() >= CONFIG.rival.takeChance) return;
  var left = opts.filter(function(o, i){ return i !== idx && !isLocked(s, o); });
  if(!left.length) return;
  var taken = left[rnd(left.length - 1)];
  var label = val(taken.label, s);
  (s.rivalTook = s.rivalTook || []).push({ turn:s.turnIndex, label:label });
  pushFeed(s, 'rival', '{rival}이 「' + label + '」 쪽을 골랐다는 이야기가 들린다.');
}
function reopenPlanStep(stepId){
  if(S.planLocked) return;
  var cleared = clearDependents(stepId);
  S.recheckNote = cleared.length
    ? '앞의 선택이 바뀌어 「' + cleared.join('」, 「') + '」을(를) 다시 골라야 합니다.'
    : null;
  planScrollTarget = stepId;
  render();
}
/* 확인 — 여기서부터는 되돌릴 수 없다 */
function confirmPlan(){
  if(!planComplete()) return;
  S.planLocked = true;
  /* 5차 B-2. 고교 활동 두 개를 고르고 나면 그와 연결된 칸이 먼저 열린다.
     활동은 '어느 칸이 먼저 열리는지'만 정한다. 재능 값은 이미 정해져 있어 바뀌지 않는다. */
  if(S.turnIndex === 0){
    var link = CONFIG.talent.scout.actLink;
    ['act1','act2'].forEach(function(id){
      var p = S.planPicks[id];
      if(p && link[p.id]) revealScout(S, link[p.id]);
    });
  }
  startTimeline();
}

/* ---------- 타임라인 ---------- */
function buildTimeline(){
  var t = TURNS[S.turnIndex];
  var rows = (typeof t.timeline === 'function' ? t.timeline(S) : t.timeline) || [];
  rows = rows.map(function(r){ return Object.assign({}, r); });
  /* 무작위 이벤트가 나오는 해를 턴 안에서 무작위로 정한다 */
  if(t.event){
    var busy = function(r){ return r.election || r.choice || r.info || r.pres; };
    var free = [];
    rows.forEach(function(r, i){ if(!busy(r) && i > 0) free.push(i); });
    /* 대선을 치르는 턴은 뒤가 전부 차 있으므로 첫 해에라도 넣는다 */
    if(!free.length) rows.forEach(function(r, i){ if(!busy(r)) free.push(i); });
    /* 턴마다 이벤트 비중이 다르다 (설계 B-2 턴 리듬).
       대학 턴은 선택 위주라 1개, 30대는 이야기 위주라 2개, 선거 턴은 연출에 자리를 내준다. */
    var want = Math.min(CONFIG.rhythm.events[t.id] || CONFIG.rhythm.eventsDefault, free.length);
    for(var w = 0; w < want && free.length; w++){
      rows[free.splice(rnd(free.length - 1), 1)[0]].randomEvent = true;
    }
  }
  /* 자금 이벤트 — 대학 턴부터. 멈추지 않고 연대기에 한 줄로만 지나간다 (설계 A-2) */
  if(S.turnIndex >= 1 && Math.random() < CONFIG.earlyMoney.eventChance){
    var open = [];
    rows.forEach(function(r, i){ if(!r.election && !r.pres && !r.info) open.push(i); });
    if(open.length) rows[open[rnd(open.length - 1)]].moneyEvent = true;
  }
  return rows;
}
function startTimeline(){
  S.timelineRows = buildTimeline();
  S.tlIndex = 0; S.tlFeed = [];
  S.phase = 'timeline';
  /* 계획 화면에서 열린 잠재력 칸의 발견 문구를 연대기 맨 앞에 붙인다 (5차 B) */
  if(S.scoutQueue && S.scoutQueue.length){
    S.scoutQueue.forEach(function(x){ x.age = S.timelineRows[0] ? S.timelineRows[0].age : S.curAge; S.tlFeed.push(x); });
    S.scoutQueue = [];
  }
  showTip(S, 'timeline');   /* 첫 타임라인 (5차 C-3) */
  render();
  stepTimeline();
}
function reducedMotion(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}
var tlTimer = null;
function clearTlTimer(){ if(tlTimer){ clearTimeout(tlTimer); tlTimer = null; } }

/* 한 해를 진행한다. 멈춰야 하는 해(이벤트·선거)면 화면을 바꾼다. */
function stepTimeline(){
  clearTlTimer();
  var rows = S.timelineRows;
  if(S.tlIndex >= rows.length){ finishTimeline(); return; }
  var row = rows[S.tlIndex];
  S.curAge = row.age;

  /* 0) 한 해가 지나면서 자동으로 일어나는 것들
        — 자금 정산, 나이에 따른 체력 감소, 위기 수치 누적 */
  if(S.turnIndex > 0){
    settleYear(S); ageDecay(S, row.age);
    /* 해마다 여론이 조금씩 쌓인다 (칭찬과 비판이 섞인다) */
    if(Math.random() < 0.6) spillFeed(S);
    /* 주변 인물 한마디는 한 턴에 한 번 */
    if(!S.confidant) S.confidant = maybeConfidant(S);
  }

  /* 1) 이 해에 적용할 계획 선택들 */
  var lines = [];
  (row.apply || []).forEach(function(id){
    var opt = S.planPicks[id];
    if(!opt) return;
    /* 6차 B-4. 몸을 쓰는 선택은 체력에 따라 실제 효과가 줄어든다 */
    var deltas = applyEffects(S, staminaScaled(S, opt));
    S.turnPt += (opt.pt || 0);
    if(opt.apply) opt.apply(S);
    applySideEffects(S, opt);          /* 경계선·위기·돈이 걸린 선택인지 살핀다 */
    logHistory({ turn:TURNS[S.turnIndex].label, label:opt.logLabel || opt.label });
    lines.push({ text:val(opt.result, S) || opt.label, deltas:deltas });
    /* 마지막 칸에 붙은 보너스 계산 (예: 공약과 당 색의 궁합) */
    var stDef = (TURNS[S.turnIndex].plan || []).filter(function(x){ return x.id === id; })[0];
    if(stDef && stDef.after){
      var extra = stDef.after(S);
      if(extra){ var ed = applyEffects(S, extra.effects); lines.push({ text:extra.line, deltas:ed }); }
    }
  });
  /* 1-B) 자금 이벤트 — 좋은 일과 나쁜 일이 섞여 있다 (설계 A-2) */
  if(row.moneyEvent){
    var me = pickMoneyEvent(S);
    lines.push({ text:me.text, deltas:applyEffects(S, me.effects) });
    logHistory({ turn:TURNS[S.turnIndex].label, label:'뜻밖의 돈 — ' + (me.kind === 'good' ? '들어옴' : '나감') });
  }
  /* 2) 정해진 이야기 줄 */
  if(row.line) lines.push({ text:val(row.line, S) });
  /* 3) 아무 일도 없는 해에는 가끔 분위기 문구 */
  if(!lines.length && !row.randomEvent && !row.election && !row.choice && !row.info){
    if(Math.random() < CONFIG.timeline.fillerChance){
      var t = TURNS[S.turnIndex];
      var pool = (typeof t.fillers === 'function' ? t.fillers(S) : t.fillers) || [];
      if(pool.length) lines.push({ text:pool[rnd(pool.length - 1)], dim:true });
    }
  }
  lines.forEach(function(l){ S.tlFeed.push({ age:row.age, text:l.text, deltas:l.deltas, dim:l.dim }); });
  if(!lines.length) S.tlFeed.push({ age:row.age, text:'', dim:true });
  render();

  /* 3-B) 위기 단계에 따라 조짐·경고 문구를 흘린다 (본문은 한 턴에 2줄까지) */
  spillCrisisHints();
  /* 3-C) 작은 목표를 이뤘는지 살핀다 (6차 E) */
  checkMedals(S);

  /* 4) 이 해에 멈출 일이 있는가? — 위기 이벤트가 가장 먼저다 */
  var cp = pendingCrisis(S);
  if(cp){ openCrisis(cp); return; }
  if(row.info){ S.pauseKind = 'info'; S.pauseData = null; S.phase = 'tlinfo'; render(); return; }
  if(row.pres){ startPresStage(row.pres); return; }
  if(row.election){ startElection(); return; }
  if(row.choice){ openTimelineChoice(row.choice); return; }
  if(row.randomEvent){
    var ev = pickEvent();
    if(ev){ S.currentEvent = materialize(ev); S.phase = 'tlevent'; render(); return; }
  }
  /* 5) 다음 해로 */
  S.tlIndex++;
  if(S.tlIndex >= rows.length){ finishTimeline(); return; }
  tlTimer = setTimeout(stepTimeline, reducedMotion() ? 120 : CONFIG.timeline.yearMs);
}
/* 화면을 누르면 빨리 넘어간다 */
function hurryTimeline(){
  if(S.phase !== 'timeline') return;
  clearTlTimer();
  stepTimeline();
}
/* 건너뛰기 — 멈춰야 하는 해까지 한 번에 간다 */
function skipTimeline(){
  if(S.phase !== 'timeline') return;
  clearTlTimer();
  var guard = 0;
  while(S.phase === 'timeline' && S.tlIndex < S.timelineRows.length && guard++ < 40){
    var before = S.tlIndex;
    stepTimeline();
    clearTlTimer();
    if(S.phase !== 'timeline') return;
    if(S.tlIndex === before) break;
  }
}
function resumeTimeline(){
  S.tlIndex++;
  S.phase = 'timeline';
  if(S.tlIndex >= S.timelineRows.length){ finishTimeline(); return; }
  render();
  tlTimer = setTimeout(stepTimeline, reducedMotion() ? 120 : CONFIG.timeline.yearMs);
}
function finishTimeline(){ clearTlTimer(); endTurn(); }

/* ── 6차 B-4. 체력과 활동량을 잇는다 ─────────────────────────────────────
   body:true 가 붙은 선택(몸으로 뛰는 선거 운동, 발로 뛰는 준비기 활동)은
   체력이 낮으면 오르는 폭이 줄어든다. 깎이는 쪽은 그대로 둔다. */
function staminaScaled(s, opt){
  if(!opt || !opt.body || !opt.effects) return opt && opt.effects;
  var ST = CONFIG.stamina, v = s.stats.stamina;
  var mul = (v < ST.actionCut) ? ST.actionMul : (v < ST.campaignCut) ? ST.campaignMul : 1;
  if(mul >= 1) return opt.effects;
  var out = {};
  Object.keys(opt.effects).forEach(function(k){
    var e = opt.effects[k];
    out[k] = (e > 0 && k !== 'stamina') ? Math.max(1, Math.round(e * mul)) : e;
  });
  if(s.tlFeed) s.tlFeed.push({ age:s.curAge, text:CONFIG.stamina.note, dim:true });
  return out;
}
/* ---------- 선택에 딸려 오는 것들 ----------
   선택지에 fence(어정쩡한 행동) / crisis(위기 누적) / clearsFence(경계선 해소) 표시가
   붙어 있으면 여기서 처리한다. 화면에는 숫자가 보이지 않는다. */
/* ── 6.1차 5. 사후 공개 ──────────────────────────────────────────────────
   고른 뒤에는 무슨 일이 있었는지 한 줄로 알려 준다. 수치는 쓰지 않는다. */
const SIDE_AFTER = {
  corruption:'이 일로 뒷말이 남았다.',
  bankrupt:'살림에 금이 하나 갔다.',
  health:'몸이 그만큼을 기억했다.',
  scandal:'말이 도는 자리가 하나 늘었다.',
  fence:'어느 쪽 사람이냐는 물음이 또 따라붙었다.',
  cleared:'어느 쪽인지가 분명해졌다.'
};
function applySideEffects(s, opt){
  if(!opt) return;
  var after = [];
  if(opt.fence){ addFence(s, opt.fence === true ? undefined : opt.fence); after.push(SIDE_AFTER.fence); }
  if(opt.crisis){
    Object.keys(opt.crisis).forEach(function(p){
      addCrisis(s, p, opt.crisis[p]);
      if(SIDE_AFTER[p]) after.push(SIDE_AFTER[p]);
    });
  }
  if(opt.clearsFence){ clearFence(s, opt.clearsFence); after.push(SIDE_AFTER.cleared); }
  /* 청렴도를 크게 깎는 선택은 비리 위기로도 쌓인다 */
  var e = opt.effects || {};
  if(e.integrity && e.integrity <= -5){ addCrisis(s, 'corruption', -e.integrity); after.push(SIDE_AFTER.corruption); }
  if(e.stamina && e.stamina <= -5){ addCrisis(s, 'health', -e.stamina * 0.8); after.push(SIDE_AFTER.health); }
  if(opt.corrupt){ after.push(SIDE_AFTER.corruption); }
  /* 같은 말을 두 번 적지 않는다. 한 번에 한 줄만. */
  if(after.length && s.tlFeed){
    var seen = {}, one = null;
    after.forEach(function(t){ if(!seen[t]){ seen[t] = 1; if(!one) one = t; } });
    if(one) s.tlFeed.push({ age:s.curAge, text:one, side:true });
  }
}

/* ---------- B-5. 위기 조짐·경고 문구 ----------
   조짐은 여론 피드로만, 경고는 본문에도 (한 턴에 최대 2줄) */
/* 암시 문구를 한 줄(약 25자) 안으로 줄인다 (설계 C-5) */
function shortLine(t){
  var n = CONFIG.textLimit.lineChars;
  t = String(t).replace(/\s+/g, ' ').trim();
  return t.length <= n ? t : t.slice(0, n - 1) + '…';
}
function spillCrisisHints(){
  /* 우선순위: 위기 단계가 높은 것부터 본문에 (설계 C-5) */
  var list = Object.keys(S.crisis)
    .filter(function(p){ return crisisUnlocked(S, p); })
    .sort(function(a, b){ return S.crisis[b] - S.crisis[a]; });
  list.forEach(function(p){
    var st = crisisStage(S.crisis[p]);
    var def = CRISIS_PATHS[p];
    var seenKey = p + ':' + st;
    if(st === 'calm') return;
    if(S.crisisSeen[seenKey]) return;
    S.crisisSeen[seenKey] = true;
    if(st === 'sign'){
      /* 조짐은 본문에 쓰지 않고 여론 피드로만 흘린다 */
      pushFeed(S, 'community', def.signs[rnd(def.signs.length - 1)]);
    } else if(st === 'warn' || st === 'crisis'){
      var line = def.warns[rnd(def.warns.length - 1)];
      pushFeed(S, 'news', line);
      /* 본문에 보이는 경고는 한 턴에 최대 2줄, 한 줄은 25자 안 */
      if(S.warnLinesThisTurn < CONFIG.textLimit.bodyHints){
        S.warnLinesThisTurn++;
        S.tlFeed.push({ age:S.curAge, text:'⚠ ' + shortLine(line), warn:true });
      }
      pushAlert(S, '경고 — ' + shortLine(line));   /* 6.1차 6-2 */
      /* 첫 위기 경고 안내 — 상태 아이콘이 처음 붙는 순간이기도 하다 (5차 C-3) */
      showTip(S, 'crisis');
    }
  });
}

/* 위기 이벤트를 연다 (타임라인이 멈춘다) */
function openCrisis(path){
  S.crisisPath = path;
  S.shakeOnce = true;      /* 화면 흔들림은 이번 한 번만 (0-1) */
  S.crisisTries[path] = (S.crisisTries[path] || 0) + 1;
  var def = CRISIS_EVENTS[path], C = CONFIG.crisis;
  /* 조건이 맞지 않는 선택지는 뺀다 (예: 가족 도움은 집안이 넉넉할 때만) */
  var list = def.options.filter(function(o){ return !o.needRich || S.background === 'rich'; });
  /* 6차 B-1. 판정 없는 선택은 한 판에 한 번만 */
  S.usedNoRoll = S.usedNoRoll || {};
  if(C.noRollOncePerGame) list = list.filter(function(o){ return !(o.noRoll && S.usedNoRoll[o.label]); });
  /* 6차 B-1. 같은 경로의 세 번째 위기부터는 이미 쓴 대응 하나를 고를 수 없다 */
  S.crisisUsed = S.crisisUsed || {};
  var used = S.crisisUsed[path] || [];
  if(S.crisisTries[path] >= C.repeatBlockFrom && used.length){
    var blocked = used[0];      /* 가장 먼저 썼던 대응이 막힌다 */
    var trimmed = list.filter(function(o){ return o.quiet || o.label !== blocked; });
    if(trimmed.length >= C.minOptions) list = trimmed;
    S.crisisBlocked = blocked;
  } else {
    S.crisisBlocked = null;
  }
  S.crisisOpts = list;
  S.phase = 'crisis';
  showTip(S, 'crisis');   /* 첫 위기 경고 (5차 C-3) */
  render();
}
function chooseCrisisOption(idx){
  var path = S.crisisPath, opt = S.crisisOpts[idx];
  var def = CRISIS_PATHS[path];

  /* 정치의 꿈을 내려놓기 → 은퇴 후의 삶으로 이어진다 (6차 B-2).
     몰락과 달리 여기서 끝나지 않는다. 이것이 둘의 차이다. */
  if(opt.quiet){
    S.tlFeed.push({ age:S.curAge, text:opt.text });
    S.flags.quietEnding = true;
    S.flags.quietPath = path;
    retireNow('정치의 꿈을 내려놓았다');
    return;
  }

  var out = opt, ok = true, C = CONFIG.crisis;
  /* 6차 B-1. 무엇을 써 봤는지 기록해 둔다 (세 번째 위기부터 하나가 막힌다) */
  S.crisisUsed = S.crisisUsed || {};
  (S.crisisUsed[path] = S.crisisUsed[path] || []).push(opt.label);
  if(opt.noRoll){ S.usedNoRoll = S.usedNoRoll || {}; S.usedNoRoll[opt.label] = true; }

  if(opt.stat){
    /* 같은 경로로 두 번째 위기면 넘기기가 더 어렵고,
       위기가 깊을수록(수치가 터지는 선보다 높을수록) 목표치가 더 올라간다 */
    var depth = Math.min(C.depthCap,
      Math.max(0, Math.round((S.crisis[path] - C.crisisAt) * C.depthPerPoint)));
    var dc = opt.dc + (S.crisisTries[path] > 1 ? C.secondTryPenalty : 0) + depth;
    revealScout(S, opt.stat);        /* 5차 B-2: 그 능력을 처음 크게 쓰는 순간 */
    var range = CONFIG.eventRandomRange;
    /* 무작위 폭 안에서의 실제 성공 확률 */
    var p = (S.stats[opt.stat] + range - dc + 1) / (range + 1);
    p = Math.max(0, Math.min(1, p));
    if(p > C.maxSuccess){
      /* 능력치가 아무리 높아도 상한을 넘지 못한다 (6차 B-1) */
      ok = Math.random() < C.maxSuccess;
    } else {
      ok = (S.stats[opt.stat] + rnd(range)) >= dc;
    }
    out = ok ? opt.success : opt.fail;
  }
  var deltas = applyEffects(S, out.effects);
  if(opt.corrupt) addCrisis(S, 'corruption', opt.corrupt);
  logHistory({ turn:TURNS[S.turnIndex].label, label:def.name + ' 위기 — ' + opt.label });
  S.tlFeed.push({ age:S.curAge, text:out.text, deltas:deltas, warn:!ok });

  if(out.doom){
    S.flags.downfallPath = path;
    finishGame();
    return;
  }
  /* 넘겼다 — 경고 단계로 내려가고 재기 서사 보너스 */
  S.crisis[path] = Math.max(0, S.crisis[path] - (out.relief || 30));
  if(S.crisis[path] >= CONFIG.crisis.crisisAt) S.crisis[path] = CONFIG.crisis.afterSurvive;
  S.flags.comebackStory = true;
  S.medalState.survivedCrisis = true;      /* 6차 E */
  S.marks[TURNS[S.turnIndex].label] = '위기를 넘긴 해';   /* 연대기에 별표 (설계 D-1) */
  if(out.skipRace) S.flags.skipRaceThisTurn = true;
  pushFeed(S, 'news', S.name + ', ' + def.name + ' 고비 넘겨');
  S.phase = 'timeline';
  resumeTimeline();
}

/* ---------- 타임라인 중간의 선택 화면 ---------- */
function openTimelineChoice(key){
  var def = TIMELINE_CHOICES[key];
  if(!def){ resumeTimeline(); return; }
  S.tlChoiceKey = key;
  S.tlChoice = { title:val(def.title, S), text:val(def.text, S), options:def.options(S) };
  S.phase = 'tlchoice';
  render();
}
function chooseTimelineOption(idx){
  var def = TIMELINE_CHOICES[S.tlChoiceKey];
  var opt = S.tlChoice.options[idx];
  var deltas = applyEffects(S, opt.effects);
  S.turnPt += (opt.pt || 0);
  if(opt.apply) opt.apply(S);
  applySideEffects(S, opt);
  logHistory({ turn:TURNS[S.turnIndex].label, label:opt.logLabel || opt.label });
  S.tlFeed.push({ age:S.curAge, text:val(opt.result, S) || opt.label, deltas:deltas });
  /* 이어지는 화면이 있으면 바로 잇는다 (예: 제안 수락 → 입당) */
  var nx = def.next ? def.next(S) : null;
  if(nx){ openTimelineChoice(nx); return; }
  resumeTimeline();
}

/* ---------- 타임라인 중간의 무작위 이벤트 ---------- */
function chooseEventOption(opt){
  var ev = S.currentEvent, out;
  if(opt.stat){
    revealScout(S, opt.stat);        /* 5차 B-2: 그 능력을 처음 크게 쓰는 순간 */
    var roll = S.stats[opt.stat] + rnd(CONFIG.eventRandomRange);
    out = (roll >= opt.dc) ? opt.success : opt.fail;
  } else { out = opt; }
  var deltas = applyEffects(S, out.effects);
  S.turnPt += (out.pt || 0);
  if(ev.after) ev.after(S);
  if(out.apply) out.apply(S);
  if(out.mark) S.flags[out.mark] = true;
  /* 4차 B-2. 연쇄 이벤트의 씨앗 — 이 선택의 결과가 뒤 턴 이벤트를 부른다 */
  if(out.chain) S.chain[out.chain] = true;
  else if(opt.chain) S.chain[opt.chain] = true;
  /* 6차 C-1. 라이벌과 한 번 부딪치고 나면 판 내내 그 이름이 따라다닌다 */
  if(S.chain.rivalClash && S.rival) S.rival.met = true;
  applySideEffects(S, out);
  /* 논란에 나쁘게 대응하면 구설이 쌓인다 (설계 B-5) */
  if(opt.stat && out === opt.fail) addCrisis(S, 'scandal', 10);
  /* 몰락이 경고 없이 오지 않도록, 위험한 선택은 경고 횟수로 쌓아 둔다 */
  if(out.warn){ S.flags.integrityWarnings = (S.flags.integrityWarnings || 0) + 1; addCrisis(S, 'scandal', 8); }
  logHistory({ turn:TURNS[S.turnIndex].label, label:fill(ev.title, S) + ' — ' + fill(opt.label, S) });
  S.tlFeed.push({ age:S.curAge, text:out.text, deltas:deltas });
  resumeTimeline();
}

/* ============================================================================
   대선 흐름 — 타임라인 안에서 단계별로 진행된다
   경선 → 본선 준비 → TV 토론 3문항 → 막판 공세 → 개표
   ============================================================================ */
function startPresStage(stage){
  S.presStage = stage;
  S.phase = 'pres';
  if(stage === 'primary'){
    S.primaryPos = 0.5;        /* 줄다리기 매듭은 한가운데서 시작한다 (C-5) */
    if(isOutsiderRun(S)){
      /* 무소속·신당은 경선이 없다 */
      S.presSub = 'noPrimary';
    } else {
      S.presSub = 'strategy';
      S.primaryOpts = primaryOptions(S);
    }
  }
  else if(stage === 'final'){ S.presSub = 'pledge'; }
  else if(stage === 'election'){
    S.flags.presGrade = presGrade(S);
    S.flags.debateSwing = 0;
    pickRival(S);              /* 상대 후보의 강함을 이번 선거에 한 번 정한다 */
    S.rivalProfile = makeRivalProfile(S);   /* 이름·출신·약점이 있는 상대 후보 (C-1) */
    payRaceCost(S, 'president');
    /* 캠프 살림은 문구로만 알린다 (설계 A-3) */
    if(S.flags.costHelpLine) S.tlFeed.push({ age:S.curAge, text:S.flags.costHelpLine });
    S.tlFeed.push({ age:S.curAge, text:donationLine(S, S.flags.lastDonation || 0) });
    /* 대선 직전 돌발 사건 */
    if(Math.random() < CONFIG.era.shockChance){
      var sh = SHOCKS[rnd(SHOCKS.length - 1)];
      S.flags.presShock = sh;
    } else { S.flags.presShock = null; }
    /* C-4. 선거 운동이 시작될 때 하늘이 정해진다.
       돌발 변수가 예정됐거나 상대의 강함을 모르면 우세라도 구름이 낀다. */
    var uncertain = !!S.flags.presShock || !S.rivalProfile.hintShown;
    setSky(S, computePresChance(S), uncertain);
    S.debateMood = null;
    S.debateQs = pickDebateQuestions(S);
    S.debateIdx = 0;           /* 0~3 — CONFIG.debate.order 에 따라 상대/내 질문이 번갈아 온다 */
    S.theirIdx = 0;
    S.usedAnswers = [];        /* 이번 토론에서 이미 쓴 답변 방식 (설계 A-1) */
    S.usedMyQ = [];            /* 이번 토론에서 이미 쓴 질문 방식 */
    S.debateLine = null;
    S.presSub = 'debate';      /* 안내 화면 없이 바로 첫 질문으로 (화면 수를 줄임) */
  }
  render();
}
/* 경선 전략을 고른다 */
function choosePrimary(idx){
  var opt = S.primaryOpts[idx];
  var won = runPrimary(S, opt);
  /* C-5. 줄다리기 매듭이 움직인다. 확률이 아니라 위치로만 읽힌다. */
  S.primaryPos = won ? (0.72 + Math.random() * 0.18) : (0.1 + Math.random() * 0.18);
  logHistory({ turn:TURNS[S.turnIndex].label, label:'경선 — ' + opt.label });
  var eff = won ? { org:6, approval:8, fame:7 } : { org:4, fame:5, approval:-3 };
  var deltas = applyEffects(S, eff);
  S.flags.wonPrimary = won;
  if(S.flags.factionDeal) S.flags.factionDealEver = true;
  S.presResult = {
    head: won ? '당내 경선에서 이겼다' : '당내 경선에서 졌다',
    text: won
      ? '전당대회장에서 이름이 불렸다. 당의 대선 후보가 됐다.'
      : '마지막 연설까지 했지만 표가 모자랐다. 단상 아래에서 결과를 들었다.',
    deltas:deltas
  };
  S.presSub = 'primaryResult';
  render();
}
/* 경선 탈락 뒤 선택 */
function choosePrimaryLoss(idx){
  var opt = PRIMARY_LOSS_OPTIONS[idx];
  var deltas = applyEffects(S, opt.effects);
  S.turnPt += (opt.pt || 0);
  if(opt.apply) opt.apply(S);
  logHistory({ turn:TURNS[S.turnIndex].label, label:opt.label });
  S.tlFeed.push({ age:S.curAge, text:opt.result, deltas:deltas });
  if(S.flags.presWait){
    /* 이번 턴은 대선을 접는다. 남은 해만 흘려보낸다. */
    S.timelineRows = S.timelineRows.map(function(r){
      return r.pres ? { age:r.age } : r;
    });
  }
  resumeTimeline();
}
/* 본선 준비 — 공약 확정과 단일화 */
function choosePresPrep(kind, idx){
  var list = (kind === 'pledge') ? FINAL_PREP_PLEDGE : FINAL_PREP_MERGE;
  var opt = list[idx];
  var deltas = applyEffects(S, opt.effects);
  S.turnPt += (opt.pt || 0);
  if(opt.apply) opt.apply(S);
  if(opt.id === 'switch') S.flags.flipRiskEver = true;
  logHistory({ turn:TURNS[S.turnIndex].label, label:opt.label });
  if(kind === 'pledge'){
    S.tlFeed.push({ age:S.curAge, text:opt.result, deltas:deltas });
    S.presSub = 'merge';
    render(); return;
  }
  /* 단일화 판정 */
  var line = opt.result;
  if(S.flags.mergeTry){
    /* 6차 C-1. 판 내내 부딪친 라이벌과 손을 잡은 적이 있으면 협상이 수월하다 */
    var allyAdd = S.flags.rivalAlly ? CONFIG.rival.mergeBonus : 0;
    var ok = (S.stats.org + S.stats.approval + allyAdd + rnd(30)) >= 95;
    S.flags.mergeDone = ok;
    if(ok){ S.flags.mergeDoneEver = true;
      var d2 = applyEffects(S, { approval:10, org:5, policy:-3 });
      line = S.flags.rivalAlly && S.rival
        ? fixJosa(S.rival.name + JOSA_MARK + '과 한 무대에 섰다. 오래 싸운 두 사람이 나란히 손을 들어 올렸다.')
        : '나래당 후보와 손을 잡았다. 무대에서 두 사람이 손을 들어 올렸다. 공약 몇 개는 양보해야 했다.';
      deltas = deltas.concat(d2);
    } else {
      line = '협상은 끝내 깨졌다. 양쪽 다 상처만 남았다.';
      var d3 = applyEffects(S, { approval:-4 });
      deltas = deltas.concat(d3);
    }
  }
  S.tlFeed.push({ age:S.curAge, text:line, deltas:deltas });
  resumeTimeline();
}
/* TV 토론 */
/* 지금 차례가 상대 질문인지 내 질문인지 */
function debateTurnKind(){ return CONFIG.debate.order[S.debateIdx] || 'their'; }
function currentTheirQ(){ return S.debateQs[Math.min(S.theirIdx, S.debateQs.length - 1)]; }
/* 4차 A-1 — 한 토론 안에서 같은 질문은 한 번만 쓸 수 있다 */
function myQUsed(id){ return (S.usedMyQ || []).indexOf(id) >= 0; }

/* 상대 질문에 답한다 */
function answerDebate(idx){
  var q = currentTheirQ();
  var a = DEBATE_ANSWERS[idx];
  if(!a) return;
  /* 상대 질문에 답하는 방식은 몇 번이든 다시 쓸 수 있다.
     (질문이 매번 다르므로 같은 태도로 일관되게 답하는 것도 하나의 선택이다) */
  S.usedAnswers.push(a.id);
  var res = judgeDebate(S, q, a.id);
  applyEffects(S, res.effects);
  S.flags.debateSwing = (S.flags.debateSwing || 0) + res.swing;
  /* C-5. 방청석이 일어서거나 고개를 숙이고, 하늘도 한 단계 움직인다 */
  S.debateMood = res.swing > 0 ? 'up' : (res.swing < 0 ? 'down' : null);
  if(res.swing > 0) shiftSky(S, -1); else if(res.swing < 0) shiftSky(S, 1);
  if(res.swing > 0) S.medalState.debateGood = (S.medalState.debateGood || 0) + 1;   /* 6차 E */
  var pool = DEBATE_LINES[res.kind] || DEBATE_LINES.good;
  S.debateLine = pool[rnd(pool.length - 1)];
  /* 토론에서 반격은 구설을 부른다 (설계 B-5) */
  if(a.id === 'counter') addCrisis(S, 'scandal', 6);
  logHistory({ turn:TURNS[S.turnIndex].label, label:'TV 토론 — ' + a.label });
  S.theirIdx++;
  startDebateReact();      /* 6차 D-2. 문구보다 그림이 먼저 움직인다 */
}
/* ══════════════════════════════════════════════════════════════════════════
   6차 D-2 — 토론에서 그림이 먼저 반응한다
   고르면 시소가 기울고 방청석과 상대 후보가 움직인다. 그 뒤에 결과 문구가 나온다.
   움직임 줄이기 설정이면 최종 상태와 문구를 한 번에 보여 준다.
   ══════════════════════════════════════════════════════════════════════════ */
var debTimer = null;
function clearDebTimer(){ if(debTimer){ clearTimeout(debTimer); debTimer = null; } }
function startDebateReact(){
  clearDebTimer();
  S.presSub = 'debateReact';
  if(reducedMotion()){ S.debateShowLine = true; render(); return; }
  S.debateShowLine = false;
  render();
  debTimer = setTimeout(function(){
    if(S.presSub !== 'debateReact') return;
    S.debateShowLine = true;
    render();
  }, CONFIG.debate.reactMs);
}
/* 반응을 다 봤다 — 다음 질문으로 */
function debateReactNext(){
  clearDebTimer();
  if(!S.debateShowLine){ S.debateShowLine = true; render(); return; }
  S.debateMood = null;
  debateNext();
}
/* 내가 질문한다 */
function askDebate(qid, weakId){
  if(myQUsed(qid)) return;                    /* 이미 쓴 질문 방식은 고를 수 없다 */
  S.usedMyQ.push(qid);
  var res = judgeMyQuestion(S, qid, weakId);
  applyEffects(S, res.effects);
  S.flags.debateSwing = (S.flags.debateSwing || 0) + res.swing;
  S.debateMood = res.swing > 0 ? 'up' : (res.swing < 0 ? 'down' : null);
  if(res.swing > 0) shiftSky(S, -1); else if(res.swing < 0) shiftSky(S, 1);
  S.debateLine = res.line;
  if(res.swing > 0) S.medalState.debateGood = (S.medalState.debateGood || 0) + 1;   /* 6차 E */
  if(qid === 'attack' && res.swing < 0) addCrisis(S, 'scandal', 5);
  logHistory({ turn:TURNS[S.turnIndex].label, label:'TV 토론 질문 — ' +
    (MY_QUESTIONS.filter(function(m){ return m.id === qid; })[0] || {}).label });
  startDebateReact();      /* 6차 D-2. 문구보다 그림이 먼저 움직인다 */
}
function debateNext(){
  S.debateIdx++;
  if(S.debateIdx < CONFIG.debate.order.length){ S.presSub = 'debate'; render(); return; }
  /* 막판 공세 — 대선에서는 반드시 청렴도가 걸린 공세가 온다 */
  var pool = PRES_ATTACKS.filter(function(a){ return !a.bizPressure; });
  var bizPool = PRES_ATTACKS.filter(function(a){ return a.bizPressure; });
  /* 6.1차 1. 재산이 많을수록 재산·정경유착 쪽 공세가 먼저 온다 (진로 불문) */
  if(bizPool.length && Math.random() < moneyAttackChance(S)){
    S.attackSrc = bizPool[rnd(bizPool.length - 1)];
  } else {
    S.attackSrc = pool[rnd(pool.length - 1)];
  }
  S.presSub = 'lateAttack';
  render();
}
function choosePresAttack(idx){
  var P = CONFIG.presidential;
  var opt = S.attackSrc.options[idx], out;
  if(opt.stat){
    var bonus = (S.flags.aide === 'spin') ? P.aideEffect.spin.late : 0;
    revealScout(S, opt.stat);        /* 5차 B-2 */
    var roll = S.stats[opt.stat] + bonus + rnd(CONFIG.eventRandomRange);
    out = (roll >= opt.dc) ? opt.success : opt.fail;
  } else { out = opt; }
  var deltas = applyEffects(S, out.effects);
  if(out.apply) out.apply(S);
  if(out.mark) S.flags[out.mark] = true;
  if(out.warn) S.flags.integrityWarnings = (S.flags.integrityWarnings || 0) + 1;
  S.flags.debateSwing = (S.flags.debateSwing || 0) + (out.good ? P.lateBonus : P.latePenalty);
  /* C-5. 잘 대응하면 신문에 정정 보도 도장이 찍히고 하늘도 한 단계 갠다 */
  S.attackGood = !!out.good;
  shiftSky(S, out.good ? -1 : 1);
  logHistory({ turn:TURNS[S.turnIndex].label, label:'막판 공세 — ' + opt.label });
  S.attackResult = { head:S.attackSrc.title, text:out.text, deltas:deltas };
  S.presSub = 'lateResult';
  render();
}
/* 선거 직전 판세 → 개표 */
function startPresBallot(){
  var chance = computePresChance(S);
  S.presChance = chance;
  /* 대선은 상한이 70%라 판세 경계도 따로 잡는다 */
  var poll;
  if(chance >= 52) poll = '여론조사에서 앞선다. 캠프가 들떠 있다.';
  else if(chance >= 40) poll = '박빙 우세다. 방심하지 말라는 말이 매일 나온다.';
  else if(chance >= 28) poll = '오차범위 안 접전이다. 마지막까지 모른다.';
  else if(chance >= 16) poll = '뒤처져 있다. 남은 날을 다 써야 한다.';
  else poll = '많이 뒤졌다. 그래도 끝까지 가기로 했다.';
  /* 상대가 얼마나 센지, 돌발 사건이 있었는지는 숫자 대신 문구로만 드러낸다 */
  S.presPoll = (S.flags.rivalLine ? S.flags.rivalLine + '\n' : '') +
               (S.flags.presShock ? S.flags.presShock.line + '\n' : '') + poll;
  S.presSub = 'poll';
  render();
}
function runPresBallot(){
  var won = rnd(99) < S.presChance;
  var steps = buildBallotSteps(S, won, S.presChance);
  S.ballotSteps = steps;
  S.ballotShown = 0;
  S.flags.electedPresident = won;
  S.flags.wonByComeback = steps.comeback;
  /* 진 턴을 기억해 둔다 — 바로 다음 턴에 또 나가려면 체급이 아주 높아야 한다 (4차 B-1) */
  if(!won){
    S.flags.presLostAtTurn = S.turnIndex;
    S.flags.lastPresClose = (S.presChance >= CONFIG.presidential.closeLossCut);
    /* 숨은 엔딩 '딱 한 표' — 아주 근소하게 진 밤 (설계 D-2) */
    if(S.flags.lastPresClose && Math.random() < CONFIG.presidential.oneVoteChance){
      S.flags.oneVote = true;
      S.ballotSteps.lines[S.ballotSteps.lines.length - 1] =
        '확정. 표 차이가 한 줌이었다. 재검표 이야기가 나왔지만 결과는 그대로였다.';
    }
  } else {
    /* 숨은 엔딩 '예보를 뒤집은 밤' — 하늘이 어긋났던 선거에서 이겼다 */
    if(S.flags.skyWrong) S.flags.wonWrongForecast = true;
    S.flags.wonAtAge = S.curAge;
  }
  refundRaceCost(S, won, S.presChance >= 30);
  clearFence(S, '대선 출마');
  if(won) applyEffects(S, { approval:15, fame:15 });
  else applyEffects(S, { fame:12, approval:-5, stamina:-8 });
  /* 6차 E. 메달 판정용 기록 */
  if(won){
    S.flags.everWonElection = true;
    if(S.flags.runHome) S.medalState.wonAtHome = true;
    if(S.medalState.survivedCrisis) S.medalState.wonAfterCrisis = true;
  }
  if(S.flags.earlyParty || S.flags.newParty) S.medalState.ranOwnParty = true;
  S.presSub = 'ballot';
  render();
}
function ballotStep(){
  if(S.ballotShown < S.ballotSteps.lines.length - 1){ S.ballotShown++; render(); return; }
  if(S.flags.electedPresident){ finishGame(); return; }
  S.presSub = 'lossChoice';
  S.presLossOpts = presLossOptions(S);
  render();
}
function choosePresLoss(idx){
  var opt = S.presLossOpts[idx];
  var deltas = applyEffects(S, opt.effects);
  if(opt.apply) opt.apply(S);
  logHistory({ turn:TURNS[S.turnIndex].label, label:opt.label });
  S.tlFeed.push({ age:S.curAge, text:opt.result, deltas:deltas });
  if(S.flags.endingPick){ finishGame(); return; }
  resumeTimeline();
}

/* ---------- 선거 (타임라인 안에서 진행) ---------- */
function startElection(){
  S.electionStage = 'poll';
  S.electionInfo = runPoll(S);
  applyEffects(S, S.electionInfo.effects);
  S.phase = 'election';
  showTip(S, 'election');   /* 첫 선거 (5차 C-3) */
  render();
}
function electionNext(){
  if(S.electionStage === 'poll'){
    var hit = ATTACKS.filter(function(a){ return a.when(S); });
    /* 6.1차 1. 재산이 많을수록 재산·후원금 공세가 먼저 온다 (진로 불문) */
    var moneyHit = hit.filter(function(a){ return a.bizPressure; });
    if(moneyHit.length && Math.random() < moneyAttackChance(S)){
      S.attackSrc = moneyHit[rnd(moneyHit.length - 1)];
    } else {
      S.attackSrc = hit.filter(function(a){ return !a.bizPressure; })[0] ||
                    (hit.length ? hit[0] : ATTACKS[ATTACKS.length - 1]);
    }
    S.electionStage = 'attack';
    render(); return;
  }
  if(S.electionStage === 'attackResult'){
    S.electionStage = 'ballot';
    S.ballotInfo = runBallot(S);
    S.ballotDeltas = applyEffects(S, S.ballotInfo.effects);
    render(); return;
  }
  if(S.electionStage === 'ballot'){
    S.tlFeed.push({ age:S.curAge, text:(S.flags.won ? '당선. ' : '낙선. ') + S.ballotInfo.text, deltas:S.ballotDeltas });
    /* 첫 당선한 해에 별표 (설계 D-1) */
    if(S.flags.won && !S.flags.firstWinMarked){
      S.flags.firstWinMarked = true;
      S.marks[TURNS[S.turnIndex].label] = '처음 당선한 해';
    }
    resumeTimeline(); return;
  }
}
function chooseAttackOption(idx){
  var opt = S.attackSrc.options[idx], out;
  if(opt.stat){
    revealScout(S, opt.stat);        /* 5차 B-2: 그 능력을 처음 크게 쓰는 순간 */
    var roll = S.stats[opt.stat] + rnd(CONFIG.eventRandomRange);
    out = (roll >= opt.dc) ? opt.success : opt.fail;
  } else { out = opt; }
  var deltas = applyEffects(S, out.effects);
  S.turnPt += (out.pt || 0);
  if(out.apply) out.apply(S);
  if(out.mark) S.flags[out.mark] = true;
  if(typeof S.flags.winChance === 'number'){
    S.flags.winChance += out.good ? CONFIG.election.attackBonus : -CONFIG.election.attackPenalty;
  }
  /* C-5. 정정 보도 도장 + 하늘 한 단계 */
  S.attackGood = !!out.good;
  shiftSky(S, out.good ? -1 : 1);
  logHistory({ turn:TURNS[S.turnIndex].label, label:S.attackSrc.title + ' — ' + opt.label });
  S.attackResult = { head:S.attackSrc.title, text:out.text, deltas:deltas };
  S.electionStage = 'attackResult';
  render();
}

/* ---------- 무작위 이벤트 ---------- */
function evKey(e){ return e.turn + '|' + e.title; }
function evMatch(e){ return e.careers === '*' || e.careers.indexOf(S.career) >= 0; }
/* turn 은 't2' 처럼 하나거나 ['t3','t4'] 처럼 여러 개일 수 있다.
   'late' 라고 적으면 40세 이후의 모든 턴에 해당한다 (턴 수를 늘려도 그대로 맞는다). */
function evTurnMatch(e, turnId){
  var list = Array.isArray(e.turn) ? e.turn : [e.turn];
  if(list.indexOf('late') >= 0 && isLateTurnId(turnId)) return true;
  return list.indexOf(turnId) >= 0;
}
/* 이 이벤트가 지금 나올 수 있는가 (연쇄 조건까지 본다) */
function evReady(e){
  if(e.chainOf && !S.chain[e.chainOf]) return false;   /* 앞 이야기가 없으면 안 나온다 */
  if(e.when && !e.when(S)) return false;
  return true;
}
/* 6차 C-2. 선택지가 상황에 따라 달라지는 이벤트는 뽑는 순간에 확정한다
   (후원 제안은 청렴도·조직력에 따라 '알아보고 받는다'가 생기거나 없다) */
function materialize(e){
  if(!e || typeof e.options !== 'function') return e;
  var out = Object.assign({}, e);
  out.options = e.options(S);
  return out;
}
function pickEvent(){
  var turnId = TURNS[S.turnIndex].id;
  var all = EVENTS.filter(function(e){ return evTurnMatch(e, turnId) && evMatch(e); });
  /* 같은 판에서 한 번 나온 이벤트는 다시 나오지 않는다 (설계 B-2) */
  var unused = function(e){ return S.usedEvents.indexOf(evKey(e)) < 0; };
  /* 1) 반드시 일어나는 이벤트 (예: 방송 입대 연기자) */
  var forced = all.filter(function(e){ return e.forced && evReady(e) && unused(e); });
  if(forced.length){ S.usedEvents.push(evKey(forced[0])); return forced[0]; }
  /* 2) 앞 턴의 선택이 부른 이야기가 있으면 그것을 먼저 (설계 B-2 연쇄 이벤트) */
  var chained = all.filter(function(e){ return e.chainOf && evReady(e) && unused(e); });
  if(chained.length){
    var c = chained[rnd(chained.length - 1)];
    S.usedEvents.push(evKey(c));
    return c;
  }
  /* 3) 하 등급 2연속이면 낮은 확률로 늦깎이 반전 */
  if(S.lowStreak >= 2 && S.turnIndex <= 4){
    var cb = all.filter(function(e){ return e.comeback && unused(e); });
    if(cb.length && Math.random() < CONFIG.grade.lowStreakEventChance){
      S.usedEvents.push(evKey(cb[0])); return cb[0];
    }
  }
  /* 4) 보통 이벤트. 이번 판에 안 나온 것만 뽑는다 (없으면 이번 해는 그냥 지나간다) */
  var pool = all.filter(function(e){
    return !e.forced && !e.comeback && !e.chainOf && evReady(e) && unused(e);
  });
  if(!pool.length) return null;
  /* 6차 C. 인물 이야기(라이벌·후원자·가족·과거·측근)는 가중치를 두어 더 자주 나오게 한다.
     이야기가 188개까지 늘면서 사람 이야기가 묻혔다. weight 를 적지 않으면 1이다. */
  var bag = [];
  pool.forEach(function(e){
    var w = Math.max(1, e.weight || 1);
    for(var i = 0; i < w; i++) bag.push(e);
  });
  var picked = bag[rnd(bag.length - 1)];
  S.usedEvents.push(evKey(picked));
  return picked;
}
/* ---------- 등급 판정 (임시 공식) ---------- */
/* 이번 턴 동안 무엇이 얼마나 달라졌는지 이야기로 요약한다 (숫자 없이) */
const CHANGE_WORDS = {
  speech:'말솜씨', policy:'정책 감각', org:'사람을 모으는 힘', integrity:'평판',
  fame:'이름값', stamina:'몸 상태', approval:'지지 기반', funds:'주머니 사정'
};
function turnChangeSummary(){
  var out = [];
  Object.keys(CHANGE_WORDS).forEach(function(k){
    var diff = S.stats[k] - (S.turnStartStats ? S.turnStartStats[k] : S.stats[k]);
    if(Math.abs(diff) < 3) return;
    out.push({ key:k, diff:diff });
  });
  out.sort(function(a, b){ return Math.abs(b.diff) - Math.abs(a.diff); });
  return out.slice(0, 4).map(function(d){
    var w = CHANGE_WORDS[d.key];
    var big = Math.abs(d.diff) >= CONFIG.display.bigDelta;
    var dir = d.diff > 0 ? '늘었다' : '줄었다';
    return { key:d.key, diff:d.diff,
      line:w + josaIGa(w) + ' ' + (big ? '눈에 띄게 ' : '조금 ') + dir + '.' };
  });
}
function endTurn(){
  var t = TURNS[S.turnIndex];
  /* 한 번도 쓰지 않은 능력치는 조금 녹슨다 (설계 B-4) */
  if(S.turnIndex > 0) unusedDecay(S);
  /* 체급이 바뀌었으면 문구로 알린다 (설계 B-7) */
  var nowTier = tierLevel(S);
  S.tierChange = (S.tierAtTurnStart && nowTier !== S.tierAtTurnStart)
    ? (nowTier > S.tierAtTurnStart ? '체급이 올랐다 ▲ ' + tierName(S) : '체급이 떨어졌다 ▼ ' + tierName(S))
    : null;
  if(S.tierChange){
    pushFeed(S, 'news', nowTier > S.tierAtTurnStart
      ? '"' + S.name + ', ' + tierName(S) + josaRo(tierName(S)) + ' 분류돼"' : '"' + S.name + ', 존재감 약해져"',
      { tone: nowTier > S.tierAtTurnStart ? 'pos' : 'neg' });
    pushAlert(S, S.tierChange);   /* 6.1차 6-2 */
  }
  /* 6.1차 6-2. 자금이 바닥이면 알림으로 알려 준다 */
  if(S.stats.funds < CONFIG.money.troubleBelow) pushAlert(S, '자금이 바닥났다. 이대로면 버티기 어렵다.');
  /* 경계선에 오래 머물면 진로별 딱지 글이 여론 피드에 붙는다 (설계 B-6) */
  if(S.fence >= CONFIG.fence.tagEventAt){ spillFeed(S); S.flags.fenceTagged = true; }
  S.changeSummary = turnChangeSummary();
  if(!t.grade){
    if(t.onEnd) t.onEnd(S);
    S.phase = 'summary';
    S.summaryText = gradeTextOf(t, 'mid') || '';
    render(); return;
  }
  var g = CONFIG.grade;
  var sum = 0;
  GRADE_STATS.forEach(function(k){ sum += S.stats[k]; });
  var statTerm = Math.round((sum / GRADE_STATS.length) / g.statDivisor);
  var isEnt = (S.career === 'ent');
  /* 방송만 무작위 폭을 크게 둔다 (설계 5번 · 흥행 판정 방식은 임시) */
  var luck = isEnt ? (rnd(g.entRandomRange) + g.entRandomOffset) : rnd(g.randomRange);
  var score = S.turnPt + statTerm + luck;
  var cut = g.cuts[t.id] || { high:29, low:21 };
  var grade = score >= cut.high ? 'high' : (score <= cut.low ? 'low' : 'mid');
  S.grades.push({ turn:t.label, age:t.ageText, grade:grade, score:score });
  S.lowStreak = (grade === 'low') ? S.lowStreak + 1 : 0;
  if(t.onGradeApplied) t.onGradeApplied(S, grade);
  if(t.onEnd) t.onEnd(S);
  S.phase = 'summary';
  /* 등급 이름·점수는 절대 보여 주지 않는다. 이야기 문구만 남긴다. */
  S.summaryText = gradeTextOf(t, grade);
  render();
}
/* 턴 정리 문구를 꺼낸다. 진로별 → 공통 → 기본 문구 순서로 찾는다.
   gradeText 의 값이 함수여도 된다. */
function gradeTextOf(t, g){
  var gt = t.gradeText || {}, v = null;
  if(gt[S.career] && gt[S.career][g] !== undefined) v = gt[S.career][g];
  else if(gt._default && gt._default[g] !== undefined) v = gt._default[g];
  return safe(v, S, 'summary');
}
function advanceTurn(){
  S.turnIndex++;
  if(S.turnIndex >= TURNS.length){ finishGame(); return; }
  beginTurn(); render();
}

/* ---------- 최종 점수 ---------- */
/* 능력치 + 지지율×2 + 자금 + 턴 성과 + 정치 경력 보너스 (결과 화면과 최고 점수에 쓴다) */
function finalScore(){
  var s = 0;
  ['speech','policy','org','integrity','fame'].forEach(function(k){ s += S.stats[k]; });
  s += S.stats.approval * 2 + S.stats.funds;
  S.grades.forEach(function(g){ s += CONFIG.scoreGradeBonus[g.grade]; });
  if(S.politicalCareer) s += (CONFIG.scoreCareerBonus[S.politicalCareer.key] || 0);
  return Math.round(s);
}
/* 5차 A-4. 확인한 여론을 보관함으로 옮긴다 */
/* 6.1차 6-2. 한 칸만 읽음으로 넘길 수도 있다 (칸을 안 주면 전부) */
function markFeedRead(box){
  (S.feed || []).forEach(function(f){
    if(!box || (f.box || 'feed') === box) f.read = true;
  });
  S.feedUnread = (S.feed || []).filter(function(f){ return !f.read; }).length;
}
/* ══════════════════════════════════════════════════════════════════════════
   6차 B-2 — 은퇴 후의 삶
   예전에는 은퇴도 몰락도 그 자리에서 끝나 차이가 느껴지지 않았다.
   이제 은퇴는 5년이나 10년을 더 살며 두세 번 더 고르고, 낮은 확률로 복귀한다.
   ══════════════════════════════════════════════════════════════════════════ */
function retireNow(reason){
  clearTlTimer();
  S.flags.retired = true;
  S.menuOpen = false; S.menuAsk = null; S.tab = 'life';
  /* 아직 정치 경력이 정해지지 않았다면 지금까지의 기록으로 확정한다 */
  if(!s_hasCareerPath()) { try{ finalizePoliticalCareer(S); }catch(e){ /* 무시 */ } }
  logHistory({ turn:TURNS[Math.min(S.turnIndex, TURNS.length - 1)].label,
               label: reason || '스스로 물러났다' });
  startRetireLife();
}
/* 은퇴 후 짧은 타임라인을 연다 (5년 또는 10년, 선택은 두 번 또는 세 번) */
function startRetireLife(){
  var long = Math.random() < 0.5;
  S.retire = {
    step:0,
    total: long ? 3 : 2,            /* 두세 번 고른다 */
    years: long ? 10 : 5,
    age: (S.curAge || CONFIG.lifespan.lateFrom),
    lines:[{ text:RETIRE_TEXT.open }],
    back:0,
    picks:[]
  };
  S.phase = 'retire';
  render();
}
function retireOptions(){
  var used = S.retire.picks;
  var list = RETIRE_ACTIONS.filter(function(o){ return used.indexOf(o.id) < 0; });
  return list.length >= 2 ? list : RETIRE_ACTIONS.slice();
}
function chooseRetireOption(idx){
  var R = S.retire, opt = retireOptions()[idx];
  if(!opt) return;
  var gap = Math.max(2, Math.round(R.years / R.total));
  R.age = Math.min(CONFIG.lifespan.maxAge, R.age + gap);
  S.curAge = R.age;
  var deltas = applyEffects(S, opt.effects);
  R.picks.push(opt.id);
  R.back += opt.comeback;
  R.lines.push({ age:R.age, text:val(opt.line, S), deltas:deltas });
  logHistory({ turn:'은퇴 후', label:opt.label });
  R.step++;
  if(R.step < R.total){ render(); return; }
  /* 다 골랐다 — 낮은 확률로 정계 복귀 */
  var chance = Math.min(35, R.back) / 100;
  var canReturn = (S.turnIndex + 1) < TURNS.length;
  if(canReturn && Math.random() < chance){ retireComeback(); return; }
  R.lines.push({ text:RETIRE_TEXT.stayLine });
  /* 가장 많이 고른 길이 결말을 정한다 (같으면 마지막에 고른 길) */
  S.flags.retirePath = lastMostPath(R.picks);
  S.phase = 'retireEnd';
  render();
}
function lastMostPath(picks){
  var cnt = {}, best = picks[picks.length - 1] || 'work';
  picks.forEach(function(p){ cnt[p] = (cnt[p] || 0) + 1; });
  picks.slice().reverse().some(function(p){ if(cnt[p] === Math.max.apply(null, Object.keys(cnt).map(function(k){ return cnt[k]; }))){ best = p; return true; } return false; });
  return best;
}
/* 복귀 — 당 없이 원외 인사로 남은 턴을 이어서 간다 */
function retireComeback(){
  S.flags.retired = false;
  S.flags.cameBack = true;
  S.flags.comebackStory = true;
  S.party = null;
  S.politicalCareer = { key:'outside', name:'원외 인사' };
  S.retire.lines.push({ age:S.retire.age, text:RETIRE_TEXT.backLine });
  S.retire.lines.push({ text:RETIRE_TEXT.backNote });
  logHistory({ turn:'은퇴 후', label:'다시 정치로 돌아왔다' });
  pushFeed(S, 'news', '{name}, 정계 복귀 선언');
  S.marks[TURNS[Math.min(S.turnIndex, TURNS.length - 1)].label] = '돌아온 해';
  S.phase = 'retireBack';
  render();
}
/* 복귀 뒤 다음 턴으로 이어 간다 */
function retireResume(){
  S.retire = null;
  S.phase = 'summary';
  advanceTurn();
}
function s_hasCareerPath(){ return !!(S && S.politicalCareer); }

/* 이번 판에서 가장 크게 판을 흔든 선택 3개 (내부 기록으로 고른다) */
function keyChoices(s){
  return (s.history || []).slice()
    .map(function(h, i){ return { h:h, i:i }; })
    .sort(function(a, b){ return (b.h.imp || 0) - (a.h.imp || 0); })
    .slice(0, 3)
    .sort(function(a, b){ return a.i - b.i; })
    .map(function(x){ return x.i; });
}
/* 연대기 — 턴마다 한 줄. 별표는 위기를 넘긴 해와 첫 당선한 해 */
function chronicleRows(s){
  var byTurn = {}, order = [];
  (s.history || []).forEach(function(h, i){
    if(!byTurn[h.turn]){ byTurn[h.turn] = { turn:h.turn, best:h, bestI:i, age:h.age }; order.push(h.turn); }
    else if((h.imp || 0) > (byTurn[h.turn].best.imp || 0)){ byTurn[h.turn].best = h; byTurn[h.turn].bestI = i; }
  });
  var keys = keyChoices(s);
  return order.map(function(t){
    var r = byTurn[t];
    return { turn:t, age:r.age, label:r.best.label,
             key:keys.indexOf(r.bestI) >= 0,
             star:(s.marks && s.marks[t]) || null };
  });
}
function finishGame(){
  clearTlTimer();
  S.screen = 'result';
  S.endChapter = 0;
  S.momentStep = 0;
  S.endingKey = decideEnding(S);
  var e = ENDINGS[S.endingKey] || ENDINGS.heavyweight;
  S.endingTitle = val(e.title, S);
  S.endingLine = e.line;
  S.endingGroup = e.group;
  S.group = e.group;                       /* peopleLines 에서 참조 */
  S.endingEpilogue = e.epilogue ? e.epilogue(S) : null;
  S.endingArt = endingArt(S.endingKey, S);
  S.people = peopleLines(S);
  S.chronicle = chronicleRows(S);
  S.finalTitle = S.endingTitle;
  S.finalScore = finalScore();
  /* 도감에 남길 것 — 이 판의 연대기 마지막 5줄 */
  var last5 = (S.history || []).slice(-5).map(function(h){
    return (h.age ? h.age + '세 ' : '') + h.label;
  });
  var hall = S.flags.electedPresident
    ? { n:S.name, c:CAREERS[S.career].name, a:(S.flags.wonAtAge || S.curAge), t:S.endingTitle }
    : null;
  S.saveOk = writeSave(S.finalScore, S.endingKey, S.endingTitle, e.group, last5, hall);
  S.saveData = loadSave();
  S.newEnding = !(S.saveData.book && S.saveData.book[S.endingKey]) ? true : true;
  render();
}

/* ============================================================================
   화면 그리기

/* ---------- 숫자를 감추고 보여 주는 도구들 ---------- */
/* 0-4. 능력치 값 → 등급 기호 (D · C · B · A · S · S+)
   원래 숫자는 끝까지 감추고, 모든 항목이 같은 체계를 쓴다. */
function gradeOf(v){
  var table = CONFIG.display.grades;
  for(var i = 0; i < table.length; i++){ if(v >= table[i].min) return table[i].g; }
  return table[table.length - 1].g;
}
/* 막대 길이(%) — 숫자는 보여 주지 않고 눈대중만 준다 */
function barPct(v){ return Math.max(3, Math.min(100, Math.round(v))); }
/* 변화량 → 화살표 기호. 색만으로 구분하지 않도록 기호를 함께 쓴다. */
function arrowFor(diff){
  var big = CONFIG.display.bigDelta;
  if(diff >= big) return { sym:'▲▲', cls:'up', word:'크게 올랐다' };
  if(diff > 0)    return { sym:'▲',  cls:'up', word:'올랐다' };
  if(diff <= -big) return { sym:'▼▼', cls:'dn', word:'크게 떨어졌다' };
  return { sym:'▼', cls:'dn', word:'떨어졌다' };
}
function deltaHTML(deltas){
  if(!deltas || !deltas.length) return '';
  return '<div class="deltas">' + deltas.map(function(d){
    var a = arrowFor(d.diff);
    return '<span class="delta ' + (a.cls === 'up' ? 'up' : 'down') + '">' +
      a.sym + ' ' + STAT_META[d.key].name + '</span>';
  }).join('') + '</div>';
}
/* 타임라인 한 줄에 붙는 작은 화살표 묶음 */
function arrowsInline(deltas){
  if(!deltas || !deltas.length) return '';
  return ' <span class="arrows">' + deltas.map(function(d){
    var a = arrowFor(d.diff);
    return '<span class="' + a.cls + '">' + a.sym + STAT_META[d.key].name + '</span>';
  }).join(' ') + '</span>';
}
/* 청렴도가 낮아지면 미리 경고한다. 몰락이 경고 없이 오지 않게 하기 위함. */
function integrityWarning(){
  var v = S.stats.integrity, d = CONFIG.display;
  if(v < d.integrityDanger) return '⚠ 뒷말이 돈다. 이대로 가면 언제 터져도 이상하지 않다.';
  if(v < d.integrityWarn) return '⚠ 주변에서 걱정하는 목소리가 나온다.';
  return null;
}
/* ══════════════════════════════════════════════════════════════════════════
   5차 A-1 · A-2 · A-3 — 화면 위 고정 띠 (그림 + 상태 + 메뉴)
   그림이 위에 붙어 있어서 선택지를 스크롤해도 함께 보인다.
   ══════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════
   6.1차 6 — 상태 아이콘을 늘 보이게
   파산과 체력은 막대와 게이지로 보이지만 구설과 비리는 짐작할 방법이 없었다.
   이제 네 경로(비리·파산·건강·구설) 모두 평온할 때도 흐리게 보이고,
   위기가 쌓이면 진해지면서 옆의 점이 하나씩 늘어난다.
   위기 수치 자체는 끝까지 보여 주지 않는다.
   ══════════════════════════════════════════════════════════════════════════ */
const CRISIS_OF_STAT = { integrity:'corruption', funds:'bankrupt', stamina:'health', fame:'scandal' };
const CRISIS_STAGE_WORD = {
  calm:'지금은 조용하다.', sign:'조짐이 조금 보인다.',
  warn:'걱정할 만한 상태다.', crisis:'언제 터져도 이상하지 않다.'
};
const CRISIS_STAGE_DOTS = { calm:0, sign:1, warn:2, crisis:3 };
function crisisIconFor(key){
  var path = CRISIS_OF_STAT[key];
  if(!path || !S.crisis) return '';
  /* 아직 열리지 않은 경로는 보여 주지 않는다 (예: 건강은 40세부터) */
  if(!crisisUnlocked(S, path)) return '';
  var st = crisisStage(S.crisis[path]);
  var def = CRISIS_PATHS[path];
  return '<button class="sicon mini st-' + st + '" data-act="sicon" ' +
    'data-d="' + esc(def.name + ' — ' + (CRISIS_STAGE_WORD[st] || '')) + '" ' +
    'aria-label="' + esc(def.name + ' ' + (CRISIS_STAGE_DOTS[st] || 0) + '단계') + '">' +
    iconSVG(def.icon, CRISIS_STAGE_DOTS[st] || 0) + '</button>';
}
/* ══════════════════════════════════════════════════════════════════════════
   6차 A-1 — 상태 표시 세 가지
   ① 쌓아 올리는 값(연설력·정책력·조직력·인지도) → D~S+ 등급
   ② 깎여 나가는 값(체력·청렴도)                 → 칸 5개 게이지 (숫자 없음)
   ③ 양쪽으로 갈리는 값(정치자금)                 → 원점이 3분의 1에 있는 막대
   ══════════════════════════════════════════════════════════════════════════ */
/* 게이지 — 남은 칸 수로만 읽힌다. 정확한 숫자도 등급 글자도 붙이지 않는다. */
function gaugeCellsOf(v){
  var n = CONFIG.display.gaugeCells;
  if(v <= 0) return 0;
  return Math.max(1, Math.min(n, Math.ceil(v / (100 / n))));
}
function gaugeHTML(s, key){
  var v = s.stats[key];
  var n = CONFIG.display.gaugeCells;
  var lit = gaugeCellsOf(v);
  /* 칸이 두 개 이하로 줄면 그 자체가 경고다 (색만이 아니라 칸 수와 빗금으로도 보인다) */
  var low = lit <= 2;
  var cells = '';
  for(var i = 0; i < n; i++) cells += '<i class="' + (i < lit ? 'on' : 'off') + '"></i>';
  return '<div class="gauge' + (low ? ' low' : '') + '">' +
    '<span class="gn">' + STAT_META[key].name + '</span>' +
    '<span class="gcells" role="img" aria-label="' + STAT_META[key].name + ' ' +
      lit + '칸 남음">' + cells + '</span>' +
    '<span class="gcnt">' + lit + '/' + n + '</span>' +
    crisisIconFor(key) + '</div>';
}
/* 정치자금 — 원점 왼쪽은 빚(빗금), 오른쪽은 여유. 원점에 세로 선을 긋는다. */
function fundsBarHTML(s){
  var v = s.stats.funds;
  var floorV = CONFIG.money.debtFloor;          /* -40 */
  var maxV = CONFIG.statMax;                    /* 100 */
  var zero = CONFIG.display.fundsAxis.zeroAt;   /* 막대의 3분의 1 지점 */
  var debt = v < 0;
  var w, left;
  if(debt){
    w = Math.min(zero, Math.abs(v) / Math.abs(floorV) * zero);
    left = zero - w;
  } else {
    w = Math.min(1 - zero, v / maxV * (1 - zero));
    left = zero;
  }
  return '<div class="axis' + (debt ? ' debt' : '') + '">' +
    '<span class="gn">' + STAT_META.funds.name + '</span>' +
    '<span class="atrack" role="img" aria-label="정치자금 ' + (debt ? '빚' : '여유') + '">' +
      '<i class="afill" style="left:' + (left * 100).toFixed(1) + '%;width:' +
        Math.max(1.5, w * 100).toFixed(1) + '%"></i>' +
      '<b class="azero" style="left:' + (zero * 100).toFixed(1) + '%"></b>' +
    '</span>' +
    '<span class="aw">' + (debt ? '빚' : '여유') + '</span>' +
    crisisIconFor('funds') + '</div>';
}
function hudHTML(){
  var careerName = S.career ? CAREERS[S.career].name : '진로 미정';
  var t = TURNS[Math.min(S.turnIndex, TURNS.length - 1)];
  var age = (S.screen === 'result') ? ((S.curAge || CONFIG.lifespan.maxAge) + '세 시점')
                                    : (S.curAge ? S.curAge + '세' : val(t.ageText, S));
  var party = S.party ? PARTIES.filter(function(p){ return p.id === S.party; })[0] : null;
  var st = stageFor(S);
  var big = !!(st && st.big);                 /* 그림이 주인공인 장면 (A-1 예외) */

  /* 그림 */
  var art = '';
  if(st){
    var inner = '';
    if(st.piece) inner = st.piece;
    else {
      if(st.sky && S.sky !== undefined && S.sky !== null) inner += skySVG(S.sky, {});
      inner += bgSVG(st.bg, S, st.posture);
    }
    art = '<div class="stage' + (st.shake ? ' shake' : '') + '"' +
      (st.label ? ' data-l="' + esc(st.label) + '"' : '') + '>' + inner + '</div>';
  }

  /* 윗줄 — 이름·나이·진로, 정당, 체급, 여론, 메뉴 */
  var top = '<div class="hudtop">' +
    '<div class="hwho"><b>' + esc(S.name) + '</b> · ' + (S.gender === 'male' ? '남' : '여') +
      ' · ' + age + ' · ' + careerName + '</div>' +
    (party ? '<span class="partytag" style="background:' + party.color + '">' + party.name + '</span>' : '') +
    /* 체급·잠재력 칩을 누르면 캐릭터 탭으로 간다 (6차 A-3) */
    '<button class="htier" data-act="totab" data-v="talent" aria-label="캐릭터 보기">' +
      esc(tierName(S)) + ' <i>' + potentialStars(S) + '</i></button>' +
    '<button class="hbtn menu" data-act="menu" aria-label="메뉴">≡</button>' +
    '</div>';

  /* 아랫줄 — 6차 A-1. 등급 넷은 두 칸씩, 게이지 둘과 자금 막대는 한 줄씩 */
  var bot = '<div class="hudbot"><div class="sgrid">';
  HEADER_ORDER.forEach(function(k){
    var v = S.stats[k];
    bot += '<div class="scell">' +
      '<div class="srow"><span class="sn">' + STAT_META[k].name + '</span>' +
      crisisIconFor(k) +
      '<span class="stier">' + gradeOf(v) + '</span></div>' +
      '<div class="sbar"><i style="width:' + barPct(v) + '%"></i></div></div>';
  });
  bot += '</div>';
  bot += '<div class="gwrap">';
  GAUGE_ORDER.forEach(function(k){ bot += gaugeHTML(S, k); });
  AXIS_ORDER.forEach(function(){ bot += fundsBarHTML(S); });
  bot += '</div>';
  if(S.iconNote) bot += '<div class="iconnote">' + esc(S.iconNote) + '</div>';
  var w = integrityWarning();
  if(w) bot += '<div class="warnline">' + esc(w) + '</div>';
  bot += '</div>';

  /* 6.1차 4. 접기 버튼은 없앴다 */
  return '<div class="hud' + (big ? ' big' : '') + '" id="hud">' +
    '<div class="artbox">' + art + top + '</div>' + bot +
    '</div>' +
    /* 메뉴 (A-3) */
    (S.menuOpen ? menuHTML() : '');
}
/* ══════════════════════════════════════════════════════════════════════════
   6차 A-3 — 화면 아래 고정 탭 4개
   잠재력과 여론이 메뉴나 다른 화면 안에 숨어 있어 찾기 어려웠다.
   새 글이나 새로 열린 재능이 있으면 탭에 알림 표시가 붙는다.
   ══════════════════════════════════════════════════════════════════════════ */
const TABS = [
  { id:'life',   name:'인생',   icon:'M3 17l5-6 4 4 5-7 4 5' },
  { id:'talent', name:'캐릭터', icon:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7' },
  { id:'feed',   name:'여론',   icon:'M4 5h16v10H9l-5 4z' },
  { id:'record', name:'기록',   icon:'M6 3h9l4 4v14H6zM15 3v4h4' }
];
function tabIcon(d){
  return '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" ' +
    'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="' + d + '"/></svg>';
}
function tabBadge(id){
  if(id === 'feed' && S.feedUnread)
    return '<span class="tbadge">' + Math.min(CONFIG.feedUI.badgeMax, S.feedUnread) + '</span>';
  if(id === 'talent' && S.scoutNew) return '<span class="tbadge dot" aria-label="새로 열린 재능"></span>';

const ENDING_ORDER = ['당선','낙선','미도전','복귀','조용한 결말','몰락','숨은'];
function endingBookHTML(sv, openKey){
  sv = sv || loadSave();
  var book = sv.book || {};
  var groups = {};
  Object.keys(ENDINGS).forEach(function(k){
    var g = ENDINGS[k].group;
    (groups[g] = groups[g] || []).push(k);
  });
  var total = Object.keys(ENDINGS).length;
  var count = Object.keys(ENDINGS).filter(function(k){ return book[k]; }).length;
  var pct = Math.round(count / total * 100);

  var h = '<div class="card"><div class="kicker">엔딩 도감</div>' +
    '<div class="bookbar"><span class="bt">' + count + ' / ' + total + ' 종류</span>' +
    '<span class="bb"><i style="width:' + Math.max(2, pct) + '%"></i></span>' +
    '<span class="bp">' + pct + '%</span></div>';

  ENDING_ORDER.concat(Object.keys(groups).filter(function(g){ return ENDING_ORDER.indexOf(g) < 0; }))
    .forEach(function(g){
      if(!groups[g]) return;
      h += '<div class="bgroup"><div class="gl">' + esc(g) + '</div><div class="bcards">';
      groups[g].forEach(function(k){
        var got = book[k];
        if(got){
          var open = (openKey === k);
          h += '<button class="ecard' + (open ? ' open' : '') + '" data-act="ecard" data-k="' + k + '">' +
            '<span class="en">' + esc(got.t) + '</span>' +
            (open && got.last5 && got.last5.length
              ? '<span class="el">' + got.last5.map(function(l){ return esc(l); }).join('<br>') + '</span>'
              : '<span class="eh">눌러서 그때의 마지막 다섯 줄 보기</span>') +
            '</button>';
        } else {
          var art = endingArt(k, null);
          h += '<div class="ecard locked">' + silhouetteMark() +
            '<span class="en">???</span><span class="eh">' + esc(art.hint) + '</span></div>';
        }
      });
      h += '</div></div>';
    });

  /* 명예의 전당 — 당선한 캐릭터들 */
  if(sv.hall && sv.hall.length){
    h += '<div class="divider"></div><div class="gl">명예의 전당</div>' +
      sv.hall.map(function(x){
        return '<div class="rowline"><span class="k">' + esc(x.n) + ' · ' + esc(x.c) + '</span>' +
          '<span class="v">' + esc(String(x.a)) + '세 · ' + esc(x.t) + '</span></div>';
      }).join('');
  }
  return h + '</div>';
}

/* 본 안내는 저장소에 기록한다. 저장소를 못 써도 게임은 그대로 돌아간다
   (그때는 이 판 안에서만 기억한다). */
var tipMemo = null;
function loadTips(){
  if(tipMemo) return tipMemo;
  tipMemo = {};
  try{
    var raw = localStorage.getItem(CONFIG.saveKeys.tips);
    if(raw) tipMemo = JSON.parse(raw) || {};
  }catch(e){ tipMemo = {}; }
  return tipMemo;
}
function tipSeen(id){ return !!loadTips()[id]; }
function markTipSeen(id){
  var m = loadTips();
  m[id] = 1;
  try{ localStorage.setItem(CONFIG.saveKeys.tips, JSON.stringify(m)); }catch(e){ /* 무시 */ }
}
function resetTips(){
  tipMemo = {};
  try{ localStorage.removeItem(CONFIG.saveKeys.tips); }catch(e){ /* 무시 */ }
  try{ localStorage.removeItem(CONFIG.saveKeys.feedTip); }catch(e){ /* 무시 */ }
}
function tipsAllSeen(){
  var m = loadTips();
  return Object.keys(TIPS).every(function(k){ return m[k]; });
}
/* 아직 안 본 안내면 띄우고 본 것으로 적는다.
   이미 안내가 떠 있으면 덮어쓰지 않고 줄을 세운다
   (한 번에 한 줄만 보이고, 어느 안내도 그냥 사라지지 않는다). */
function showTip(s, id){
  if(!s || !TIPS[id] || tipSeen(id)) return;
  markTipSeen(id);
  if(s.tip) (s.tipQ = s.tipQ || []).push(id);
  else s.tip = id;
}
function nextTip(s){
  s.tip = (s.tipQ && s.tipQ.length) ? s.tipQ.shift() : null;
}

/* ══════════════════════════════════════════════════════════════════════════
   5차 A-5 — 선택지의 효과 표시
   결과는 화살표, 조건은 '씀', 비용은 '듦'으로 나눠 적는다.
   주요 결과는 두 개까지만. 위기 수치와 부수 효과는 적지 않는다
   (다 보여 주면 최적 선택만 고르게 되고 뜻밖의 재미가 사라진다).
   ══════════════════════════════════════════════════════════════════════════ */
const EFFECT_ORDER = { approval:6, integrity:5, org:4, policy:4, speech:4, fame:3, stamina:2, funds:1 };
function optionEffects(o){
  if(!o) return '';
  var parts = [];
  /* 1) 조건 — 판정에 쓰는 능력 */
  if(o.stat && STAT_META[o.stat]){
    var sn = STAT_META[o.stat].name;   /* 청렴도·인지도는 '를', 연설력·정치자금은 '을' */
    parts.push('<span class="ec">' + sn + josaEulReul(sn) + ' 씀</span>');
  }
  /* 2) 비용 — 자금이 나가는 경우 */
  var eff = o.effects || {};
  var cost = eff.funds;
  if(typeof cost === 'number' && cost < 0){
    parts.push('<span class="ec">자금이 ' + (cost <= -10 ? '많이 ' : '') + '듦</span>');
  }
  /* 3) 결과 — 큰 것부터 두 개까지 */
  var keys = Object.keys(eff).filter(function(k){
    if(!STAT_META[k]) return false;
    if(k === 'funds' && eff[k] < 0) return false;    /* 이미 비용으로 적었다 */
    return eff[k] !== 0;
  });
  keys.sort(function(a, b){
    var wa = Math.abs(eff[a]) * (EFFECT_ORDER[a] || 1), wb = Math.abs(eff[b]) * (EFFECT_ORDER[b] || 1);
    return wb - wa;
  });
  keys.slice(0, 2).forEach(function(k){
    var a = arrowFor(eff[k]);
    parts.push('<span class="er ' + a.cls + '">' + STAT_META[k].name + ' ' + a.sym + '</span>');
  });
  /* 4) 6.1차 5. 겉으로 드러나지 않는 영향이 있으면 작은 표시를 붙인다.
        무엇인지는 적지 않는다 — 다 보여 주면 최적 선택만 고르게 된다. */
  var hid = hiddenEffectOf(o);
  if(hid){
    parts.push('<span class="sidemark' + (hid.risky ? ' risky' : '') + '" data-act="sidenote" ' +
      'data-k="' + hid.kind + '" role="button" tabindex="-1" aria-label="숨은 영향 설명">' +
      (hid.risky ? '⚠ 뒤탈이 있을 수 있음' : '⌗ 숨은 영향') + '</span>');
  }
  if(!parts.length) parts.push('<span class="ec">결과는 해 봐야 안다</span>');
  return '<span class="efx">' + parts.join('') + '</span>';
}
/* ══════════════════════════════════════════════════════════════════════════
   6.1차 5 — 부가 효과 안내
   위기 수치·경계선 수치·숨은 기록을 움직이는 선택지에 작은 표시를 붙인다.
   수치는 끝까지 보여 주지 않고, 눌러도 '영향이 있다'는 사실만 알려 준다.
   ══════════════════════════════════════════════════════════════════════════ */
/* applySideEffects 와 같은 조건을 본다 — 화면의 표시와 실제 처리가 어긋나지 않게 */
function hasCrisisSide(o){
  if(!o) return false;
  if(o.crisis && Object.keys(o.crisis).length) return true;
  if(o.corrupt) return true;
  if(o.warn) return true;
  var e = o.effects || {};
  if(e.integrity && e.integrity <= -5) return true;   /* 비리로 쌓인다 */
  if(e.stamina && e.stamina <= -5) return true;       /* 건강으로 쌓인다 */
  return false;
}
function hasQuietSide(o){
  if(!o) return false;
  if(o.fence || o.clearsFence) return true;
  if(o.chain || o.mark) return true;
  return false;
}
/* 성공·실패가 갈리는 선택지는 양쪽도 함께 본다 */
function hiddenEffectOf(o){
  if(!o) return null;
  var branches = [o, o.success, o.fail].filter(Boolean);
  var risky = branches.some(hasCrisisSide);
  var quiet = branches.some(hasQuietSide);
  if(risky) return { kind:'risky', risky:true };
  if(quiet) return { kind:'quiet', risky:false };
  return null;
}
const SIDE_NOTE = {
  risky:{ title:'뒤탈이 있을 수 있습니다',
    body:'지금 당장은 이득이지만, 겉으로 드러나지 않는 것이 함께 쌓입니다. 언젠가 돌아올 수 있습니다.' },
  quiet:{ title:'겉으로 드러나지 않는 영향이 있습니다',
    body:'화살표로 적힌 것 말고도 달라지는 것이 있습니다. 무엇인지는 지나 봐야 압니다.' }
};
function sideNoteHTML(){
  if(!S || !S.sideNote) return '';
  var n = SIDE_NOTE[S.sideNote] || SIDE_NOTE.quiet;
  return '<div class="sheetbg" data-act="sidenoteclose"></div><div class="sheet">' +
    '<h3>' + esc(n.title) + '</h3>' +
    '<p class="desc">' + esc(n.body) + '</p>' +
    '<button class="btn" data-act="sidenoteclose">알겠다</button></div>';

/* ══════════════════════════════════════════════════════════════════════════
   6차 C-4 — 별(영향력) 단계로 열리는 선택지
   체급이 모자라면 잠긴 채 보이고, 왜 잠겼는지 한 줄만 알려 준다.
   수치는 쓰지 않는다. 열려 있는 선택지만 고를 수 있다.
   ══════════════════════════════════════════════════════════════════════════ */
function lockReason(s, o){
  if(!o || !o.needTier) return null;
  if(tierLevel(s) >= o.needTier) return null;
  return o.lockLine || CONFIG.tierGate.lines[o.needTier] || '아직 그럴 자리가 아니다.';
}
function isLocked(s, o){ return !!lockReason(s, o); }

/* ---------- 계획 화면 ---------- */
var planScrollTarget = null;

       암시 문구는 '이미 정해져 있다'는 느낌을 줘서 없앴다. */
    (S.turnIndex === 0 ? scoutHTML(S) : '') +

    (S.recheckNote ? '<div class="recheck">' + esc(S.recheckNote) + '</div>' : '');

  for(var i = 0; i < list.length; i++){
    var st = list[i];
    var picked = S.planPicks[st.id];
    if(picked){
      /* 고른 단계는 한 줄로 접히고, 누르면 다시 고를 수 있다 */
      h += '<div class="planstep" id="ps-' + st.id + '">' +
        '<button class="picked" data-act="reopen" data-s="' + st.id + '" data-locked="' + (S.planLocked ? 'true' : 'false') + '">' +
          '<span class="pk">' + esc(safe(st.label || st.title, S, 'label')) + '</span>' +
          '<span class="pv">' + esc(safe(picked.label, S, 'option')) + '</span>' +
          (S.planLocked ? '' : '<span class="pe">바꾸기</span>') +
        '</button></div>';
    } else if(st === next){
      var note = st.note ? st.note(S, S.planPicks) : null;
      var opts = st.options(S, S.planPicks);
      h += '<div class="planstep" id="ps-' + st.id + '">' +
        '<div class="sl">' + esc(safe(st.title, S, 'title')) + '</div>' +
        '<div class="sq">' + esc(safe(st.prompt, S, 'prompt')) + '</div>' +
        (note ? '<div class="note">' + esc(note) + '</div>' : '') +
        opts.map(function(o, k){
          var tag = o.tag ? '<span class="tag ' + (o.tagKind === 'rec' ? 'rec' : '') + '">' + o.tag + '</span>' : '';
          /* 6차 C-4. 별(영향력) 단계가 모자라면 잠긴 채로 보여 준다.
             왜 잠겼는지 한 줄만 알려 주고 수치는 쓰지 않는다. */
          var lock = lockReason(S, o);
          if(lock){
            return '<button class="choice locked" disabled aria-disabled="true">' +
              '<div class="t">' + tag + esc(safe(o.label, S, 'option')) +
                '<span class="lk">잠김</span></div>' +
              '<div class="h"><span class="lr">' + esc(lock) + '</span></div></button>';
          }
          return '<button class="choice" data-act="ppick" data-s="' + st.id + '" data-i="' + k + '">' +
            '<div class="t">' + tag + esc(safe(o.label, S, 'option')) + '</div>' +
            '<div class="h">' + optionEffects(o) + '</div></button>';
        }).join('') +
        '</div>';
      break;   /* 아직 안 고른 단계는 하나만 펼친다 */

  }
  if(planComplete()){

         '<div class="small center" style="margin-top:6px">확인하면 되돌릴 수 없다.</div>';
  }

/* 기록장 — 이번 턴의 줄이 사라지지 않고 아래로 쌓인다 (설계 A-3) */
function feedLinesHTML(list){
  return list.map(function(f){
    if(!f.text) return '';

  }).join('');
}
/* 6차 A-2. 이벤트가 뜨는 해에는 타임라인을 선택창 아래로 내리고 낮게 접는다.
   예전에는 44vh 짜리 기록장이 위에 있어 '무슨 일인지'가 화면 밖에 있었다. */
function tlBelow(){ return viewTimeline(true); }
function viewTimeline(compact){
  var h = '<div class="card tlwrap' + (compact ? ' compact' : '') + '"' +
    (compact ? '' : ' data-act="hurry"') + '>' +
    '<div class="tlage">' + (S.curAge || '') + '<small>세</small></div>' +
    '<div class="tlfeed" id="tlfeed">' + feedLinesHTML(S.tlFeed) + '</div>';
  if(S.phase === 'timeline'){
    h += '<div class="tlhint">화면을 누르면 빨리 넘어갑니다</div>' +
         '<button class="tlskip" data-act="skip">건너뛰기</button>';
  }
  h += '</div>';
  /* 주변 인물 한마디 — 한 턴에 한 번만 (C-4) */
  if(S.confidant){
    h += '<div class="confidant"><b>' + esc(S.confidant.who) + '</b> ' + esc(S.confidant.line) + '</div>';
  }
  /* 아래쪽 헤드라인 띠 — 누르면 여론 피드가 열린다 (설계 A-4).
     선택지가 뜨는 화면에서는 가리지 않도록 순수 타임라인일 때만 보여 준다. */
  if(S.phase === 'timeline' && S.feed && S.feed.length){
    var last = S.feed[S.feed.length - 1];
    h += '<button class="ticker" data-act="feed">' +
      '<span class="tk">' + (FEED_KIND_LABEL[last.kind] || '여론') + '</span>' +
      '<span class="tx">' + esc(last.text) + '</span>' +
      '<span class="tgo">여론 보기 ›</span></button>';
  }
  return h;
}
/* 이번 턴에 쌓인 여론 글 가운데 대표 몇 개 (설계 A-4) */
function turnFeedItems(s){
  var from = s.feedTurnStart || 0;
  var list = (s.feed || []).slice(from);
  if(!list.length) return [];
  var n = CONFIG.feedUI.summaryItems;
  if(list.length <= n) return list;
  /* 처음·가운데·마지막을 골라 이번 5년의 흐름이 보이게 한다 */
  var out = [], step = (list.length - 1) / (n - 1);
  for(var i = 0; i < n; i++) out.push(list[Math.round(i * step)]);
  return out;
}

function feedItemHTML(f){

  var t = tone ? FEED_TONE[tone] : null;
  return '<div class="fitem f-' + f.kind + (isAlert ? ' alertitem' : '') + '">' +
    '<span class="fk' + (tone ? ' t-' + tone : ' t-self') + '">' +
      (t ? '<b class="fmk">' + t.mark + '</b>' : '<b class="fmk">·</b>') +
      (isAlert ? '알림' : (FEED_KIND_LABEL[f.kind] || '')) + '</span>' +
    '<span class="ft">' + esc(f.text) + '</span>' +
    '<span class="fa">' + f.age + '세</span></div>';
}
/* 6.1차 6-1. 긍정·중간·부정 비율 한 줄 막대. 구간마다 같은 기호를 붙인다. */
function toneBarHTML(list){
  var n = list.length;
  if(!n) return '';
  var c = { pos:0, mid:0, neg:0 };
  list.forEach(function(f){ c[f.tone || 'mid']++; });
  var order = ['pos','mid','neg'];
  return '<div class="tonebar" role="img" aria-label="긍정 ' + c.pos + ', 중간 ' + c.mid +
      ', 부정 ' + c.neg + '">' +
    order.map(function(k){
      if(!c[k]) return '';
      return '<span class="tb t-' + k + '" style="flex:' + c[k] + '">' +
        '<b>' + FEED_TONE[k].mark + '</b>' + (c[k] >= 2 ? c[k] : '') + '</span>';
    }).join('') + '</div>';
}
function viewFeed(){
  var all = S.feed || [];
  /* 6.1차 6-2. 여론 칸과 알림 칸을 나눈다 */
  var box = (S.feedBox === 'alert') ? 'alert' : 'feed';
  var inBox = function(f){ return (f.box || 'feed') === box; };
  var mine = all.filter(inBox);
  var fresh = mine.filter(function(f){ return !f.read; }).slice().reverse();
  var kept = mine.filter(function(f){ return f.read; }).slice(-40).reverse();
  var tab = S.feedTab === 'kept' ? 'kept' : 'new';
  var list = (tab === 'kept') ? kept : fresh;
  /* 두 칸의 확인 안 한 개수 */
  var unreadFeed = all.filter(function(f){ return !f.read && (f.box || 'feed') === 'feed'; }).length;
  var unreadAlert = all.filter(function(f){ return !f.read && f.box === 'alert'; }).length;

  return '<div class="card">' +
    '<div class="kicker">' + (box === 'alert' ? '알림' : '여론') + '</div>' +
    '<h3>' + (box === 'alert' ? '내 상태에 대한 것' : '사람들이 하는 말') + '</h3>' +

    '<div class="ftabs boxes">' +
      '<button class="ftab' + (box === 'feed' ? ' on' : '') + '" data-act="fbox" data-v="feed">' +
        '여론' + (unreadFeed ? ' ' + unreadFeed : '') + '</button>' +
      '<button class="ftab' + (box === 'alert' ? ' on' : '') + '" data-act="fbox" data-v="alert">' +
        '알림' + (unreadAlert ? ' ' + unreadAlert : '') + '</button>' +

    (box === 'feed' ? toneBarHTML(mine.slice(-30)) : '') +
    '<div class="ftabs">' +
      '<button class="ftab' + (tab === 'new' ? ' on' : '') + '" data-act="ftab" data-v="new">' +
        '확인 안 한 글' + (fresh.length ? ' ' + fresh.length : '') + '</button>' +
      '<button class="ftab' + (tab === 'kept' ? ' on' : '') + '" data-act="ftab" data-v="kept">' +

    (list.length
      ? '<div class="feedlist">' + list.map(feedItemHTML).join('') + '</div>'
      : '<p class="desc">' + (tab === 'kept' ? '보관된 글이 아직 없다.' : '새로 올라온 글이 없다.') + '</p>') +
