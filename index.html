<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대통령 되기 시뮬레이터</title>
<style>
:root{
  --indigo:#534ab7;      /* 포인트 색 */
  --indigo-d:#3b3489;
  --indigo-l:#eceaf8;
  --ink:#1e2230;
  --sub:#5f6679;
  --line:#e4e5ef;
  --bg:#f3f3f8;
  --card:#ffffff;
  --up:#4338a8;          /* 상승 표시색 (기호 ▲ +도 함께 씀) */
  --down:#a02c5c;        /* 하락 표시색 (기호 ▼ -도 함께 씀) */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  overflow-x:hidden;   /* 신문이 날아드는 동안 잠깐 생기던 가로 스크롤을 막는다 */
  font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
}
/* 아래 고정 탭이 본문을 가리지 않도록 그만큼 자리를 비워 둔다 (6차 A-3) */
#app{max-width:480px;margin:0 auto;padding:0 12px 40px;min-height:100vh}
body.hastabs #app{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
/* ── 6차 A-3. 화면 아래 고정 탭 ── */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;max-width:480px;margin:0 auto;
  background:var(--card);border-top:1px solid var(--line);
  padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -2px 12px rgba(20,24,50,.06);
}
.tbtn{
  position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:0;padding:6px 2px 4px;cursor:pointer;
  color:var(--sub);font:inherit;border-radius:10px;
}
.tbtn .tn{font-size:10px;font-weight:700;letter-spacing:-.4px;white-space:nowrap}
.tbtn.on{color:var(--indigo);background:var(--indigo-l)}
.tbtn.on .tn{font-weight:800}
.tbadge{
  position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;
  border-radius:99px;background:var(--down);color:#fff;border:1.5px solid var(--card);
  font-size:10px;font-weight:800;line-height:13px;text-align:center;
}
.tbadge.dot{min-width:9px;width:9px;height:9px;padding:0;top:5px;right:calc(50% - 18px)}
/* 잠재력 탭의 특성 목록 */
.tlist{display:grid;gap:7px;margin-top:4px}
.titem{background:#f7f8fd;border:1px solid var(--line);border-radius:11px;padding:8px 11px;font-size:12.5px}
.titem b{display:block;font-size:13px;margin-bottom:2px}
.titem span{color:var(--sub)}
.rowline .v.stars{letter-spacing:1px}
/* ══════════════════════════════════════════════════════════════════════════
   6차 D-2 — 토론 무대의 반응
   고르면 시소가 먼저 기울고, 방청석이 차례로 일어서거나 고개를 숙이고,
   상대 후보의 자세가 바뀐다. 그 뒤에 결과 문구가 나온다.
   ══════════════════════════════════════════════════════════════════════════ */
/* 시소는 제자리에서 돈다 (transform-box·origin 을 정해 줘야 축이 맞는다) */
.debstage .seesaw{transform-box:view-box;transform-origin:0 0}
.debstage.reacting .seesaw{animation:seeSwing .62s cubic-bezier(.34,1.35,.5,1) both}
@keyframes seeSwing{ from{transform:rotate(0deg)} to{transform:rotate(var(--tilt,0deg))} }
.debstage .seat{transform-box:view-box;transform-origin:0 0}
.debstage.reacting .seat.up{animation:seatUp .5s cubic-bezier(.3,1.4,.5,1) both}
.debstage.reacting .seat.dn{animation:seatDown .5s ease both}
@keyframes seatUp{0%{transform:translateY(0)}60%{transform:translateY(-7px)}100%{transform:translateY(-4px)}}
@keyframes seatDown{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
.debstage.reacting .deb{animation:debPose .55s ease both}
.debstage.reacting .deb.foe{animation-delay:.12s}
@keyframes debPose{from{opacity:.55} to{opacity:1}}
.reactwait{color:var(--sub);font-size:13.5px;text-align:center;margin:10px 0 4px;letter-spacing:1px}
/* ── 6.1차 2. 잠재력 해금 알림 (화면 가운데) ── */
.popbg{position:fixed;inset:0;z-index:90;background:rgba(20,22,34,.28)}
.scoutpop{
  position:fixed;z-index:91;left:50%;top:44%;transform:translate(-50%,-50%);
  width:min(300px,84vw);background:var(--card);border:2px solid var(--indigo);
  border-radius:18px;padding:18px 20px 14px;text-align:center;cursor:pointer;
  box-shadow:0 14px 40px rgba(28,24,80,.28);
  animation:popIn .34s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}}
.scoutpop .spk{font-size:11.5px;font-weight:800;letter-spacing:.5px;color:var(--indigo);
  background:var(--indigo-l);border-radius:99px;padding:3px 11px;display:inline-block}
.scoutpop .spn{font-size:23px;font-weight:800;margin:10px 0 6px;letter-spacing:-.5px}
.scoutpop .spl{font-size:13.5px;line-height:1.5;color:var(--sub)}
.scoutpop .spgo{margin-top:12px;font-size:12px;font-weight:700;color:var(--indigo)}
@media (prefers-reduced-motion: reduce){ .scoutpop{animation:none} }
/* ── 6차 E. 메달 ── */
.medaltoast{
  position:relative;display:flex;align-items:center;gap:7px;
  margin:8px 0 2px;background:var(--indigo-d);color:#fff;border-radius:12px;
  padding:9px 32px 9px 11px;font-size:13px;
}
.medaltoast .mi{font-size:15px;line-height:1}
.medaltoast b{font-weight:800}
.medaltoast .tipx{position:absolute;top:6px;right:6px;background:none;border:0;color:#fff;
  opacity:.8;font:inherit;font-size:12.5px;cursor:pointer;padding:2px 6px}
.mlist{display:grid;gap:7px;margin-top:6px}
.mitem{display:flex;align-items:flex-start;gap:9px;background:#f7f8fd;border:1px solid var(--line);
  border-radius:11px;padding:9px 11px}
.mitem.done{background:var(--indigo-l);border-color:#cfcbef}
.mitem .mk{color:#b6bcd0;font-size:14px;line-height:1.3;flex:none}
.mitem.done .mk{color:var(--indigo)}
.mitem .mb{flex:1;min-width:0;font-size:12.5px}
.mitem .mb b{display:block;font-size:13.5px;margin-bottom:1px}
.mitem .mb span{color:var(--sub);line-height:1.45}
.mitem .ma{font-size:11.5px;font-weight:800;color:var(--indigo);flex:none}
.tlline.medal .tt{color:var(--indigo-d);font-weight:700}
/* 6.1차 5. 고른 뒤 드러나는 한 줄 */
.tlline.side .tt{color:var(--sub);font-style:italic}
@media (prefers-reduced-motion: reduce){
  .debstage.reacting .seesaw,.debstage.reacting .seat,.debstage.reacting .deb{animation:none}
}
.rowline .v i.rt{font-style:normal;font-size:11px;font-weight:700;color:var(--sub);
  background:var(--indigo-l);border-radius:5px;padding:1px 5px;margin-left:5px}
/* ── 6차 C-5. 고향 고르기 ── */
/* ── 6.1차 3. 캐릭터 만들기 걸음 표시와 어린 시절 이야기 ── */
.csteps{display:flex;gap:6px;margin:0 2px 8px;flex-wrap:wrap}
.csteps .cs{font-size:11.5px;font-weight:700;color:var(--sub);background:#eceef6;
  border-radius:99px;padding:4px 10px}
.csteps .cs.on{background:var(--indigo);color:#fff}
.csteps .cs.done{background:var(--indigo-l);color:var(--indigo)}
.story{margin:10px 0 4px}
.story p{font-size:15px;line-height:1.75;margin:0 0 9px;color:var(--ink)}
.traitline{font-size:13.5px;line-height:1.6;color:var(--sub);margin:0 0 6px;
  padding-left:11px;border-left:2px solid var(--indigo-l)}
/* 되돌릴 수 없다는 알림 */
.note.warnnote{background:#fbecf2;border-color:#e3bccd;color:#8d2650;font-weight:700}
.rgroup{border:1px solid var(--line);border-radius:13px;padding:10px 11px;margin:9px 0;background:#fbfbff}
.rgroup .rhead{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.rgroup .rhead b{font-size:14px}
.rgroup .rhead span{font-size:11.5px;color:var(--indigo);font-weight:700}
.rgroup .rnote{font-size:12px;color:var(--sub);line-height:1.5;margin:4px 0 8px}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 11px;
  font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.rchip.on{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:700}
/* ── 6차 C-4. 잠긴 선택지 ── */
.choice.locked{opacity:.62;cursor:default;background:#f6f7fb;border-style:dashed}
.choice.locked .t{color:var(--sub)}
.choice .lk{margin-left:6px;font-size:10.5px;font-weight:800;color:var(--sub);
  background:var(--line);border-radius:5px;padding:1px 6px;vertical-align:1px}
.choice .lr{font-size:12px;color:var(--sub)}
/* ── 6차 C-1. 엔딩에서 라이벌의 결말 한 줄 ── */
.bubble em.fate{display:block;margin-top:5px;font-style:normal;font-size:12px;
  color:var(--sub);border-top:1px dashed var(--line);padding-top:5px}
.endwrap .bubble em.fate{color:#98a0c6;border-color:#3d456b}
h1,h2,h3{margin:0 0 8px;line-height:1.35}
p{margin:0 0 10px}

/* ══════════════════════════════════════════════════════════════════════
   5차 A-1 — 화면 위 고정 띠 (그림 + 상태 + 메뉴)
   선택지를 스크롤해도 그림이 위에 남는다. 스크롤을 내리면 조금 작아진다.
   ══════════════════════════════════════════════════════════════════════ */
/* 0-1. 높이는 고정한다. 스크롤에 따라 높이가 바뀌면 그만큼 문서가 줄고,
   그 때문에 스크롤 위치가 움직여 다시 높이가 바뀌는 떨림이 생긴다.
   0-2. 상태 막대는 그림 위에 겹치지 않고 그림 아래에 따로 놓는다. */
.hud{
  position:sticky;top:0;z-index:30;margin:0 -12px 10px;overflow:hidden;
  background:#eef0f7;border-bottom:1px solid var(--line);border-radius:0 0 18px 18px;
  display:flex;flex-direction:column;
}
.artbox{position:relative;height:clamp(118px,17.5vh,156px);flex:none;overflow:hidden}
/* ── 6차 D-1. 그림이 주인공인 화면 (경선 · 선거 운동 · 개표 · 토론) ──────────
   그림을 화면 위 절반까지 키우고, 선택지는 아래 작은 카드로 내린다.
   이때는 띠를 고정하지 않는다. 고정한 채 절반을 차지하면 선택지가 들어갈 자리가 없다. */
.hud.big{position:static}
/* 그림의 가로세로 비(320:300)를 그대로 써서 띠 안에 빈 자리가 남지 않게 한다 */
.hud.big .artbox{height:auto;aspect-ratio:320/300;max-height:48vh}
.hud.big .stage{position:relative;inset:auto;height:100%}
.hud.big .stage .piece.big{width:100%;height:100%;display:block}
.hud .stage{position:absolute;inset:0;height:100%;margin:0;border:0;border-radius:0}
.hud .stage[data-l]::after{top:4px}
/* 6.1차 4. 그림 접기 기능은 없앴다 — 접으면 메뉴 버튼까지 사라졌고, 큰 그림 화면과 기능이 겹쳤다 */
/* 윗줄 — 이름과 메뉴 */
.hudtop{
  position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:6px;
  padding:8px 12px 20px;color:#fff;font-size:12.5px;
  background:linear-gradient(180deg,rgba(26,29,42,.86) 0%,rgba(26,29,42,.62) 55%,rgba(26,29,42,0) 100%);
}
.hudtop .hwho{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hudtop .hwho b{font-size:14px}
.hudtop .htier{font-size:11px;font-weight:800;background:rgba(255,255,255,.18);border-radius:999px;
  padding:3px 9px;white-space:nowrap;border:1px solid rgba(255,255,255,.35);color:#fff;
  font-family:inherit;cursor:pointer}
.hudtop .htier:hover{background:rgba(255,255,255,.34)}
.hudtop .htier i{font-style:normal;letter-spacing:.5px}
/* ── 6차 A-1. 게이지와 원점 막대 ──────────────────────────────────────
   색만으로 구분하지 않는다. 게이지는 '칸 수'와 남은 칸 글자로, 빚은 '빗금'과
   '빚/여유' 글자로 읽힌다. */
.gwrap{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);display:grid;gap:5px}
.gauge,.axis{display:flex;align-items:center;gap:7px}
.gauge .gn,.axis .gn{font-size:11.5px;color:var(--sub);white-space:nowrap;width:46px;flex:none}
.gauge .gcells{flex:1;min-width:0;display:flex;gap:3px}
.gauge .gcells i{flex:1;height:12px;border-radius:3px;border:1.5px solid #cdd3e6;background:transparent}
.gauge .gcells i.on{background:var(--indigo);border-color:var(--indigo)}
.gauge.low .gcells i.on{
  background:var(--down);border-color:var(--down);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px);
}
.gauge .gcnt{font-size:11.5px;font-weight:800;color:var(--sub);min-width:26px;text-align:right}
.gauge.low .gcnt{color:var(--down)}
/* 원점이 3분의 1 지점에 있는 막대 */
.axis .atrack{position:relative;flex:1;min-width:0;height:12px;border-radius:3px;background:#eceef6}
.axis .afill{position:absolute;top:0;bottom:0;background:var(--indigo);border-radius:2px}
.axis.debt .afill{
  background:var(--down);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 3px,transparent 3px 7px);
}
.axis .azero{position:absolute;top:-3px;bottom:-3px;width:2px;background:#5f6679;z-index:2;transform:translateX(-1px)}
.axis .aw{font-size:11.5px;font-weight:800;color:var(--sub);min-width:26px;text-align:right}
.axis.debt .aw{color:var(--down)}
/* 잠재력 + 지금 등급을 나란히 (5차 보완 3) */
.scout.wide .srow{gap:8px}
.scout.wide .sg{width:30px;flex:none;text-align:right;font-size:14px;font-weight:800;color:var(--indigo)}
.scout.wide .srow.head{margin:2px 0 4px}
.scout.wide .srow.head .sv,.scout.wide .srow.head .sg{font-size:10.5px;font-weight:700;color:var(--sub)}
.scout .snote{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--sub);line-height:1.5}
.hbtn{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;
  border-radius:999px;padding:3px 10px;font:inherit;font-size:11.5px;font-weight:800;
  cursor:pointer;position:relative;white-space:nowrap;
}
.hbtn.menu{font-size:15px;line-height:1;padding:4px 10px 6px}
.hbtn:hover{background:rgba(255,255,255,.3)}
/* 아랫줄 — 상태 막대 여섯 칸 (A-2) */
/* 그림 아래에 따로 놓는다 — 실루엣을 가리지 않는다 (0-2) */
.hudbot{position:relative;z-index:3;padding:7px 12px 8px;background:var(--card);border-top:1px solid var(--line)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.scell{min-width:0}
.srow{display:flex;align-items:center;gap:5px}
.srow .sn{font-size:11.5px;color:var(--sub);white-space:nowrap}
/* 등급 글자 — 색이 아니라 글자로 읽힌다 (0-4) */
.srow .stier{margin-left:auto;font-size:15px;font-weight:800;color:var(--indigo);white-space:nowrap;
  letter-spacing:.3px;font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.sbar{height:5px;border-radius:99px;background:#dfe1ec;margin-top:2px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--indigo);border-radius:99px;transition:width .35s ease}
.scell.warn .stier{color:var(--down)}
.scell.warn .sbar i{background:var(--down)}
.sicon.mini{border-width:1.2px;border-radius:7px;padding:1px 3px 0;transform:scale(.72);transform-origin:left center;margin-right:-6px}
/* 메뉴 시트 (A-3) */
.sheetbg{position:fixed;inset:0;z-index:80;background:rgba(20,22,34,.45)}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:81;max-width:480px;margin:0 auto;
  background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:sheetUp .22s ease both;
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){ .sheet{animation:none} .hud{transition:none} }
/* 첫 판 도우미 안내 한 줄 (5차 C-3) */
.tipbar{
  position:relative;display:flex;align-items:flex-start;gap:8px;
  margin:8px 0 2px;background:var(--ink);color:#fff;border-radius:12px;
  padding:9px 32px 9px 11px;font-size:13px;line-height:1.45;
}
.tipbar .ti{
  flex:0 0 auto;width:17px;height:17px;border-radius:99px;background:#fff;color:var(--ink);
  font-size:11.5px;font-weight:800;line-height:17px;text-align:center;margin-top:1px;
}
.tipbar .tipx{
  position:absolute;top:6px;right:6px;background:none;border:0;color:#fff;opacity:.8;
  font:inherit;font-size:12.5px;cursor:pointer;padding:2px 6px;
}
/* 시작 화면과 설명 카드 (5차 C-3) */
.bigtitle{ font-size:31px;line-height:1.24;margin:4px 0 6px; }
.lead{ font-size:13.5px;line-height:1.6;color:var(--sub);margin:0 0 4px; }
.linkbtn{
  display:block;width:100%;background:none;border:0;color:var(--sub);
  font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:8px 4px 2px;
}
.howto .hohead{ display:flex;align-items:center;justify-content:space-between;gap:8px; }
.howto .hohead .linkbtn{ width:auto;padding:2px 2px; }
.howto .hoart{ display:block;width:100%;height:auto;border-radius:12px;margin:8px 0 10px;background:#eef1f8; }
.howto h2{ margin:2px 0 6px; }
.howto .desc{ margin:0 0 5px; }
.hdots{ display:flex;justify-content:center;gap:7px;margin:12px 0 10px; }
.hdot{
  width:9px;height:9px;padding:0;border-radius:99px;border:0;background:#cdd4e6;cursor:pointer;
}
.hdot.on{ background:var(--indigo);width:20px; }
.honav{ display:flex;gap:8px; }
.honav .btn{ flex:1;margin:0; }
/* 아래쪽 헤드라인 띠 */
.ticker{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-top:10px;
  background:var(--ink);color:#fff;border:0;border-radius:12px;padding:9px 12px;
  font:inherit;font-size:12.5px;cursor:pointer;
}
.ticker .tk{
  font-size:10px;font-weight:800;background:#fff;color:var(--ink);border-radius:4px;
  padding:1px 5px;white-space:nowrap;
}
.ticker .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:tkin .5s ease}
.ticker .tgo{font-size:11px;font-weight:700;opacity:.85;white-space:nowrap}
@keyframes tkin{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@media (prefers-reduced-motion: reduce){ .ticker .tx{animation:none} }
/* 턴 정리 화면의 '이번 5년의 여론' 카드 */
.opcard{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:12px}
.opcard .ol{font-size:12px;font-weight:800;color:var(--indigo);margin-bottom:2px}
.opmore{
  display:block;width:100%;margin-top:6px;background:none;border:0;border-top:1px dashed var(--line);
  padding:7px 0 0;font:inherit;font-size:12.5px;font-weight:700;color:var(--indigo);cursor:pointer;text-align:right;
}
/* 상태 아이콘 — 단계는 색이 아니라 점 개수로 구분 */
.sicon{
  background:#fff;border:1.5px solid var(--down);border-radius:10px;padding:2px 5px 0;
  color:var(--down);cursor:pointer;line-height:0;
}
.sicon:hover{background:#fbecf2}
/* 6.1차 6. 평온할 때도 늘 보이되 흐리게. 쌓일수록 진해지고 점이 는다.
   색만으로 구분되지 않게, 점 개수가 함께 늘어난다. */
.sicon.st-calm{border-color:#cdd3e4;color:#aeb5c9;opacity:.55}
.sicon.st-sign{border-color:#a9b1c8;color:#8790a8;opacity:.8}
.sicon.st-warn{border-color:#c98ba6;color:#b4577f;opacity:1}
.sicon.st-crisis{border-color:var(--down);color:var(--down);opacity:1;background:#fbecf2}
.iconnote{font-size:11.5px;color:var(--sub);flex:1;min-width:0}
/* 여론 피드 탭 (5차 A-4) */
.ftabs{display:flex;gap:6px;margin:10px 0 2px}
.ftab{flex:1;background:#f2f3f8;border:1.5px solid var(--line);border-radius:10px;padding:7px 6px;
  font:inherit;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer}
.ftab.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.ftabs.boxes{margin-top:4px}
/* ══════════════════════════════════════════════════════════════════════════
   6.1차 6-1 — 여론 글의 성격
   긍정은 인디고 + 위쪽 삼각형, 중간은 회색 + 가로줄, 부정은 짙은 자주 + 아래쪽 삼각형.
   빨강·파랑은 정당 색이 떠올라 쓰지 않았다. 색만이 아니라 기호로도 읽힌다.
   ══════════════════════════════════════════════════════════════════════════ */
.fitem .fk .fmk{font-size:9.5px;margin-right:3px;font-weight:900;line-height:1}
.fitem .fk.t-pos{background:var(--indigo-l);border:1px solid #bdb7ea;color:var(--indigo-d)}
.fitem .fk.t-mid{background:#eef0f6;border:1px solid #d3d8e6;color:var(--sub)}
.fitem .fk.t-neg{background:#f7e6ee;border:1px solid #dcaec4;color:#8d2650}
.fitem .fk.t-self{background:#e9e7f7;border:1px dashed #b9b2e2;color:var(--indigo-d)}
.fitem.alertitem .ft{font-weight:700}
/* 성격 비율 한 줄 막대 */
.tonebar{display:flex;gap:3px;margin:8px 0 2px;height:22px}
.tonebar .tb{display:flex;align-items:center;justify-content:center;gap:3px;
  border-radius:7px;font-size:11px;font-weight:800;min-width:26px;overflow:hidden;white-space:nowrap}
.tonebar .tb b{font-size:10px;line-height:1}
.tonebar .tb.t-pos{background:var(--indigo-l);color:var(--indigo-d);border:1px solid #bdb7ea}
.tonebar .tb.t-mid{background:#eef0f6;color:var(--sub);border:1px solid #d3d8e6}
.tonebar .tb.t-neg{background:#f7e6ee;color:#8d2650;border:1px solid #dcaec4}
/* 선택지 효과 표시 (5차 A-5) */
.efx{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.efx .ec{font-size:11.5px;font-weight:700;color:var(--sub);background:#f1f2f7;
  border:1px solid var(--line);border-radius:7px;padding:1px 7px;white-space:nowrap}
.efx .er{font-size:12px;font-weight:800;border-radius:7px;padding:1px 7px;white-space:nowrap;
  background:#eeedf8;color:var(--up)}
.efx .er.dn{background:#fbecf2;color:var(--down)}
/* ── 6.1차 5. 겉으로 드러나지 않는 영향 표시 ── */
.efx .sidemark{
  font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 7px;white-space:nowrap;
  background:#eef0f7;color:var(--sub);border:1px dashed #c3c9dc;cursor:pointer;
}
.efx .sidemark.risky{background:#fbecf2;color:var(--down);border-color:#e3bccd}
/* 그림이 주인공인 장면에서는 글 카드를 작게 (5차 A-1 · 6차 D-1) */
.hud.big ~ .card,.hud.big + .card{padding:11px 13px;margin-top:8px}
.hud.big ~ .card h3{font-size:16px;margin-bottom:5px}
.hud.big ~ .card .storyline{font-size:13.5px;line-height:1.55;margin-bottom:7px}
.hud.big ~ .card .choice{padding:9px 11px;margin-top:6px}
.hud.big ~ .card .choice .t{font-size:13.5px;line-height:1.4}
.hud.big ~ .card .choice .h{font-size:11.5px;margin-top:2px}
.hud.big ~ .card .btn{padding:11px;margin-top:8px}
/* 큰 그림 화면에서는 상태 막대를 한 줄로 접어 자리를 아낀다 */
.hud.big .hudbot{padding-top:7px;padding-bottom:7px}
.hud.big .hudbot .sgrid{display:none}
.hud.big .hudbot .gwrap{margin-top:0;padding-top:0;border-top:0}
/* 여론 피드 목록 */
.feedlist{margin-top:8px;max-height:60vh;overflow-y:auto}
.fitem{display:flex;gap:8px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.fitem:first-child{border-top:0}
.fitem .fk{
  font-size:10.5px;font-weight:800;border:1.5px solid var(--line);border-radius:5px;
  padding:1px 5px;color:var(--sub);white-space:nowrap;
}
.fitem.f-news .fk{border-color:var(--indigo);color:var(--indigo)}
.fitem.f-rival .fk{border-color:var(--down);color:var(--down)}
.fitem .ft{flex:1;min-width:0}
.fitem .fa{font-size:11px;color:var(--sub);white-space:nowrap}
/* 상대 후보 소개 */
.rivalbox{border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;margin:8px 0}
.rivalbox .rn{font-size:16px;font-weight:800}
.rivalbox .ro{font-size:12.5px;color:var(--sub);margin-top:1px}
.rivalbox .rw{font-size:12.5px;font-weight:700;color:var(--indigo);margin-top:5px}
.rivalbox .rw.dim{color:var(--sub);font-weight:400}
.rivalbox .nem{font-size:11px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:1px 8px;vertical-align:3px}
/* 주변 인물 한마디 */
.confidant{
  border-left:3px solid var(--indigo);background:var(--indigo-l);border-radius:0 10px 10px 0;
  padding:8px 12px;margin-top:10px;font-size:13.5px;
}
.confidant b{color:var(--indigo)}
/* 시대 흐름 뉴스 줄 */
.newsbar{
  background:var(--ink);color:#fff;border-radius:12px;padding:8px 12px;margin:10px 0 0;
  font-size:13px;line-height:1.5;
}
.newsbar .nb{
  display:inline-block;font-size:10.5px;font-weight:800;background:#fff;color:var(--ink);
  border-radius:4px;padding:1px 5px;margin-right:7px;vertical-align:1px;
}
/* 위기 화면 */
.crisiscard{border-color:var(--down);border-width:2px}
.warnkicker{color:var(--down)}
.choice.quiet{border-style:dashed;background:#fafaff}
.tlline.warn .tt{color:var(--down);font-weight:700}
.warnline{
  grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--down);
  background:#fbecf2;border:1px solid var(--down);border-radius:9px;padding:4px 8px;text-align:center;
}

/* ══════════════════════════════════════════════════════════════════════
   C 묶음 — 연출 무대 (인라인 SVG + CSS 애니메이션)
   배경은 옅게, 글 카드는 흰색. 휴대폰 세로에서 선택지를 가리지 않도록
   높이를 낮게 잡고 카드 위에만 둔다.
   ══════════════════════════════════════════════════════════════════════ */
.stage{
  position:relative;height:96px;margin:10px 0 0;border-radius:16px;overflow:hidden;
  background:#eef0f7;border:1px solid var(--line);
}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .sky{z-index:0}
.stage .bg{z-index:1}
.stage .piece{z-index:1}
.stage[data-l]::after{
  content:attr(data-l);position:absolute;left:10px;top:8px;z-index:4;
  font-size:10.5px;font-weight:800;color:var(--sub);
  background:rgba(255,255,255,.82);border-radius:5px;padding:1px 6px;
}
/* 움직임 */
@keyframes swayIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stage .piece,.stage .bg{animation:swayIn .35s ease}
@keyframes cloudDrift{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.sky .cl1{animation:cloudDrift 9s ease-in-out infinite alternate}
.sky .cl2{animation:cloudDrift 13s ease-in-out infinite alternate-reverse}
@keyframes rainFall{from{transform:translateY(-6px);opacity:.2}to{transform:translateY(10px);opacity:.9}}
.sky .rain,.stage .rain{animation:rainFall 1.1s linear infinite}
/* 번개는 늘 보인다(모양으로 구분해야 하므로). 번쩍임은 밝기만 바꾼다. */
@keyframes boltBlink{0%,100%{opacity:.5}46%,52%{opacity:1}}
.sky .bolt,.stage .bolt{animation:boltBlink 3.4s linear infinite}
@keyframes sunTurn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sky .sun g{transform-origin:258px 34px;animation:sunTurn 40s linear infinite}
/* 폭죽도 늘 보인다. 터지는 느낌은 크기로만 낸다. */
@keyframes fwPop{0%{opacity:.45;transform:scale(.6)}45%{opacity:1;transform:scale(1)}100%{opacity:.45;transform:scale(1.25)}}
.stage .fw > g > g{animation:fwPop 1.9s ease-out infinite;transform-origin:center}
.stage .fw > g:nth-child(2) > g{animation-delay:.7s}
.stage .fw > g:nth-child(3) > g{animation-delay:1.2s}
@keyframes knotSlide{from{transform:translateX(-14px)}to{transform:translateX(0)}}
.stage .knot{animation:knotSlide .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes seesawTip{from{transform:rotate(0)}}
.stage .seesaw{transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
@keyframes markPop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.stage .mk{animation:markPop .45s ease-out both;transform-origin:center}
@keyframes seatMove{from{transform:translateY(0)}}
.stage .seat{transition:transform .4s ease}
@keyframes paperFly{from{opacity:0;transform:translate(120px,-70px) rotate(22deg) scale(.5)}to{opacity:1;transform:none}}
.stage .sheet{animation:paperFly .55s cubic-bezier(.2,.9,.3,1) both;transform-origin:center}
@keyframes stampIn{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:scale(1)}}
.stage .stamp{animation:stampIn .45s ease-out .5s both;transform-origin:center}
@keyframes barGrow{from{width:0}}
.stage .bar{animation:barGrow .9s cubic-bezier(.2,.8,.3,1) both}
.stage .bar.late{animation-delay:.5s;animation-duration:1.1s}
/* 불이 하나씩 꺼진다. 마지막 한 칸은 끝까지 켜져 있다. */
@keyframes lightOut{to{opacity:.14}}
.stage .lights rect{animation:lightOut .5s linear both}
.stage .lights .l1{animation-delay:.2s}.stage .lights .l2{animation-delay:.9s}
.stage .lights .l3{animation-delay:.5s}.stage .lights .l4{animation-delay:1.5s}
.stage .lights .l5{animation-delay:1.1s}.stage .lights .l6{animation-delay:1.9s}
.stage .lights .l7{animation-delay:2.4s}
.stage .lights .l8{animation:none;opacity:1}
@keyframes chalkIn{from{opacity:0}to{opacity:1}}
.stage .chalk{animation:chalkIn .8s ease both}
/* 위기 — 화면 가장자리가 살짝 흔들린다 */
@keyframes shakeEdge{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}
                     40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.stage.shake{animation:shakeEdge .5s ease 2}
.crisiscard.shake{animation:shakeEdge .5s ease 2}
.crisiscard .sicon{transform:scale(1.35)}
/* 휴대폰 세로에서는 무대를 더 낮게 잡아 선택지를 위로 끌어올린다 (설계 C-1) */
@media (max-width:420px){
  .stage{height:78px;margin-top:8px}
  .stage[data-l]::after{font-size:10px;left:8px;top:6px}
}
/* 움직임 줄이기 설정이면 전부 정지 그림으로 (설계 C-1) */
@media (prefers-reduced-motion: reduce){
  .stage *,.stage,.crisiscard{animation:none !important;transition:none !important}
}

/* ══════════════════════════════════════════════════════════════════════
   D 묶음 — 엔딩 5장과 도감
   ══════════════════════════════════════════════════════════════════════ */
/* 5차 C-2. 엔딩 화면은 짙은 남색 바탕에 밝은 글자 */
body.ending{background:#171a2b}
.endwrap{padding-top:16px;color:#e8eaf4}
.endwrap::before{content:'';position:fixed;inset:0;background:#171a2b;z-index:-1}
.endwrap .card{background:#222741;border-color:#333a5c;color:#e8eaf4}
.endwrap .kicker{color:#9aa3cc}
.endwrap .desc,.endwrap .small{color:#a6adcd}
.endwrap .storyline{color:#dfe3f4}
.endwrap .divider{background:#333a5c}
.endwrap .rowline{border-color:#333a5c}
.endwrap .rowline .k{color:#a6adcd}
.endwrap .rowline .v{color:#fff}
.endwrap .btn.ghost{background:transparent;color:#cfd5ee;border:1.5px solid #3d456b}
.endwrap .chron{border-color:#333a5c}
.endwrap .chron summary{color:#a6adcd}
.endwrap .list li{border-color:#333a5c;color:#cfd5ee}
.endwrap .ecard{background:#252b48;border-color:#39406a;color:#e8eaf4}
.endwrap .ecard.locked{background:#1e2338;color:#8188ad}
.endwrap .ecard .eh,.endwrap .ecard .el{color:#98a0c6}
.endwrap .bookbar .bb{background:#333a5c}
.endwrap .bgroup .gl{color:#9aa3cc}
.endwrap .bubble{background:#2a3052}
.endwrap .bubble.b1{background:#242a45}
.endwrap .bubble b{color:#aab3e0}
.endwrap .card.dict{background:#232a4a;border-color:#5b63a8}
.endwrap .dict .dtitle{color:#aab3e0}
.endwrap .dict .dline{color:#a6adcd}
.endwrap .newend{background:#0f1220;color:#e8eaf4}
.endwrap .cdot{background:#222741;border-color:#3d456b}
.endwrap .crow::before{background:#333a5c}
.endwrap .ct{color:#9aa3cc}
.endwrap .storyline.despite{border-color:#3d456b;color:#aab3e0}
.endwrap .mline.now{color:#fff}
.endwrap .mline.past{color:#98a0c6}
.endwrap .ptext .phead{color:#1e2230}   /* 신문 1면은 흰 종이 그대로 */
.endwrap .ptext .psub{color:#5f6679}
/* 엔딩 장면 */
.endart{position:relative;margin:0 -12px 12px;height:clamp(150px,24vh,210px);overflow:hidden;border-radius:0 0 18px 18px}
.endart .endscene{width:100%;height:100%;display:block;animation:swayIn .5s ease}
.endart .endlabel{position:absolute;left:14px;bottom:10px;font-size:11px;font-weight:800;
  white-space:nowrap;color:#cfd5ee;background:rgba(15,18,32,.72);border-radius:6px;padding:3px 9px}
.endscene .flash{animation:flashPop 2.4s linear infinite}
@keyframes flashPop{0%,88%,100%{opacity:.25}90%,94%{opacity:1}}
/* 한 줄씩 나타나는 연대기 */
.chronocard{cursor:pointer}
.crow.now{animation:rowIn .34s ease both}
@keyframes rowIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.crow.key.now .cdot{animation:starPop .5s ease both}
@keyframes starPop{0%{transform:scale(1)}45%{transform:scale(2.1)}100%{transform:scale(1.35)}}
.crow.key .cdot{transform:scale(1.35)}
.crow.key .ckey{background:#fff;color:#171a2b}
@media (prefers-reduced-motion: reduce){
  .endart .endscene,.crow.now,.crow.key.now .cdot,.endscene .flash{animation:none}
}
.endnav{display:flex;align-items:center;gap:5px;margin:0 2px 10px}
.endnav .ed{width:22px;height:4px;border-radius:99px;background:var(--line)}
.endnav .ed.on{background:var(--indigo)}
.endnav .ec{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:.5px}
/* 1장. 결정적 순간 — 한 문장씩 */
.card.moment{min-height:190px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.mline{font-size:17px;line-height:1.62;margin:6px 0;text-align:center}
.mline.past{color:#9aa0b3;font-size:15px}
.mline.now{color:var(--ink);font-weight:700;animation:mIn .5s ease both}
@keyframes mIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 2장. 신문 1면 */
.paperwrap{position:relative;margin:10px 0;overflow:hidden}
.paperwrap .front{display:block;width:100%;height:auto;animation:paperFly .6s cubic-bezier(.2,.9,.3,1) both}
.paperwrap .ptext{position:absolute;left:0;top:0;width:100%;padding:38px 16px 0;pointer-events:none}
.paperwrap .phead{font-size:21px;font-weight:800;line-height:1.24;color:#1b1d2a;width:56%;word-break:keep-all}
.paperwrap .psub{margin-top:7px;font-size:12px;color:#5f6679;width:56%;word-break:keep-all}
/* 3장. 걸어온 길 */
.chrono{margin-top:6px;position:relative;padding-left:4px}
.crow{display:flex;gap:10px;padding:8px 0;position:relative}
.crow::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}
.crow:first-child::before{top:14px}
.crow:last-child::before{bottom:calc(100% - 14px)}
.cdot{width:12px;height:12px;border-radius:99px;background:#fff;border:2.5px solid var(--line);
  flex:none;margin-top:3px;position:relative;z-index:1}
.crow.key .cdot{border-color:var(--indigo);background:var(--indigo)}
.cbody{flex:1;min-width:0}
.ct{display:block;font-size:11px;font-weight:800;color:var(--sub)}
.cl{display:block;font-size:14px;margin-top:1px;word-break:keep-all}
.cstar{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;color:var(--indigo)}
.ckey{display:inline-block;margin-top:3px;margin-left:8px;font-size:11px;font-weight:700;
  color:#fff;background:var(--indigo);border-radius:99px;padding:1px 8px}
/* 4장. 사람들의 말 */
.bubble{position:relative;margin:10px 0 14px;padding:11px 14px;border-radius:14px;font-size:14.5px;
  background:var(--indigo-l);word-break:keep-all}
.bubble.b1{background:#f1f2f6}
.bubble b{display:block;font-size:11.5px;font-weight:800;color:var(--indigo);margin-bottom:3px}
.bubble.b1 b{color:var(--sub)}
.bubble::after{content:'';position:absolute;left:18px;bottom:-7px;width:13px;height:13px;
  background:inherit;transform:rotate(45deg)}
/* 5장. 인물 사전 */
.card.dict{border:2px solid var(--indigo);background:#fbfbff}
.dict .dname{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.dict .dtitle{font-size:15px;font-weight:800;color:var(--indigo);margin-top:2px}
.dict .dline{font-size:12.5px;color:var(--sub);margin-top:3px}
.newend{background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;margin:10px 0;
  font-size:13px;font-weight:700;text-align:center}
.storyline.despite{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);
  font-weight:700;color:var(--indigo)}
/* 도감 */
.bookbar{display:flex;align-items:center;gap:9px;margin:4px 0 12px}
.bookbar .bt{font-size:12.5px;font-weight:800;color:var(--indigo);white-space:nowrap}
.bookbar .bb{flex:1;min-width:0;height:8px;border-radius:99px;background:#e9eaf1;overflow:hidden}
.bookbar .bb i{display:block;height:100%;background:var(--indigo);border-radius:99px}
.bookbar .bp{font-size:11.5px;color:var(--sub);white-space:nowrap}
.bgroup{margin-top:12px}
.bgroup .gl{font-size:11.5px;font-weight:800;color:var(--sub);margin-bottom:6px}
.bcards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ecard{display:block;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:11px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
.ecard.open{grid-column:1/-1;border-color:var(--indigo)}
.ecard.locked{background:#f6f6fa;color:var(--sub);cursor:default;display:flex;gap:7px;align-items:flex-start}
.ecard .en{display:block;font-size:13px;font-weight:800;word-break:keep-all}
.ecard .eh{display:block;font-size:11px;color:var(--sub);margin-top:2px;word-break:keep-all}
.ecard .el{display:block;font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6;
  border-top:1px dashed var(--line);padding-top:6px}
.ecard .esil{flex:none;margin-top:2px;opacity:.45}

/* ---------- 잠재력 표 (타고난 재능의 배분) ---------- */
.scout{border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;margin:12px 0 4px;background:#fcfcff}
.scout .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.scout .st{font-size:15px;font-weight:800;letter-spacing:.5px;color:var(--ink)}
.scout .sn{font-size:11px;color:var(--sub);white-space:nowrap}
.scout .srow{display:flex;align-items:center;gap:9px;margin:7px 0}
.scout .sl{font-size:12.5px;font-weight:700;color:var(--sub);width:66px;flex:none;white-space:nowrap}
.scout .sv{font-size:16px;font-weight:800;color:var(--indigo);width:42px;flex:none;text-align:right;
  font-variant-numeric:tabular-nums}
.scout .sb{flex:1;min-width:0;height:9px;border-radius:99px;background:#e9eaf1;overflow:hidden}
.scout .sb i{display:block;height:100%;border-radius:99px;animation:scoutGrow .7s cubic-bezier(.2,.8,.3,1) both}
/* 아직 열리지 않은 칸 (5차 B) */
.scout .srow.closed .sl,.scout .srow.closed .sv{color:#aeb3c4}
.scout .srow.closed .sv{font-size:17px}
.scout .sb i.q{width:100%;background:repeating-linear-gradient(90deg,#e4e6ef 0 6px,transparent 6px 12px);animation:none}
/* 재능을 알게 된 줄 (연대기) */
.tlline.reveal .tt{color:var(--indigo);font-weight:700}
.tlline.reveal .rv{
  display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--indigo);
  border-radius:5px;padding:1px 6px;margin-right:5px;vertical-align:1px;
}
@keyframes scoutGrow{from{width:0 !important}}
@media (prefers-reduced-motion: reduce){ .scout .sb i{animation:none} }

/* ---------- 카드 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
.kicker{font-size:12px;font-weight:700;color:var(--indigo);letter-spacing:.4px;margin-bottom:4px}
.desc{color:var(--sub);font-size:14px}
.divider{height:1px;background:var(--line);margin:12px 0}

/* ---------- 버튼 ---------- */
.choice{
  display:block;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;
  font:inherit;color:var(--ink);cursor:pointer;
}
.choice:hover{border-color:var(--indigo);background:var(--indigo-l)}
.choice .t{font-weight:700;font-size:15px}
.choice .h{font-size:13px;color:var(--sub);margin-top:2px}
.choice .tag{
  display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--indigo);
  border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px;
}
.choice .tag.rec{background:var(--down)}
/* 이미 쓴 방식 — 흐리게 + 점선 + '이미 사용함' 글자 (색만으로 구분하지 않는다) */
.choice.used{opacity:.42;border-style:dashed;cursor:default;background:#fafafd}
.choice.used:hover{border-color:var(--line);background:#fafafd}
.choice .tag.used{background:#fff;color:var(--sub);border:1.5px solid var(--line);padding:0 7px}
.btn{
  display:block;width:100%;background:var(--indigo);color:#fff;border:0;border-radius:14px;
  padding:15px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:12px;
}
.btn:hover{background:var(--indigo-d)}
.btn.ghost{background:#fff;color:var(--indigo);border:1.5px solid var(--indigo)}
input[type=text]{
  width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font:inherit;
}
input[type=text]:focus{outline:none;border-color:var(--indigo)}
.seg{display:flex;gap:8px;margin-top:8px}
.seg button{
  flex:1;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-weight:700;cursor:pointer;color:var(--ink);
}
.seg button[aria-pressed=true]{background:var(--indigo);color:#fff;border-color:var(--indigo)}

/* ---------- 결과/변화량 ---------- */
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.delta{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;border:1.5px solid}
.delta.up{color:var(--up);border-color:var(--up);background:#eeecfa}
.delta.down{color:var(--down);border-color:var(--down);background:#fbecf2}
.note{font-size:12.5px;color:var(--sub);background:#fafaff;border:1px dashed var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
.list{margin:0;padding-left:18px;font-size:14px}
.list li{margin-bottom:3px}
.rowline{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.rowline:last-child{border-bottom:0}
.rowline .k{color:var(--sub)}
.rowline .v{font-weight:700;text-align:right}
.center{text-align:center}
.small{font-size:12.5px;color:var(--sub)}
.badge{display:inline-block;font-size:12px;border:1.5px solid var(--indigo);color:var(--indigo);border-radius:999px;padding:2px 10px;margin:3px 4px 0 0}
.storyline{font-size:16px;line-height:1.7;margin:4px 0 0}
/* 한 화면에서 여러 개를 고르는 선택 (공약 + 선거 운동) */
.group{margin-top:14px}
.group>.gl{font-size:12px;font-weight:700;color:var(--indigo);margin-bottom:6px}
.btn[disabled]{background:#c9c8dd;cursor:not-allowed}
/* 선거 결과 */
.bigresult{text-align:center;font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--indigo);margin:6px 0}
.bigresult.lost{color:var(--down)}
/* ── 계획 화면 (단계적으로 펼쳐짐) ── */
.planstep{margin-top:16px;animation:slideIn .32s ease}
.planstep:first-of-type{margin-top:8px}
@keyframes slideIn{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
.planstep .sl{font-size:12px;font-weight:700;color:var(--indigo);margin-bottom:2px}
.planstep .sq{font-size:14.5px;margin-bottom:8px}
/* 이미 고른 단계는 접혀서 한 줄로 보인다. 누르면 다시 고를 수 있다. */
.picked{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--indigo-l);
  border:1.5px solid var(--indigo);border-radius:13px;padding:11px 13px;font:inherit;color:var(--ink);cursor:pointer;
}
.picked .pk{font-size:11px;font-weight:700;color:var(--indigo);white-space:nowrap}
.picked .pv{font-weight:700;font-size:14.5px;flex:1;min-width:0}
.picked .pe{font-size:11px;color:var(--sub);white-space:nowrap}
.picked[data-locked=true]{background:#f7f7fb;border-color:var(--line);cursor:default}
.recheck{
  font-size:12.5px;color:var(--down);background:#fbecf2;border:1px dashed var(--down);
  border-radius:10px;padding:7px 10px;margin-top:8px;
}
/* ── 타임라인 ── */
.tlwrap{min-height:330px;display:flex;flex-direction:column}
.tlage{
  text-align:center;font-size:44px;font-weight:800;letter-spacing:-2px;color:var(--indigo);
  line-height:1.05;margin:2px 0 0;
}
.tlage small{display:block;font-size:12px;font-weight:700;letter-spacing:0;color:var(--sub);margin-top:2px}
/* 기록장 — 줄이 계속 쌓이고, 길어지면 이 안에서만 스크롤된다 */
.tlfeed{margin-top:14px;flex:1;max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* 6차 A-2. 선택창이 떠 있을 때의 타임라인 — 아래로 내려가고 낮게 접힌다 */
.tlwrap.compact{min-height:0;opacity:.92}
.tlwrap.compact .tlage{font-size:22px;letter-spacing:-1px;margin:0}
.tlwrap.compact .tlage small{display:inline;margin-left:3px;font-size:11px}
.tlwrap.compact .tlfeed{margin-top:8px;max-height:19vh}
/* 이벤트·갈림길·위기 카드는 화면에 먼저 온다 */
.card.evcard{margin-top:0}
/* 6차 B-2. 은퇴 후의 삶 */
.retirecard .retfeed{max-height:none;margin:10px 0 4px;padding:10px 0;
  border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.retirecard .sq{margin:12px 0 8px;font-size:14px;font-weight:700}
/* 턴 정리 화면의 접히는 연대기 */
details.chron{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#fafaff;padding:6px 12px}
details.chron summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--indigo);list-style:none;padding:6px 0}
details.chron summary::-webkit-details-marker{display:none}
details.chron summary::before{content:'▸ '}
details.chron[open] summary::before{content:'▾ '}
details.chron .tlline{font-size:13.5px}
.tlline{
  display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line);
  animation:fadeUp .26s ease; font-size:14.5px;
}
.tlline:first-child{border-top:0}
.tlline .ta{font-size:11.5px;font-weight:700;color:var(--indigo);min-width:30px;padding-top:2px}
.tlline .tt{flex:1;min-width:0}
.tlline.dim .tt{color:var(--sub)}
@keyframes fadeUp{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.tlhint{text-align:center;font-size:12px;color:var(--sub);margin-top:10px}
.tlskip{
  display:block;margin:8px auto 0;background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:9px 18px;font:inherit;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;
}
.tlskip:hover{border-color:var(--indigo);color:var(--indigo)}
.arrows{font-weight:700;font-size:13px;white-space:nowrap}
.arrows .up{color:var(--up)} .arrows .dn{color:var(--down)}
/* 움직임 줄이기 설정이 켜져 있으면 애니메이션을 끈다 */
@media (prefers-reduced-motion:reduce){
  .planstep,.tlline{animation:none}
  .stat .fill{transition:none}
  html{scroll-behavior:auto}
}
html{scroll-behavior:smooth}
@media (min-width:520px){ #app{padding-top:4px} }
</style>

<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================================
   대통령 되기 시뮬레이터 — 턴 0(고교) ~ 턴 3(30~35세)
   ----------------------------------------------------------------------------
   [코드를 몰라도 고치는 법]
   · 숫자만 바꾸고 싶다 → [1] CONFIG 만 보세요.
   · 문구/선택지를 바꾸고 싶다 → [5] TURNS 안의 label, hint, result 를 고치세요.
   · 이벤트를 바꾸고 싶다 → [6] EVENTS 안의 text 와 success/fail 을 고치세요.
   · 턴을 새로 추가하고 싶다 → TURNS 배열 끝에 같은 모양의 턴 객체를 하나 붙이고,
     EVENTS 에 turn:'t4' 같은 이벤트를 넣으면 끝입니다. 엔진은 고칠 필요 없습니다.
     (마지막 턴이 끝나면 자동으로 결과 화면으로 갑니다)

   [선택지 한 개의 모양]
     { label:'보이는 이름', hint:'작은 설명',
       effects:{ policy:+8, stamina:-4 },   // 능력치 변화
       pt:5,                                // 이번 턴 성과 점수(등급 판정에 쓰임)
       result:'고른 뒤 나오는 문구',
       lowBlocked:true                      // '하' 등급이면 이 선택지는 막힘
     }
============================================================================ */

/* ============================================================================
   [1] CONFIG — 임시 수치 모음. 설계 문서에 없는 숫자는 전부 여기 있습니다.
   ============================================================================ */
const CONFIG = {
  /* ══════════════════════════════════════════════════════════════════════
     4차 B-1 — 한 판의 길이. 이 칸만 고치면 턴 수와 '마지막 기회' 문구가 따라온다.
     ══════════════════════════════════════════════════════════════════════ */
  lifespan:{
    maxAge:65,          /* 이 나이에 이야기가 끝난다 (본격판 65세, 가벼운 판이면 55로) */
    lateFrom:40,        /* 이 나이부터 '대선에 나갈 수 있는 턴'이 시작된다 */
    yearsPerTurn:5,     /* 후반 턴 하나의 길이 */
    maxPresRuns:5,      /* 대선에 나갈 수 있는 최대 횟수 */
    /* 이 나이가 넘거나 체력이 이 아래면, 대선 준비기에 '몸을 챙기는 길'이 하나 더 열린다 */
    restOfferAge:51, restOfferStamina:45
  },

  /* 초기값 근거: 고1이라 능력치는 낮게(10) 두고, 청렴도만 "아직 깨끗하다"는 뜻으로
     60에서 시작해 깎이는 자원처럼 쓰이게 했다. 체력도 젊으니 70. */
  startStats:{ speech:10, policy:10, org:10, integrity:60, fame:5, stamina:70, approval:2, funds:0 },
  statMin:0, statMax:100,

  /* 등급 판정(임시 공식)
     점수 = 이번 턴 선택들의 pt 합 + (연설·정책·조직·인지도 평균 ÷ 5) + 무작위
     근거: 노력(pt)이 절반 이상을 차지하되 무작위 0~9로 결과가 뻔해지지 않게 함. */
  grade:{
    randomRange:9,        // 일반 진로 무작위 폭 0~9
    entRandomRange:22,    // 방송만 무작위 폭을 크게 (설계 5번: 대박과 무명이 갈림)
    entRandomOffset:-8,   // 방송 무작위는 -8 ~ +14 (평균은 살짝 낮고 편차는 훨씬 큼)
    statDivisor:5,        // 능력치 평균을 나누는 값 (작을수록 능력치 영향 커짐)
    cuts:{                // 턴별 상/하 경계 점수
      t1:{ high:23, low:15 },
      t2:{ high:24, low:16 },  /* 정치 씨앗이 성과 점수를 깎아 다른 턴보다 낮게 잡음 */
      t3:{ high:29, low:21 },
      /* 턴 4는 선거 직전에 판정한다. 40세 무렵이면 능력치가 높아 점수도 크게 나오므로 기준도 높다.
         4차 B-2에서 이벤트가 늘어 점수가 전반적으로 올라가자 35~40세 당선률이 63%까지 치솟았다.
         28/22 → 31/25 로 올려 원래 수준(무작위 56% 안팎)으로 되돌렸다. */
      t4:{ high:31, low:25 }
    },
    lowStreakEventChance:0.5  // '하' 2턴 연속 시 늦깎이 반전 이벤트가 뜰 확률
  },

  /* 이벤트 판정(임시): 해당 능력치 + 무작위(0~20) >= 목표치(dc) 면 성공.
     근거: 능력치를 키우면 확실히 유리하되, 20이라는 폭 덕분에 항상 성공하진 않음. */
  eventRandomRange:20,

  earlyDebutChance:0.35,  // 고교에서 창작·공연 동아리를 고른 방송 진로의 조기 데뷔 보너스 확률

  /* 최종 점수(임시): 능력치 합 + 지지율×2 + 정치자금 + 등급 보너스 + 정치 경력 보너스 */
  scoreGradeBonus:{ high:15, mid:8, low:3 },
  /* 정치 경력 보너스(임시) — 대선 설계가 나오면 다시 맞춰야 함 */
  /* 출마하지 않은 원외 인사가 늘 손해만 보지 않도록 보너스를 높게 잡았다.
     (설계 9번: 어떤 선택도 순수한 손해만 주지 않는다) */
  scoreCareerBonus:{ district:60, proportional:50, mayor:45, local:30, defeated:20, outside:55 },

  /* 35~40세 선거 판정(전부 임시값)
     등급은 당락을 확정하지 않고 '당선 확률'만 정한다. 같은 등급이라도 결과가 갈린다. */
  election:{
    baseWinChance:{ high:80, mid:50, low:20 },     // 등급별 기본 당선 확률(%)
    typeAdjust:{ local:15, proportional:10, district:0, mayor:-10, indep:-15 }, // 선거 종류 보정(%p)
    attackBonus:5, attackPenalty:5,                // 공세 이벤트 대응 결과 보정(%p)
    /* 4차: 청렴도가 이 선거에도 직접 영향을 준다.
       이것이 없을 때는 '일부러 망친' 플레이의 당선률이 51%로, 잘한 플레이(54%)와 거의 같았다.
       (청렴도를 깎는 선택이 대체로 능력치·성과를 크게 올려 주기 때문)
       깨끗한 쪽에 상을 주지 않고 더러운 쪽만 깎는다. 선거 시점의 청렴도 분포가
       잘한 플레이 100%가 70 이상, 막 플레이 87%가 40~54 구간이라,
       40~54 칸만 깊게 파면 무작위·잘한 플레이는 건드리지 않고 막 플레이만 떨어진다.
       위에서부터 먼저 맞는 칸을 쓴다. */
    integrityAdjust:[
      { min:70, add:0 },     // 우수 이상 — 손해도 이득도 없음
      { min:55, add:-5 },    // 슬슬 말이 나온다
      { min:40, add:-42 },   // 평판에 금이 갔다. 표가 눈에 띄게 떨어져 나간다
      { min:0,  add:-55 }    // 이 정도면 조직도 등을 돌린다
    ],
    minChance:5, maxChance:95,                     // 어떤 경우도 당락이 확정되지 않게 제한

  if(!s) return [];
  var out = [];
  var sib = !!(s.family && s.family.sibHas);
  var bg = s.background || 'normal';
  /* 1) 부모 */
  if(s.family) out.push(s.family.jobLine);
  /* 2) 형제자매 */
  if(s.family) out.push(s.family.sibLine);
  /* 3) 집안 형편 */
  var m = CHILDHOOD.money[bg] || CHILDHOOD.money.normal;
  out.push(sib ? m.withSib : m.alone);
  /* 4) 마무리 */
  out.push(CHILDHOOD.close[bg + '_' + (sib ? 'sib' : 'alone')] || CHILDHOOD.close.normal_alone);
  return out;
}

               sib:sib.id, sibName:sib.name, sibHas:sib.has, sibLine:sib.line };

/* 서로 어긋나는 목표 — 한쪽을 하면 다른 쪽이 어려워진다.
   세 개를 한꺼번에 이루지 못하게 하려고 반드시 이 가운데 한 짝을 넣는다. */
const MEDAL_CONFLICT = [
  ['cleanThirty','bigDonor'],    /* 큰 후원을 받으면 청렴도가 깎인다 */
  ['cleanThirty','machineMan'],  /* 총동원도 청렴도를 깎는다 */
  ['noDebt','ownParty'],         /* 내 당을 만들면 돈이 크게 나간다 */
  ['noDebt','machineMan'],       /* 총동원은 돈을 크게 쓴다 */
  ['sturdy','machineMan'],       /* 총동원은 몸으로 때운다 */
  ['kept','ownParty']            /* 새 당은 공약을 처음부터 다시 짠다 */
];
function rollMedals(s){
  var pair = MEDAL_CONFLICT[rnd(MEDAL_CONFLICT.length - 1)];
  var picked = pair.map(medalDef).filter(Boolean);
  /* 남은 자리는 나머지에서 아무거나 */
  var rest = MEDALS.filter(function(m){ return pair.indexOf(m.id) < 0; });
  while(picked.length < CONFIG.medal.perGame && rest.length){
    picked.push(rest.splice(rnd(rest.length - 1), 1)[0]);
  }
  /* 보여 주는 차례는 섞는다 (어긋나는 짝이 늘 맨 앞에 오지 않게) */
  for(var i = picked.length - 1; i > 0; i--){
    var j = rnd(i), t = picked[i]; picked[i] = picked[j]; picked[j] = t;
  }
  s.medals = picked.map(function(m){ return { id:m.id, done:false }; });
}
function medalDef(id){ return MEDALS.filter(function(m){ return m.id === id; })[0]; }
/* 달성했는지 살펴본다. 달성하면 보상을 주고 알림을 띄운다. */
function checkMedals(s){
  if(!s || !s.medals) return;
  s.medals.forEach(function(row){
    if(row.done) return;
    var def = medalDef(row.id);
    if(!def) return;
    var ok = false;
    try{ ok = !!def.check(s); }catch(e){ ok = false; }
    if(!ok) return;
    row.done = true;
    row.age = s.curAge;
    /* 시험용 코드가 '보상이 없을 때'와 비교할 수 있게 하는 스위치 (평소에는 항상 준다) */
    if(!(typeof window !== 'undefined' && window.__noMedalReward)) applyEffects(s, def.reward);
    s.medalToast = def.name;
    pushAlert(s, '메달 — ' + def.name);   /* 6.1차 6-2 */
    if(s.tlFeed) s.tlFeed.push({ age:s.curAge, text:'메달 — ' + def.name, medal:true });
  });
}
function medalsDone(s){ return (s.medals || []).filter(function(m){ return m.done; }).length; }

/* 등급에 따라 선택지를 조립한다. (설계 9번 규칙)
   상 = 기본 + 고급 1개 / 중 = 기본만 / 하 = 기본 중 일부 막힘 + 회복 1개 */
function graded(set, grade){
  let list = (set.base||[]).filter(function(o){ return !(grade==='low' && o.lowBlocked); });
  /* 딱지에 등급 이름을 쓰지 않는다. 이야기 느낌의 단어만 붙인다. */
  if(grade==='high' && set.high) list = list.concat(set.high.map(function(o){ return Object.assign({}, o, {tag:'새 기회'}); }));
  if(grade==='low'  && set.low ) list = list.concat(set.low.map(function(o){ return Object.assign({}, o, {tag:'재기', tagKind:'rec'}); }));
  return list;
}
/* ── 6차 A-2. 조사 오류를 한곳에서 없앤다 ─────────────────────────────────
   이름은 판마다 무작위라 '{rival}이 / {rival}가'를 문구마다 손으로 맞출 수 없다.
   fill() 이 이름을 넣을 때 보이지 않는 표시(⁣)를 함께 넣고, 그 바로 뒤에
   붙은 조사를 받침에 맞춰 고친다. 사람이 쓴 보통 문장은 건드리지 않는다. */
const JOSA_MARK = '⁣';
const JOSA_PAIRS = {           /* [받침 있을 때, 없을 때] */
  '은':['은','는'], '는':['은','는'],
  '이':['이','가'], '가':['이','가'],
  '을':['을','를'], '를':['을','를'],
  '과':['과','와'], '와':['과','와'],
  '으로':['으로','로'], '로':['으로','로'],
  '이라':['이라','라'], '라':['이라','라'],
  '이랑':['이랑','랑'], '랑':['이랑','랑'],
  '이나':['이나','나'], '나':['이나','나'],
  '이야':['이야','야'], '야':['이야','야']
};
/* 마지막 글자의 받침 번호 (0이면 받침 없음, 8이면 ㄹ) */
function jongOf(ch){
  var code = String(ch).charCodeAt(0) - 0xAC00;
  if(code < 0 || code > 11171) return -1;      /* 한글이 아니면 모름 */
  return code % 28;
}
function fixJosa(str){
  /* 긴 조사를 먼저 맞춰야 '으로'가 '으'+'로'로 쪼개지지 않는다 */
  return str.replace(/(.)⁣(으로|이랑|이라|이나|이야|은|는|이|가|을|를|과|와|로|랑|라|나|야)?/g,
    function(m, ch, j){
      if(!j) return ch;
      var pair = JOSA_PAIRS[j];
      if(!pair) return ch + j;
      var jong = jongOf(ch);
      if(jong < 0) return ch + pair[1];          /* 한글이 아니면 받침 없는 쪽 */
      /* '로/으로'만 예외 — ㄹ 받침이면 '로' */
      if(pair[0] === '으로') return ch + ((jong === 0 || jong === 8) ? '로' : '으로');
      return ch + (jong === 0 ? pair[1] : pair[0]);
    });
}
/* 한국어 조사 '로/으로' 자동 처리 (받침이 없거나 ㄹ이면 '로') */
function josaRo(word){
  var code = word.charCodeAt(word.length - 1) - 0xAC00;
  if(code < 0 || code > 11171) return '로';
  var jong = code % 28;
  return (jong === 0 || jong === 8) ? '로' : '으로';
}
/* 한국어 조사 '이/가' 자동 처리 */
function josaIGa(word){
  var code = String(word).charCodeAt(String(word).length - 1) - 0xAC00;
  if(code < 0 || code > 11171) return '가';
  return (code % 28) === 0 ? '가' : '이';
}
/* 한국어 조사 '을/를' 자동 처리 */
function josaEulReul(word){
  var code = String(word).charCodeAt(String(word).length - 1) - 0xAC00;
  if(code < 0 || code > 11171) return '를';
  return (code % 28) === 0 ? '를' : '을';
}
/* 한국어 조사 '은/는' 자동 처리 */
function josaEunNeun(word){
  var code = String(word).charCodeAt(String(word).length - 1) - 0xAC00;
  if(code < 0 || code > 11171) return '는';
  return (code % 28) === 0 ? '는' : '은';
}

  var O = CONFIG.officer;

function politicalOffer(s){
  var g = lastGrade(s);
  var seed = s.flags.seed;
  var offers = [];
  if(g==='high'){
    offers.push({ id:'accept', label:'영입 제안을 받아들인다', hint:'비례대표 후보군 · 본업 중단',

      apply:function(st){ st.flags.entry='proportional'; st.flags.entryLabel='정당 인재 영입 (비례대표 후보군)'; } });
  } else if(g==='mid' && seed==='party'){
    offers.push({ id:'accept', label:'지방의원 출마 제안을 받아들인다', hint:'정치 경력 조기 시작 · 조직력',
      effects:{ org:10, approval:6, funds:-8 }, pt:2,
      result:'명함에 예비후보라는 글자가 박혔다.',
      apply:function(st){ st.flags.entry='local'; st.flags.entryLabel='지방의원 출마 (정치 경력 조기 시작)'; } });
  } else if(g==='mid'){
    offers.push({ id:'accept', label:'정책 자문 위원을 맡는다', hint:'정책력·인맥 · 본업 유지',
      effects:{ policy:9, org:6 }, pt:3,
      result:'당 정책위 회의에 이름을 올렸다. 본업은 그대로 간다.',
      apply:function(st){ st.flags.entry='advisor'; st.flags.entryLabel='정당 정책 자문 위원'; } });
  } else {
    offers.push({ id:'self', label:'지역 당원 활동을 스스로 시작한다', hint:'조직력 · 지지율 · 아무도 부르지 않았지만',
      effects:{ org:6, approval:4, integrity:3 }, pt:2, tag:'재기', tagKind:'rec',
      result:'부른 사람은 없었다. 그냥 당사 문을 열고 들어갔다.',
      apply:function(st){ st.flags.entry='self'; st.flags.entryLabel='지역 당원 활동 (스스로 시작)'; } });
  }
  /* ── 6차 C-3. 입문 시점에도 창당할 수 있다 ──────────────────────────────
     자금과 인지도가 받쳐 줄 때만 열린다. 공천 경쟁은 없지만
     당선 확률이 크게 낮고, 매년 당 운영비가 나가고, 조직력 성장이 느리다. */
  var EP = CONFIG.earlyParty;
  if(s.stats.funds >= EP.needFunds && s.stats.fame >= EP.needFame && !s.party){
    offers.push({ id:'newparty', label:'내 이름을 걸고 당을 만든다', tag:'고위험',
      hint:'공천 경쟁은 없다. 대신 조직도 돈도 혼자 감당한다',
      effects:{ fame:12, integrity:7, funds:-16, org:-6 }, pt:3,
      result:'사무실 하나를 빌려 현수막을 걸었다. 당원 수보다 기자가 많았다.',
      apply:function(st){
        st.flags.entry = 'newparty';
        st.flags.entryLabel = '창당 (입문 시점)';
        st.flags.earlyParty = true;
        st.flags.newParty = true;
        st.party = null;
        st.flags.newPartyCount = (st.flags.newPartyCount || 0) + 1;
      } });
  }
  /* 모든 경우에 거절 선택지를 넣는다 (설계 8번) */
  offers.push({ id:'decline', label: g==='low' ? '지금은 본업 회복에 집중한다' : '거절하고 본업에 집중한다',

    result:'아직은 때가 아니라고 답했다. 상대는 명함을 두고 갔다.',
    apply:function(st){ st.flags.entry='declined'; st.flags.entryLabel='제안 거절 (본업 집중)'; } });
  return offers;
}

/* 35~40세 턴 정리 문구 (선거 결과에 따라 달라진다) */
function turn4Summary(s){
  if(s.flags.race === 'none') return '마흔. 선거에 나가지 않은 5년이었다. 대신 다른 것이 쌓였다.';
  if(s.flags.won) return '마흔. 처음으로 내 이름이 걸린 선거에서 이겼다. 이제 진짜 정치인이다.';
  return '마흔. 첫 선거는 졌다. 그래도 내 이름을 아는 사람이 생겼다.';
}
/* 40세 이후 턴 정리 문구 (이번 5년에 무엇을 했는지로 고른다) */
function lateTurnSummary(s){
  var o = s.flags.lastTurnOutcome;
  if(o === 'presWait') return '대선은 접었다. 이번 5년은 다음을 준비하는 데 썼다.';
  if(o === 'presLoss') return '대선에서 졌다. 자리도 잃었다. 그래도 아직 끝은 아니다.';
  if(o === 'raceWin') return '선거에서 이겼다. 자리가 하나 더 단단해졌다.';
  if(o === 'raceLoss') return '선거에서 졌다. 다시 바닥부터 다져야 한다.';
  if(o === 'none') return '선거 없는 5년이 지나갔다. 조용했지만 쌓인 것은 있다.';
  return '5년이 지나갔다.';
}

/* ---------- 출마 선택 (조건에 맞는 것만 보여 준다) ---------- */
function raceOptions(s){
  var list = [];
  var partyName = s.party ? PARTIES.filter(function(p){ return p.id===s.party; })[0].name : null;

  /* 국회의원 지역구 — 누구나 고를 수 있고, 무소속이면 다음 화면에서 입당한다 */
  list.push({ id:'district', label:'국회의원 지역구 출마',
    hint: (partyName ? partyName + ' 공천을 받아야 한다. 당선되면 가장 크다.' : '먼저 입당해야 한다. 당선되면 가장 크다.'),
    effects:{ funds:-12, org:6, approval:4 }, pt:5,
    result:'지역구에 사무실을 냈다. 벽에 내 얼굴이 붙었다.',
    apply:function(st){ st.flags.race='district'; } });

  /* 비례대표 — 30~35세 턴에서 인재 영입 제안을 수락한 경우만 */
  if(s.flags.entry === 'proportional'){
    list.push({ id:'proportional', label:'국회의원 비례대표',
      hint:'공천 경쟁이 없다. 대신 지역에 뿌리가 없다.',
      effects:{ policy:7, fame:6, org:-3 }, pt:5,
      result:'명단 앞순위에 이름이 올랐다. 지역구를 도는 대신 정책 회의에 앉았다.',
      apply:function(st){ st.flags.race='proportional'; } });
  }

  /* 광역·기초의원 — 누구나 */
  list.push({ id:'local', label:'광역 또는 기초의원 출마',
    hint:'당선이 가장 쉽다. 대신 얻는 것도 작다.',
    effects:{ funds:-5, org:5, approval:5 }, pt:3,
    result:'작은 선거지만 내 이름을 걸었다.',
    apply:function(st){ st.flags.race='local'; } });

  /* 기초단체장 — 지방의원 경력이 있거나 정치 외길 */
  if(s.flags.entry === 'local' || s.career === 'poli'){
    list.push({ id:'mayor', label:'구청장·시장 출마',
      hint:'어렵다. 당선되면 살림을 직접 맡는다.',
      effects:{ funds:-14, org:7, policy:5 }, pt:6,
      result:'행정을 맡겠다고 나섰다. 판이 커졌다.',
      apply:function(st){ st.flags.race='mayor'; } });
  }

  /* 무소속 출마 — 인지도가 일정 이상일 때만 */
  if(s.stats.fame >= CONFIG.election.independentFameMin){
    list.push({ id:'indep', label:'무소속 출마',
      hint:'공천을 신경 쓸 필요가 없다. 대신 조직이 없다.',
      effects:{ funds:-10, integrity:7, approval:6, org:-4 }, pt:5,
      result:'어느 당의 도움도 받지 않기로 했다. 현수막에 당 이름이 없다.',
      apply:function(st){ st.flags.race='indep'; st.flags.ranIndependent = true; } });
  }

  /* 출마하지 않음 — 누구나 */
  list.push({ id:'none', label:'이번엔 출마하지 않는다',
    hint:'본업에 힘을 싣는다. 다른 방식으로 부름을 받을 수도 있다.',
    effects:{ stamina:6, policy:4 }, pt:6,
    result:'아직은 아니라고 판단했다. 대신 하던 일에 더 깊이 들어갔다.',
    apply:function(st){ st.flags.race='none'; } });

  return list;
}

/* ── 6차 C-5. 어디에 나갈까 — 고향이냐 아니냐 ────────────────────────────
   고향은 조직과 지지에 보탬이 있고, 다른 지역은 그 보탬 대신 이름이 넓게 퍼진다.
   어느 쪽도 늘 유리하지 않도록 서로 다른 것을 준다. */
function whereOptions(s){
  var R = regionOf(s), T = regionType(s);
  if(!R || !T) return null;
  return [
    { id:'home', label:R.name + '에서 나간다', tag:'고향',
      hint:'아는 얼굴이 많다',
      effects:{ org:T.homeOrg, approval:T.homeApproval },
      result:R.name + '에 사무실을 냈다. 길에서 인사를 받는 일이 잦았다.',
      apply:function(st){ st.flags.runHome = true; st.flags.ranAway = false; } },
    { id:'away', label:'연고 없는 곳에서 새로 시작한다', tag:'타지',
      hint:'아는 사람은 없고, 대신 새 얼굴로 보인다',
      effects:{ fame:Math.round(T.homeOrg * 0.9), speech:4 },
      result:'아무도 나를 모르는 동네에 짐을 풀었다. 명함부터 다시 돌렸다.',
      apply:function(st){ st.flags.runHome = false; st.flags.ranAway = true; } }
  ];
}

/* 공약이 당 색과 맞으면 조직이 돕고, 어긋나면 소신파로 중도층을 얻는다.
   어느 쪽도 항상 유리하지 않도록 이득의 방향만 다르게 둔다. */
function applyPledgeSynergy(s){
  var extra = {}, line;
  if(s.party){
    var m = pledgeMatches(s);
    if(m === 2){ extra = { org:6, funds:4 }; line = '당의 색과 꼭 맞는 공약이라 조직이 알아서 움직였다.'; }
    else if(m === 1){ extra = { org:3, approval:3 }; line = '절반은 당론, 절반은 내 생각이었다.'; }
    else { extra = { approval:7, speech:3, org:-2 }; line = '당론과 어긋났다. 당에서는 눈총을 받았지만 중도층이 눈여겨봤다.'; }
  } else {
    extra = { approval:4 }; line = '맞출 당론이 없으니 전부 내 말로 채웠다.';
  }
  return { effects:extra, line:line };
}

/* ---------- 선거 판정 (전부 CONFIG.election 의 임시값을 씀) ---------- */

/* 공약이 소속 정당의 색과 몇 개나 맞는지 (0~2) */
function pledgeMatches(s){
  if(!s.party) return 0;
  var st = PARTIES.filter(function(p){ return p.id === s.party; })[0].stance;
  var n = 0;
  if(s.flags.pledgeEconId === st.econ) n++;
  if(s.flags.pledgeSocialId === st.social) n++;
  return n;
}

/* ---------- 4차 A-3. 돈이 표로 바뀌는 폭을 제한한다 ----------
   선거 판정에 반영되는 자금에는 상한이 있다. 그 위로는 더 가져도 소용이 없다. */
function campaignFunds(s){ return Math.min(s.stats.funds, CONFIG.campaignMoney.spendCap); }

/* 이번 선거에 실제로 드는 돈. 진로별 비금전 혜택이 여기서 깎아 준다. */
function raceCostFor(s, raceId){
  var CM = CONFIG.campaignMoney;
  var cost = CONFIG.money.raceCost[raceId] || 10;
  s.flags.costHelpLine = null;
  /* 정치 외길 — 당이 선거 비용의 일부를 부담한다 */
  if(s.career === 'poli' && s.party){
    cost = Math.round(cost * (1 - CM.partyHelp));
    s.flags.costHelpLine = '당이 선거 비용의 상당 부분을 대 줬다. 오래 당에 있었던 값이다.';
  }
  /* 언론 — 인맥 덕에 방송·SNS 운동이 거의 공짜로 굴러간다 */
  else if(s.career === 'media' && s.flags.wayId === 'media'){
    cost = Math.round(cost * CM.mediaWayDiscount);
    s.flags.costHelpLine = '옛 동료들이 카메라를 들고 와 줬다. 광고비가 거의 들지 않았다.';
  }
  /* 6차 C-5. 선거 비용은 지역에 따라 다르다 (수도권이 비싸고 지방이 싸다) */
  var RT = regionType(s);
  if(RT && raceId !== 'president') cost = Math.round(cost * RT.costMul);
  return Math.max(1, cost);
}

/* 소액 후원 — 청렴도와 지지가 높으면 돈 없이도 선거를 치를 수 있다 (설계 A-3) */
function donationFor(s){
  var CM = CONFIG.campaignMoney, D = CM.donation, v = 0;
  if(s.stats.integrity >= D.integrityCut) v += D.integrityAdd;
  if(s.stats.integrity >= D.cleanCut) v += D.cleanAdd;
  v += Math.round(s.stats.approval / D.approvalDiv);
  /* 과학·법조는 깨끗한 이미지 덕에 후원회가 잘 열린다 */
  if(s.career === 'sci' || s.career === 'law') v = Math.round(v * CM.cleanCareerMul);
  if(s.career === 'law' && Math.random() < CM.lawDonationEvent) v += D.cleanAdd;
  /* 방송은 팬 후원. 단, 경계선에 오래 머물러 딱지가 붙으면 끊긴다 */
  if(s.career === 'ent' && s.fence < CM.entFanFenceMax) v += CM.entFanDonation;
  return Math.max(0, Math.min(D.cap, v));
}
/* 후원 결과를 이야기 문구로만 알려 준다 (금액은 쓰지 않는다) */
function donationLine(s, amount){
  if(amount <= 0) return '후원 계좌는 거의 비어 있었다. 쓸 수 있는 돈만으로 뛴다.';
  if(amount >= CONFIG.campaignMoney.donation.cap * 0.7)
    return '작은 후원이 끊이지 않고 들어왔다. 선거 비용의 걱정이 크게 줄었다.';
  return '이름 모를 사람들의 작은 후원이 조금씩 모였다.';
}

/* 선거에 드는 돈을 치른다 (설계 B-3, 4차 A-3) */
function payRaceCost(s, raceId){
  var cost = raceCostFor(s, raceId);
  var don = donationFor(s);
  s.flags.lastDonation = don;
  s.stats.funds = Math.max(CONFIG.money.debtFloor, s.stats.funds - cost + don);
  s.flags.lastRaceCost = cost;
  if(s.stats.funds < CONFIG.money.troubleBelow) addCrisis(s, 'bankrupt', 12);
}
/* 선거가 끝나면 비용을 일부 돌려받는다 (크게 지면 못 받는다) */
function refundRaceCost(s, won, close){
  var M = CONFIG.money;
  var rate = won ? M.refundWin : (close ? M.refundClose : M.refundLose);
  var back = Math.round((s.flags.lastRaceCost || 0) * rate);
  if(back > 0) s.stats.funds = Math.min(CONFIG.statMax, s.stats.funds + back);
  if(!won && !close) addCrisis(s, 'bankrupt', 14);
  return back;
}

/* 35~40세 선거에서 청렴도가 당선 확률에 주는 영향 (4차) */
function electionIntegrityAdjust(s){
  var table = CONFIG.election.integrityAdjust || [], v = s.stats.integrity;
  for(var i = 0; i < table.length; i++){ if(v >= table[i].min) return table[i].add; }
  return 0;
}
/* 6차 B-4. 몸이 축나면 선거 운동이 덜 먹힌다 (모든 선거 공통, %p) */
function staminaElectionAdjust(s){
  var ST = CONFIG.stamina;
  return (s.stats.stamina < ST.pollCut) ? ST.pollPenalty : 0;
}
/* 체력이 낮을 때 화면에 보여 줄 한 줄 (숫자는 쓰지 않는다) */
function staminaElectionLine(s){
  return (s.stats.stamina < CONFIG.stamina.pollCut)
    ? '일정을 다 소화하지 못했다. 발로 뛰는 싸움에서 밀린다.' : null;
}
/* 선거 직전 화면: 공천 판정 → 선거 점수(내부 등급) → 당선 확률 → 판세 문구 */
function runPoll(s){
  var E = CONFIG.election;
  var lines = [];
  payRaceCost(s, s.flags.race);
  /* 진로별 비금전 혜택과 소액 후원은 문구로만 알린다 (설계 A-3) */
  if(s.flags.costHelpLine) lines.push(s.flags.costHelpLine);
  lines.push(donationLine(s, s.flags.lastDonation || 0));
  /* 돌발 사건 (설계 B-2) */
  if(Math.random() < CONFIG.era.shockChance){
    var sh = SHOCKS[rnd(SHOCKS.length - 1)];
    s.flags.shockAdjust = sh.adjust;
    lines.push(sh.line);
  } else { s.flags.shockAdjust = 0; }

  /* 1) 지역구는 공천을 먼저 받아야 한다. 떨어지면 무소속으로 전환한다. */
  if(s.flags.race === 'district'){
    /* 정치 외길은 오래 당에 있었던 값으로 공천 가산을 받는다 (설계 A-3) */
    var nomBonus = (s.career === 'poli') ? CONFIG.campaignMoney.poliNominationBonus : 0;
    /* 6차 C-5. 조직 기반이 두터운 지역일수록 공천이 수월하다 */
    var RT0 = regionType(s);
    if(RT0) nomBonus += RT0.nominationAdj;
    /* 6차 C-5. 고향에서 나가면 아는 얼굴이 많다 */
    if(s.flags.runHome && RT0) nomBonus += Math.round(RT0.homeOrg / 2);
    var roll = s.stats.org + nomBonus + pledgeMatches(s) * E.nominationMatchBonus + rnd(CONFIG.eventRandomRange);
    if(roll >= E.nominationDC){
      lines.push('공천장을 받았다. 당의 이름을 달고 뛴다.');
    } else {
      s.flags.race = 'indep';
      s.flags.nominationFailed = true;
      s.flags.ranIndependent = true;
      lines.push('공천에서 밀렸다. 여기서 접을 수도 있었지만, 무소속으로 이름을 올렸다.');
    }
  }

  /* 2) 선거 점수 = 이번 턴 성과 + (선거 운동이 쓰는 능력치와 지지율) + 앞 턴 여파 + 운 */
  var way = CAMPAIGN_WAYS.filter(function(w){ return w.id === s.flags.wayId; })[0] || CAMPAIGN_WAYS[0];
  /* 자금은 상한까지만 표로 바뀐다 (설계 A-3: 선거 비용 상한) */
  var useAvg = way.useStats.reduce(function(a, k){
    return a + (k === 'funds' ? campaignFunds(s) : s.stats[k]);
  }, 0) / way.useStats.length;
  var statTerm = Math.round((useAvg + s.stats.approval) / (2 * CONFIG.grade.statDivisor));
  var prevBonus = E.prevGradeBonus[lastGrade(s)];   /* 30~35세의 성과가 남긴 여파 */
  var luck = rnd(CONFIG.grade.randomRange);
  var score = s.turnPt + statTerm + luck + prevBonus;
  var cut = CONFIG.grade.cuts.t4;
  var grade = score >= cut.high ? 'high' : (score <= cut.low ? 'low' : 'mid');
  s.flags.electionGrade = grade;   /* 화면에는 절대 보여 주지 않는다 */

  /* 3) 당선 확률 = 등급별 기본값 + 선거 종류 보정 + 돌발 사건 + 청렴도 (공세 결과는 나중에) */
  var chance = E.baseWinChance[grade] + (E.typeAdjust[s.flags.race] || 0) + (s.flags.shockAdjust || 0)
             + electionIntegrityAdjust(s)
             + staminaElectionAdjust(s)           /* 6차 B-4 */
             /* 6차 C-3. 내가 만든 당은 조직이 없어 크게 불리하다 */
             + (s.flags.earlyParty ? CONFIG.earlyParty.winPenalty : 0);
  s.flags.winChance = Math.max(E.minChance, Math.min(E.maxChance, chance));
  var sl = staminaElectionLine(s);
  if(sl) lines.push(sl);

  /* 4) 판세는 숫자 대신 문구로만 */
  var c = s.flags.winChance, P = E.pollCuts, poll;
  if(c >= P.strong)      poll = '여론조사에서 넉넉히 앞선다. 사무실 분위기가 들떠 있다.';
  else if(c >= P.lead)   poll = '조금 앞선다. 방심하지 말라는 말이 매일 나온다.';
  else if(c >= P.close)  poll = '오차범위 안 접전이다. 어느 쪽도 장담하지 못한다.';
  else if(c >= P.behind) poll = '뒤처져 있다. 뒤집으려면 남은 열흘이 전부다.';
  else                   poll = '많이 뒤졌다. 그래도 끝까지 가기로 했다.';
  lines.push(way.line);
  lines.push(poll);
  /* C-4. 선거 기간의 하늘. 돌발 변수가 있으면 우세라도 한 단계 흐려진다. */
  setSky(s, s.flags.winChance, !!s.flags.shockAdjust);

  return { text:lines.join('\n') };
}

/* 개표 화면 */
function runBallot(s){
  var E = CONFIG.election;
  var c = Math.max(E.minChance, Math.min(E.maxChance, s.flags.winChance));
  var won = rnd(99) < c;
  s.flags.won = won;
  /* 6차 E. 메달 판정용 기록 */
  if(won){
    s.flags.everWonElection = true;
    if(s.flags.runHome) s.medalState.wonAtHome = true;
    if(s.medalState.survivedCrisis) s.medalState.wonAfterCrisis = true;
  }
  if(s.flags.earlyParty || s.flags.newParty) s.medalState.ranOwnParty = true;

  var g = s.flags.electionGrade;
  var head, effects;
  if(won){
    if(g === 'high'){ head = '큰 표 차이로 당선됐다. 개표 초반에 이미 끝이 보였다.'; effects = { approval:12, fame:10, org:6 }; }
    else if(g === 'low'){ head = '극적인 역전승. 마지막 함에서 뒤집혔다. 이 이야기는 오래 남을 것이다.'; effects = { approval:14, fame:14, speech:5 }; }
    else { head = '근소한 차이로 당선됐다. 새벽까지 아무도 자리를 뜨지 못했다.'; effects = { approval:10, fame:8, org:5 }; }
  } else {
    if(g === 'high'){ head = '이변의 낙선. 모두가 의아해했고, 동정 여론이 오히려 이름을 남겼다.'; effects = { fame:12, approval:5, stamina:-5 }; }
    else if(g === 'low'){ head = '큰 표 차이로 졌다. 예상은 했지만 숫자로 보니 아팠다.'; effects = { fame:4, approval:-4, stamina:-6 }; }
    else { head = '아깝게 졌다. 몇 백 표였다. 다음이 있다는 말을 그날 처음 믿었다.'; effects = { fame:7, approval:3, org:4, stamina:-5 }; }
  }
  var raceName = RACE_NAME[s.flags.race] || '선거';
  /* 선거비용 보전 — 이기면 절반, 아깝게 지면 일부, 크게 지면 없음 */
  refundRaceCost(s, won, g === 'mid' || g === 'high');
  if(won) clearFence(s, '당선');
  spillFeed(s, won ? 'won' : 'lost');
  return { text:head, effects:effects, big:(won ? '당선' : '낙선'), bigLost:!won, sub:raceName };
}

/* 출마하지 않은 경우의 5년 (선거가 없으므로 등급으로 결과가 정해진다) */
function runNoRace(s){
  var g = lastGrade(s);
  if(g === 'high') return { text:'선거에 나가지 않았는데도 전화가 왔다. 정부가 자리를 제안했고, 본업에서도 가장 큰 성과를 냈다.',
    effects:{ policy:10, fame:10, org:6, funds:8 } };
  if(g === 'low') return { text:'조용한 5년이었다. 본업은 제자리였고, 정치권과는 점점 멀어졌다.',
    effects:{ policy:4, funds:5, stamina:6, approval:-3 } };
  return { text:'본업은 안정됐다. 정부 위원회에 이름을 올렸고, 아는 사람이 조금 늘었다.',
    effects:{ policy:7, org:5, funds:6 } };
}

                    mayor:'구청장·시장', governor:'광역단체장', indep:'무소속 출마', none:'출마하지 않음' };

const CAREER_PATHS = {

  local:{ key:'local', name:'지방의원', note:'경력이 짧다. 도전자 이미지.' },

  outside:{ key:'outside', name:'원외 인사', note:'조직력 불리. 대신 참신함 보너스.' }
};
function finalizePoliticalCareer(s){
  var path;
  if(s.flags.race === 'none'){
    path = CAREER_PATHS.outside;
  } else if(!s.flags.won){
    path = CAREER_PATHS.defeated;
  } else if(s.flags.race === 'governor'){
    path = CAREER_PATHS.governor;
  } else if(s.flags.race === 'mayor'){
    path = CAREER_PATHS.mayor;
  } else if(s.flags.race === 'local'){
    path = CAREER_PATHS.local;
  } else if(s.flags.race === 'proportional'){
    path = CAREER_PATHS.proportional;
  } else {
    /* 지역구 당선과 무소속 당선은 모두 지역구 국회의원이 된다 */
    path = CAREER_PATHS.district;
  }
  s.politicalCareer = path;
  /* 원외 인사는 무엇으로 원외인지도 함께 남긴다 */
  if(path.key === 'outside' && s.flags.outsideRole) s.politicalCareerExtra = s.flags.outsideRole;
  if(path.key === 'defeated') s.politicalCareerExtra = RACE_NAME[s.flags.race] + ' 낙선';
  if(s.flags.nominationFailed) s.politicalCareerExtra = (s.politicalCareerExtra ? s.politicalCareerExtra + ' · ' : '') + '공천 탈락 후 무소속';
}

/* 선거마다 상대 후보를 만든다 */
function makeRivalProfile(s){
  var o = RIVAL_ORIGINS[rnd(RIVAL_ORIGINS.length - 1)];
  var pool = RIVAL_WEAKNESSES.slice();
  var n = 1 + rnd(1);                       /* 약점 1~2개 */
  var weak = [];
  for(var i = 0; i < n && pool.length; i++) weak.push(pool.splice(rnd(pool.length - 1), 1)[0]);
  /* 4차 B-2. 판 내내 부딪쳐 온 라이벌이 결국 대선에서 맞은편에 서기도 한다 */
  var name;
  if(s.rival && s.chain && s.chain.rivalClash && !s.flags.rivalAlly && Math.random() < 0.45){
    name = s.rival.name;
    s.flags.rivalIsNemesis = true;
  } else {
    name = RIVAL_SURNAMES[rnd(RIVAL_SURNAMES.length - 1)] + RIVAL_GIVEN[rnd(RIVAL_GIVEN.length - 1)];
    s.flags.rivalIsNemesis = false;
  }
  return {
    name:name, origin:o, weak:weak, nemesis:!!s.flags.rivalIsNemesis,
    /* 힌트를 미리 알 수 있는지 — 여론 전략가 참모가 있거나 조직력이 높으면.
       6차 C-1: 체급이 높으면 알려 주는 사람이 저절로 생긴다. */
    hintShown: (s.flags.aide === 'spin') || (s.stats.org >= CONFIG.debate.hintOrgCut) ||
               (tierLevel(s) >= CONFIG.rival.weakHintTier)
  };
}

  var list = CAMPAIGN_WAYS.map(function(w){
    if(w.id === 'machine' && volunteers){
      return Object.assign({}, w, {
        label:'당원과 자원봉사 총동원',
        hint:'사람으로 메운다 · 뒷말은 적다',

        line:'돈 대신 사람이 왔다. 주말마다 당원들이 지역을 훑었다.',
        /* 돈을 쓴 게 아니라 사람을 쓴 것이므로 자금 의혹 꼬리표는 붙지 않는다 */
        apply:function(s2){ s2.flags.wayId = 'machine'; s2.flags.way = '자원봉사 총동원'; } });

  }).filter(function(w){

}
