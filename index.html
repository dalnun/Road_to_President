        '<div class="kicker">' + esc(S.attackResult.head) + '</div>' +
        '<p class="storyline">' + esc(S.attackResult.text) + '</p>' +
        deltaHTML(S.attackResult.deltas) +
        '<button class="btn" data-act="elnext">계속</button></div>';
    }
    else if(st === 'ballot'){
      var b = S.ballotInfo;
      body = '<div class="card evcard">' +
        '<div class="kicker">개표</div>' +
        '<div class="bigresult' + (b.bigLost ? ' lost' : '') + '">' + esc(b.big) + '</div>' +
        '<div class="center small">' + esc(b.sub || '') + '</div>' +
        '<p class="storyline" style="margin-top:10px">' + esc(b.text) + '</p>' +
        deltaHTML(S.ballotDeltas) +
        '<button class="btn" data-act="elnext">계속</button></div>';
    }
    /* 6차 D-1. 기록장은 선택지 아래로 (그림이 주인공인 화면) */
    body += tlBelow();
  }

  /* ---------- 위기 ---------- */
  else if(S.phase === 'crisis'){
    var cdef = CRISIS_EVENTS[S.crisisPath];
    body = '<div class="card evcard crisiscard' + (S.shakeOnce ? ' shake' : '') + '">' +
      '<div class="kicker warnkicker">⚠ 위기</div><h3>' + esc(cdef.title) + '</h3>' +
      '<p class="storyline">' + esc(cdef.text) + '</p>' +
      /* 6차 B-1. 같은 수를 또 쓸 수는 없다 */
      (S.crisisBlocked ? '<div class="note">전에 쓴 수는 이번엔 통하지 않는다.</div>' : '') +
      S.crisisOpts.map(function(o, i){
        return '<button class="choice' + (o.quiet ? ' quiet' : '') + '" data-act="crchoose" data-i="' + i + '">' +
          '<div class="t">' + esc(safe(o.label, S, 'option')) + '</div>' +
          '<div class="h">' + (o.quiet ? '여기서 이야기를 끝낸다' : optionEffects(o)) + '</div></button>';
      }).join('') + '</div>' + tlBelow();
  }

  /* ---------- 6차 B-2. 은퇴 후의 삶 ---------- */
  else if(S.phase === 'retire' || S.phase === 'retireEnd' || S.phase === 'retireBack'){
    var R = S.retire;
    var h = '<div class="card evcard retirecard">' +
      '<div class="kicker">' + RETIRE_TEXT.head + ' · ' + R.age + '세</div>' +
      '<h3>' + esc(S.name) + ', 정계를 떠난 뒤</h3>' +
      '<div class="tlfeed retfeed">' + feedLinesHTML(R.lines) + '</div>';
    if(S.phase === 'retire'){
      h += '<div class="sq">' + esc(RETIRE_TEXT.ask[Math.min(R.step, RETIRE_TEXT.ask.length - 1)]) + '</div>' +
        retireOptions().map(function(o, i){
          return '<button class="choice" data-act="retchoose" data-i="' + i + '">' +
            '<div class="t">' + esc(o.label) + '</div>' +
            '<div class="h">' + esc(o.hint) + '</div></button>';
        }).join('');
    } else if(S.phase === 'retireBack'){
      h += '<button class="btn" data-act="retback">다시 시작한다</button>';
    } else {
      h += '<button class="btn" data-act="retend">여기까지의 결과 보기</button>';
    }
    body = h + '</div>';
  }

  /* ---------- 대선 ---------- */
  /* 6차 D-1. 그림이 주인공인 화면에서는 기록장을 선택지 아래로 내린다 */
  else if(S.phase === 'pres'){
    var bigNow = !!(stageFor(S) || {}).big;
    body = bigNow ? (viewPres() + tlBelow()) : (viewTimeline() + viewPres());
  }

  /* ---------- 턴 정리 ---------- */
  else if(S.phase === 'summary'){
    body = '<div class="card">' +
      '<div class="kicker">' + esc(safe(t.ageText, S, 'title')) + '가 지나갔다</div>' +
      /* 등급은 글자·수치 어느 형태로도 보여 주지 않는다 */
      (S.summaryText ? '<p class="storyline">' + esc(S.summaryText) + '</p>' : '') +
      (S.tierChange ? '<div class="note"><b>' + esc(S.tierChange) + '</b></div>' : '') +
      (S.changeSummary && S.changeSummary.length
        ? '<div class="divider"></div>' + S.changeSummary.map(function(c){
            var a = arrowFor(c.diff);
            return '<div class="rowline"><span class="k">' + esc(c.line) + '</span>' +
              '<span class="v arrows"><span class="' + a.cls + '">' + a.sym + '</span></span></div>';
          }).join('')
        : '') +
      (S.lowStreak >= 2 ? '<div class="note">두 번 연속 뜻대로 되지 않았다. 그래도 아직 끝은 아니다.</div>' : '') +
      (integrityWarning() ? '<div class="recheck">' + esc(integrityWarning()) + '</div>' : '') +
      /* 이번 5년의 여론 — 대표 글 몇 개 (설계 A-4) */
      (function(){
        var items = turnFeedItems(S);
        if(!items.length) return '';
        return '<div class="opcard"><div class="ol">이번 ' + esc(safe(t.ageText, S, 'title')) + '의 여론</div>' +
          items.map(function(f){
            return '<div class="fitem f-' + f.kind + '">' +
              '<span class="fk">' + (FEED_KIND_LABEL[f.kind] || '') + '</span>' +
              '<span class="ft">' + esc(f.text) + '</span>' +
              '<span class="fa">' + f.age + '세</span></div>';
          }).join('') +
          '<button class="opmore" data-act="feed">전체 여론 보기 ›</button></div>';
      })() +
      /* 이번 5년의 연대기 — 기본은 접혀 있고 눌러서 펼친다 (설계 A-3) */
      (S.tlFeed && S.tlFeed.length
        ? '<details class="chron"><summary>이번 ' + esc(safe(t.ageText, S, 'title')) + ' 연대기 다시 보기</summary>' +
          feedLinesHTML(S.tlFeed) + '</details>'
        : '') +
      '<button class="btn" data-act="nextturn">' + (S.turnIndex + 1 >= TURNS.length ? '여기까지의 결과 보기' : '다음 5년으로') + '</button></div>';
  }

  /* 그림과 상태는 화면 위 고정 띠 안에, 이동 탭은 화면 아래 고정 (5차 A-1 · 6차 A-3) */
  return hudHTML() + tipHTML() + body + tabbarHTML() + scoutPopHTML() + sideNoteHTML();
}

/* ══════════════════════════════════════════════════════════════════════════
   4차 D-1 — 엔딩 5장
   1장 결정적 순간 → 2장 신문 1면 → 3장 걸어온 길 → 4장 사람들의 말 → 5장 인물 사전
   ══════════════════════════════════════════════════════════════════════════ */
const END_CHAPTERS = ['결정적 순간','신문 1면','걸어온 길','사람들의 말','인물 사전'];

/* 5차 C-1. 걸어온 길을 한 줄씩 나타낸다.
   중요했던 선택에서는 조금 더 오래 머문다. 움직임 줄이기 설정이면 한 번에 다 보여 준다. */
var chronTimer = null;
function clearChronTimer(){ if(chronTimer){ clearTimeout(chronTimer); chronTimer = null; } }
function startChronicle(){
  clearChronTimer();
  var rows = S.chronicle || [];
  if(reducedMotion()){ S.chronShown = rows.length; return; }
  S.chronShown = 0;
  stepChronicle();
}
function stepChronicle(){
  clearChronTimer();
  var rows = S.chronicle || [];
  if(S.screen !== 'result' || S.endChapter !== 2) return;
  if(S.chronShown >= rows.length) return;
  S.chronShown++;
  render();
  if(S.chronShown >= rows.length) return;
  var C = CONFIG.endShow;
  var justKey = rows[S.chronShown - 1] && rows[S.chronShown - 1].key;
  chronTimer = setTimeout(stepChronicle, justKey ? C.keyMs : (C.lineMin + rnd(C.lineMax - C.lineMin)));
}

/* 신문 1면 — 사진 자리에 실루엣이 들어간다 */
function frontPageSVG(s){
  var won = !!s.flags.electedPresident;
  return '<svg class="front" viewBox="0 0 320 170" aria-hidden="true">' +
    '<rect width="320" height="170" rx="4" fill="#fdfdfb" stroke="#d6d9e4" stroke-width="2"/>' +
    '<path d="M16 22 h288" stroke="#2a2c3d" stroke-width="2"/>' +
    '<path d="M16 30 h288" stroke="#2a2c3d" stroke-width="1"/>' +
    /* 사진 자리 */
    '<rect x="196" y="44" width="106" height="98" fill="#eceef5"/>' +
    '<g transform="translate(219,52) scale(0.85)" fill="#3a3f57">' + figureG(s, { posture:postureOf(s) }) + '</g>' +
    '<rect x="196" y="44" width="106" height="98" fill="none" stroke="#d6d9e4"/>' +
    /* 본문 줄 */
    '<path d="M18 116 h166 M18 126 h166 M18 136 h120" stroke="#dfe2ec" stroke-width="4"/>' +
    (won ? '<path d="M18 150 h284" stroke="#534ab7" stroke-width="3"/>' : '') +
    '</svg>';
}
function viewResult(){
  var sv = S.saveData;
  var art = S.endingArt || endingArt(S.endingKey, S);
  var ch = S.endChapter || 0;
  var h = '<div class="endwrap">';

  /* 몇 장까지 왔는지 */
  h += '<div class="endnav">' + END_CHAPTERS.map(function(n, i){
    return '<span class="ed' + (i <= ch ? ' on' : '') + '"></span>';
  }).join('') + '<span class="ec">' + esc(END_CHAPTERS[ch]) + '</span></div>';

  /* ── 1장. 결정적 순간 — 한 화면에 한 문장씩 ── */
  if(ch === 0){
    var lines = art.moment || [];
    var step = Math.min(S.momentStep || 0, lines.length - 1);
    h += '<div class="endart">' + endSceneSVG(S.endingKey, S) +
      '<span class="endlabel">' + esc(S.endingGroup) + '</span></div>';
    h += '<div class="card moment" data-act="endnext">';
    for(var i = 0; i <= step; i++){
      h += '<p class="mline' + (i === step ? ' now' : ' past') + '">' + esc(fill(lines[i], S)) + '</p>';
    }
    h += '<div class="small center" style="margin-top:14px">' +
      (step < lines.length - 1 ? '화면을 누르면 다음' : '눌러서 계속') + '</div></div>';
  }

  /* ── 2장. 신문 1면 ── */
  else if(ch === 1){
    h += '<div class="paperwrap">' + frontPageSVG(S) +
      '<div class="ptext"><div class="phead">' + esc(art.head) + '</div>' +
      '<div class="psub">' + esc(art.sub) + '</div></div></div>' +
      '<button class="btn" data-act="endnext">계속</button>';
  }

  /* ── 3장. 걸어온 길 — 한 줄씩 나타난다 (5차 C-1) ── */
  else if(ch === 2){
    var rows = S.chronicle || [];
    var shown = (S.chronShown === undefined) ? 0 : S.chronShown;
    var done = shown >= rows.length;
    h += '<div class="card chronocard" data-act="chronhurry"><div class="kicker">걸어온 길</div>' +
      '<div class="chrono">' + rows.slice(0, shown).map(function(r, i){
        var isLast = (i === shown - 1);
        return '<div class="crow' + (r.key ? ' key' : '') + (isLast ? ' now' : '') + '">' +
          '<span class="cdot"></span>' +
          '<span class="cbody"><span class="ct">' + esc(r.turn) + '</span>' +
          '<span class="cl">' + esc(fill(r.label, S)) + '</span>' +
          (r.star ? '<span class="cstar">★ ' + esc(r.star) + '</span>' : '') +
          (r.key ? '<span class="ckey">★ 이 선택이 크게 갈랐다</span>' : '') +
          '</span></div>';
      }).join('') + '</div>' +
      (done
        ? '<button class="btn" data-act="endnext">계속</button>'
        : '<div class="small center" style="margin-top:8px">화면을 누르면 한 번에 다 보입니다</div>' +
          '<button class="btn ghost" data-act="chronskip">건너뛰기</button>') +
      '</div>';
  }

  /* ── 4장. 사람들의 말 ── */
  else if(ch === 3){
    h += '<div class="card"><div class="kicker">사람들의 말</div>' +
      (S.people || []).map(function(p, i){
        return '<div class="bubble b' + (i % 2) + '"><b>' + esc(p.who) + '</b>' +
          '<span>' + esc(p.line) + '</span>' +
          /* 6차 C-1. 라이벌이 어떻게 되었는지 한 줄 */
          (p.fate ? '<em class="fate">' + esc(p.fate) + '</em>' : '') + '</div>';
      }).join('') +
      '<button class="btn" data-act="endnext">계속</button></div>';
  }

  /* ── 5장. 인물 사전 ── */
  else {
    h += '<div class="card dict">' +
      '<div class="kicker">후대의 인물 사전</div>' +
      '<div class="dname">' + esc(S.name) + '</div>' +
      '<div class="dtitle">' + esc(S.endingTitle) + '</div>' +
      '<div class="dline">' + esc(CAREERS[S.career].name) + ' 출신 · ' +
        ((S.flags.presTries || 0) ? '대선 ' + S.flags.presTries + '회 도전' : '대선 미도전') + '</div>' +
      '<div class="divider"></div>' +
      '<p class="storyline">' + esc(art.verdict) + '</p>' +
      '<p class="storyline">' + esc(S.endingLine) + '</p>' +
      '</div>';

    /* 에필로그 — 당선이면 취임식과 5년 뒤, 아니면 그 뒤의 이야기 */
    if(S.flags.electedPresident){
      h += '<div class="card"><div class="kicker">취임, 그리고 5년 뒤</div>' +
        inaugurationText(S).map(function(l){ return '<p class="storyline">' + esc(l) + '</p>'; }).join('') +
        '</div>';
    } else if(S.endingEpilogue && S.endingEpilogue.length){
      h += '<div class="card"><div class="kicker">그 뒤의 이야기</div>' +
        S.endingEpilogue.map(function(l){ return '<p class="storyline">' + esc(l) + '</p>'; }).join('') +
        /* 몰락 엔딩은 '그럼에도'로 시작하는 한 줄로 끝맺는다 (설계 D-2) */
        (S.endingGroup === '몰락'
          ? '<p class="storyline despite">' + esc(S.despite || (S.despite = despiteLine(S))) + '</p>' : '') +
        '</div>';
    }
    h += '<div class="newend">엔딩 도감에 등록됐다 — 「' + esc(S.endingTitle) + '」</div>';
    h += viewResultDetail();
  }
  return h + '</div>';
}
/* 5장 아래에 붙는 기록 카드들 */
function viewResultDetail(){
  var sv = S.saveData;
  var h = '';
  var pc = S.politicalCareer || CAREER_PATHS.outside;
  h += '<div class="card"><div class="kicker">기록</div>' +
    '<div class="rowline"><span class="k">마지막 정치 경력</span><span class="v">' + esc(pc.name) + '</span></div>' +
    '<div class="rowline"><span class="k">대선 도전</span><span class="v">' + ((S.flags.presTries || 0) ? (S.flags.presTries + '회') : '없음') + '</span></div>' +
    '<div class="rowline"><span class="k">이번 점수</span><span class="v">' + S.finalScore + '</span></div>' +
    '<div class="rowline"><span class="k">최고 점수</span><span class="v">' + Math.max(sv.best, S.finalScore) + '</span></div>' +
    (S.saveOk ? '' : '<div class="note">이 브라우저에서는 기록 저장이 막혀 있다. 게임 진행에는 문제가 없다.</div>') +
  '</div>';

  /* 능력치는 결과 화면에서도 숫자 대신 단계 이름으로만 보여 준다 */
  h += '<div class="card"><div class="kicker">지금의 나</div>';
  MAIN_ORDER.concat(['fame','stamina']).forEach(function(k){
    h += '<div class="rowline"><span class="k">' + STAT_META[k].name + '</span>' +
         '<span class="v">' + gradeOf(S.stats[k]) + '</span></div>';
  });
  h += '</div>';

  var seedName = { party:'정당 청년 조직', civic:'시민 활동과 봉사', voice:'SNS와 칼럼', work:'본업 집중' }[S.flags.seed] || '없음';
  var milName = { active:'현역 복무', active_late:'전성기에 현역 복무', officer:'장교 복무', jag:'군법무관', rnd:'전문연구요원', defer:'입대 연기' }[S.flags.mil] || '해당 없음';
  var party = S.party ? PARTIES.filter(function(p){ return p.id === S.party; })[0].name : '무소속';
  h += '<div class="card"><div class="kicker">정치 경력</div>' +
    '<div class="rowline"><span class="k">진로</span><span class="v">' + CAREERS[S.career].name + '</span></div>' +
    '<div class="rowline"><span class="k">정당</span><span class="v">' + party + '</span></div>' +
    '<div class="rowline"><span class="k">정치 씨앗</span><span class="v">' + seedName + '</span></div>' +
    '<div class="rowline"><span class="k">정치권 제안</span><span class="v">' + esc(S.flags.entryLabel || '없음') + '</span></div>' +
    '<div class="rowline"><span class="k">병역</span><span class="v">' + milName + '</span></div>' +
    '<div class="rowline"><span class="k">개인 생활</span><span class="v">' + esc(S.flags.life || '-') + '</span></div>' +
    '<div class="rowline"><span class="k">35~40세 선거</span><span class="v">' +
      esc(RACE_NAME[S.flags.race] || '-') + (S.flags.race && S.flags.race !== 'none' ? (S.flags.won ? ' · 당선' : ' · 낙선') : '') + '</span></div>' +
    '<div class="rowline"><span class="k">공약</span><span class="v">' +
      esc(S.flags.pledgeEcon ? S.flags.pledgeEcon + ' · ' + S.flags.pledgeSocial : '-') + '</span></div>' +
    '<div class="rowline"><span class="k">선거 운동</span><span class="v">' + esc(S.flags.way || '-') + '</span></div>' +
    '<div class="rowline"><span class="k">고교 활동</span><span class="v">' +
      S.hsActs.map(function(a){ return HS_ACTIVITIES.filter(function(x){ return x.id === a; })[0].label; }).join(', ') + '</span></div>' +
  '</div>';

  h += '<details class="chron"><summary>선택한 것 전부 다시 보기</summary><ul class="list">' +
    S.history.map(function(x){ return '<li>' + esc(x.turn) + ' — ' + esc(fill(x.label, S)) + '</li>'; }).join('') +
  '</ul></details>';

  h += endingBookHTML(sv, openCard);
  h += '<button class="btn" data-act="restart">다시 시작</button>';
  return h;
}

/* ---------- 그리기와 클릭 처리 ---------- */
var screen = 'title';
var openCard = null;      /* 엔딩 도감에서 펼쳐 둔 카드 */
function render(){
  var app = document.getElementById('app');
  /* 엔딩 화면만 짙은 남색 (5차 C-2) */
  document.body.classList.toggle('ending', !!(S && S.screen === 'result'));
  /* 아래 고정 탭은 판을 진행하는 동안에만 (6차 A-3) */
  document.body.classList.toggle('hastabs',
    !!(S && S.screen !== 'result' && screen === 'play'));
  if(screen === 'title'){ app.innerHTML = viewTitle(); }
  else if(screen === 'howto'){ app.innerHTML = viewHowto(); }
  else if(screen === 'create'){ app.innerHTML = viewCreate(); }
  /* 6.1차 3 (보완). 어린 시절은 판을 시작할 때 한 번만 나온다 (탭 아님) */
  else if(screen === 'child' && S){ app.innerHTML = hudHTML() + viewChild(); }
  else if(S && S.screen === 'result'){ app.innerHTML = viewResult(); }
  else { app.innerHTML = viewPlay(); }
  /* 계획 화면에서 새 단계가 나타나면 그 위치로 부드럽게 내려간다 */
  if(planScrollTarget && S && (S.phase === 'intro' || S.phase === 'plan')){
    var next = nextPlanStep();
    var id = next ? 'ps-' + next.id : 'ps-confirm';
    var el = document.getElementById(id);
    if(el){
      var behavior = reducedMotion() ? 'auto' : 'smooth';
      try{ el.scrollIntoView({ behavior:behavior, block:'center' }); }catch(err){ el.scrollIntoView(); }
    }
    planScrollTarget = null;
  } else if(!S || S.phase !== 'timeline'){
    window.scrollTo(0, 0);
  }
  /* 기록장은 항상 마지막 줄이 보이게 아래로 내려 둔다 */
  var feed = document.getElementById('tlfeed');
  if(feed) feed.scrollTop = feed.scrollHeight;
  /* 흔들림은 한 번 그리고 나면 끈다 (0-1) */
  if(S && S.shakeOnce) S.shakeOnce = false;
}
/* 0-1. 스크롤에 따른 자동 축소는 없앴다.
   그림 띠의 높이를 바꾸면 문서 전체 높이가 같이 바뀌고, 그 때문에 스크롤 위치가
   움직여 다시 높이가 바뀌는 되먹임이 생겨 화면이 떨렸다.
   높이를 고정한 채 '그림만' 줄이면 아래 내용이 올라오지 않아 줄이는 뜻이 없으므로,
   설계가 허용한 대로 접기 버튼만 남겼다. */

document.getElementById('app').addEventListener('click', function(e){
  var btn = e.target.closest('[data-act]');
  if(!btn) return;
  var act = btn.getAttribute('data-act');

  if(act === 'tocreate'){ screen = 'create'; createStep = 1; render(); }
  else if(act === 'totitle'){ screen = 'title'; createStep = 1; render(); }
  /* ── 6.1차 3. 캐릭터 만들기 네 걸음 ── */
  else if(act === 'cnext1'){
    var ni = document.getElementById('nameInput');
    draft.name = (ni && ni.value.trim()) || '이름없음';
    if(!draft.gender){ draft.gender = Math.random() < 0.5 ? 'male' : 'female'; }
    createStep = 2; render();
  }
  else if(act === 'cback1'){ createStep = 1; render(); }
  /* 6.1차 3 (보완). 고향까지 고르면 판이 시작된다. 어린 시절 탭으로 들어가고,
     여기서부터는 이름·고향으로 되돌아갈 수 없다. */
  else if(act === 'cstart'){
    newGame(draft.name, draft.gender, draft.region);
    createStep = 1;
    screen = 'child';        /* 어린 시절 화면 → '고등학교로' 누르면 판이 이어진다 */
    render();
  }
  else if(act === 'childgo'){ screen = 'play'; S.tab = 'life'; render(); }
  /* 시작 화면과 설명 카드 (5차 C-3) */
  else if(act === 'tohowto'){ howtoStep = 0; screen = 'howto'; render(); }
  else if(act === 'hnext'){ howtoStep = Math.min(HOWTO_CARDS.length - 1, howtoStep + 1); render(); }
  else if(act === 'hprev'){ howtoStep = Math.max(0, howtoStep - 1); render(); }
  else if(act === 'hdot'){ howtoStep = parseInt(btn.getAttribute('data-i'), 10) || 0; render(); }
  else if(act === 'hskip'){ screen = 'title'; render(); }
  else if(act === 'togglebook'){ titleBook = !titleBook; render(); }
  else if(act === 'tipreset'){ resetTips(); render(); }
  else if(act === 'tipclose'){ nextTip(S); render(); }
  else if(act === 'medalclose'){ S.medalToast = null; render(); }   /* 6차 E */
  /* 6.1차 2. 해금 알림을 누르면 잠재력 탭으로 */
  /* 6.1차 5. 숨은 영향 표시를 눌렀을 때 — 선택지는 고르지 않는다 */
  else if(act === 'sidenote'){ S.sideNote = btn.getAttribute('data-k') || 'quiet'; render(); }
  else if(act === 'sidenoteclose'){ S.sideNote = null; render(); }
  else if(act === 'scoutpopgo'){
    clearScoutPopTimer();
    S.scoutPop = null; S.scoutNew = 0;
    if(S.phase === 'timeline' && (S.tab || 'life') === 'life'){ clearTlTimer(); S.feedPaused = true; }
    S.tab = 'talent';
    render();
  }
  else if(act === 'gender'){
    draft.gender = btn.getAttribute('data-v');
    var inp = document.getElementById('nameInput'); if(inp) draft.name = inp.value;
    render();
  }
  /* 6차 C-5. 고향 고르기 */
  else if(act === 'region'){
    draft.region = btn.getAttribute('data-v');
    var inp2 = document.getElementById('nameInput'); if(inp2) draft.name = inp2.value;
    render();
  }
  /* 6차 A-3. 화면 아래 고정 탭 이동 */
  else if(act === 'totab' || act === 'feed'){
    var to = (act === 'feed') ? 'feed' : btn.getAttribute('data-v');
    var was = S.tab || 'life';
    if(was === 'child') S.childSeen = true;      /* 한 번 읽고 나면 버튼 문구가 바뀐다 */
    if(to !== 'life'){
      /* 다른 탭을 보는 동안에는 해가 넘어가지 않게 세워 둔다 */
      if(S.phase === 'timeline' && was === 'life'){ clearTlTimer(); S.feedPaused = true; }
      if(to === 'feed') S.feedTab = 'new';
      if(to === 'talent') S.scoutNew = 0;        /* 알림 표시를 지운다 */
      S.tab = to; render(); return;
    }
    /* 인생 탭으로 돌아올 때 확인한 여론을 보관함으로 옮긴다 (5차 A-4) */
    if(was === 'feed') markFeedRead();
    S.tab = 'life';
    if(S.feedPaused){ S.feedPaused = false; render(); hurryTimeline(); return; }
    render();
  }
  else if(act === 'ftab'){ S.feedTab = btn.getAttribute('data-v'); render(); }
  /* 6.1차 6-2. 여론 칸 / 알림 칸 */
  else if(act === 'fbox'){ S.feedBox = btn.getAttribute('data-v'); S.feedTab = 'new'; render(); }
  else if(act === 'feedread'){ markFeedRead(S.feedBox === 'alert' ? 'alert' : 'feed'); S.feedTab = 'kept'; render(); }
  /* 고정 띠 접기와 메뉴 (5차 A-1 · A-3) */
  else if(act === 'menu'){ S.menuOpen = true; S.menuAsk = null; render(); }
  else if(act === 'menuclose'){ S.menuOpen = false; S.menuAsk = null; render(); }
  else if(act === 'askhome'){ S.menuAsk = 'home'; render(); }
  else if(act === 'askretire'){ S.menuAsk = 'retire'; render(); }
  else if(act === 'asksettings'){ S.menuAsk = 'settings'; render(); }
  else if(act === 'askhowto'){ S.menuAsk = 'howto'; S.howtoStep = 0; render(); }
  else if(act === 'mhnext'){ S.howtoStep = Math.min(HOWTO_CARDS.length - 1, (S.howtoStep || 0) + 1); render(); }
  else if(act === 'mhprev'){ S.howtoStep = Math.max(0, (S.howtoStep || 0) - 1); render(); }
  else if(act === 'homeyes'){ clearTlTimer(); S = null; screen = 'title'; render(); }
  else if(act === 'retireyes'){ S.menuOpen = false; S.menuAsk = null; retireNow(); }
  /* 6차 B-2. 은퇴 후의 삶 */
  else if(act === 'retchoose'){ chooseRetireOption(parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'retback'){ retireResume(); }
  else if(act === 'retend'){ S.retire = null; finishGame(); }
  /* 상태 아이콘 설명. 첫 등장 안내는 5차 C-3의 '첫 위기 경고' 안내로 합쳤다 */
  else if(act === 'sicon'){ S.iconNote = btn.getAttribute('data-d'); render(); }
  /* 계획 화면 */
  else if(act === 'ppick'){ pickPlanOption(btn.getAttribute('data-s'), parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'reopen'){ reopenPlanStep(btn.getAttribute('data-s')); }
  else if(act === 'pconfirm'){ confirmPlan(); }
  /* 타임라인 */
  else if(act === 'hurry'){ hurryTimeline(); }
  else if(act === 'skip'){ skipTimeline(); }
  else if(act === 'evchoose'){ chooseEventOption(curOptions[parseInt(btn.getAttribute('data-i'), 10)]); }
  else if(act === 'tlchoose'){ chooseTimelineOption(parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'crchoose'){ chooseCrisisOption(parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'infoNext'){ S.infoCache = null; resumeTimeline(); }
  /* 선거 */
  else if(act === 'elnext'){ electionNext(); }
  else if(act === 'atchoose'){ chooseAttackOption(parseInt(btn.getAttribute('data-i'), 10)); }
  /* 대선 */
  else if(act === 'presNoPrimary'){ S.flags.wonPrimary = true; resumeTimeline(); }
  else if(act === 'prchoose'){ choosePrimary(parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'prnext'){
    if(S.flags.wonPrimary){ resumeTimeline(); }
    else { S.presSub = 'primaryLoss'; render(); }
  }
  else if(act === 'prloss'){ choosePrimaryLoss(parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'ppledge'){ choosePresPrep('pledge', parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'pmerge'){ choosePresPrep('merge', parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'debstart'){ S.presSub = 'debate'; render(); }
  else if(act === 'debans'){ answerDebate(parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'debask'){ askDebate(btn.getAttribute('data-q'), btn.getAttribute('data-w')); }
  else if(act === 'debnext'){ debateNext(); }
  else if(act === 'debgo'){ debateReactNext(); }      /* 6차 D-2 */
  else if(act === 'patt'){ choosePresAttack(parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'pballot'){ startPresBallot(); }
  else if(act === 'pcount'){ runPresBallot(); }
  else if(act === 'pballotstep'){ ballotStep(); }
  else if(act === 'plossc'){ choosePresLoss(parseInt(btn.getAttribute('data-i'), 10)); }
  else if(act === 'presDone'){ resumeTimeline(); }
  /* 엔딩 5장 넘기기 (설계 D-1) */
  else if(act === 'endnext'){
    if(S.endChapter === 0){
      var ml = (S.endingArt && S.endingArt.moment) || [];
      if((S.momentStep || 0) < ml.length - 1){ S.momentStep = (S.momentStep || 0) + 1; render(); return; }
    }
    S.endChapter = Math.min(END_CHAPTERS.length - 1, (S.endChapter || 0) + 1);
    if(S.endChapter === 2) startChronicle();
    render();
  }
  /* 걸어온 길 — 누르면 한 번에, 건너뛰기 (5차 C-1) */
  else if(act === 'chronhurry' || act === 'chronskip'){
    clearChronTimer();
    S.chronShown = (S.chronicle || []).length;
    render();
  }
  /* 도감 카드 펼치기 (설계 D-3) */
  else if(act === 'ecard'){
    var k = btn.getAttribute('data-k');
    openCard = (openCard === k) ? null : k;
    render();
  }
  /* 턴 넘기기 */
  else if(act === 'nextturn'){ advanceTurn(); }
  else if(act === 'restart'){ clearTlTimer(); S = null; screen = 'title'; render(); }
});

render();
</script>
</body>
</html>
