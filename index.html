/* ---------- 4차 B-1. 후반 턴을 CONFIG.lifespan 에 맞춰 만든다 ----------
   maxAge 를 55로 바꾸면 턴이 3개로 줄고, '마지막 기회' 문구도 알아서 마지막 턴으로 간다. */
const LATE_START_INDEX = 5;          /* TURNS 배열에서 후반 턴이 시작되는 자리 */
function lateTurnCount(){
  var L = CONFIG.lifespan;
  return Math.max(1, Math.round((L.maxAge - L.lateFrom) / L.yearsPerTurn));
}
/* 't7' → 2 (몇 번째 후반 턴인지). 후반 턴이 아니면 -1 */
function lateIndexOf(turnId){
  var n = parseInt(String(turnId).slice(1), 10);
  if(isNaN(n) || n < LATE_START_INDEX) return -1;
  return n - LATE_START_INDEX;
}
function isLateTurnId(turnId){ var i = lateIndexOf(turnId); return i >= 0 && i < lateTurnCount(); }
/* 몇 살 문구 — '마흔', '쉰'처럼 십 단위일 때만 우리말로 */
const AGE_WORD = { 40:'마흔', 45:'마흔다섯', 50:'쉰', 55:'쉰다섯', 60:'예순', 65:'예순다섯' };
function buildLateTurns(){
  var L = CONFIG.lifespan, n = lateTurnCount(), out = [];
  for(var i = 0; i < n; i++){
    var from = L.lateFrom + i * L.yearsPerTurn;
    var ages = [];
    for(var k = 1; k <= L.yearsPerTurn; k++) ages.push(from + k);
    var label = from + '~' + (from + L.yearsPerTurn) + '세';
    var special = null;
    if(i === 0) special = (AGE_WORD[from] || (from + '세')) + '. 이제는 대통령 선거에 나갈 수 있다.';
    else if(i === n - 1) special = (AGE_WORD[from] || (from + '세')) + '. 이번이 마지막 기회다.';
    else if(ages[0] >= 56) special = (AGE_WORD[from] || (from + '세')) + '. 세대교체 이야기가 자주 들린다.';
    out.push(makeLateTurn('t' + (LATE_START_INDEX + i), label, ages, special));
  }
  return out;
}
const LATE_TURNS = buildLateTurns();

/* 4차 B-1. 대선에서 진 바로 다음 턴에는 체급이 아주 높아야 다시 나갈 수 있다.
   (도전 기회가 5번으로 늘면서 한 판 당선률이 치솟는 것을 막는 장치이자,
    '진 사람은 한 번 쉬어 간다'는 현실에 맞춘 규칙) */
function mustRebuildAfterLoss(s){
  if(s.flags.presLostAtTurn === undefined) return false;
  if(s.flags.presLostAtTurn !== s.turnIndex - 1) return false;
  /* 체급이 최고이고 지난 패배가 아깝게 진 것이었다면, 바로 다시 나갈 수 있다. */
  if(tierLevel(s) >= CONFIG.presidential.rerunTierNeed && s.flags.lastPresClose) return false;
  /* 이미 여러 번 나간 사람은 쉬어 가지 않는다. 그게 그의 이름이 됐기 때문이다.
     (이 규칙이 없으면 네 번째·다섯 번째 도전이 사실상 불가능하다) */
  if((s.flags.presTries || 0) >= CONFIG.presidential.serialRunnerFrom) return false;
  return true;
}

/* ---------- 40세 이후의 출마 선택지 (설계 2-1) ---------- */
function lateRaceOptions(s){
  var key = (s.politicalCareer && s.politicalCareer.key) || 'outside';
  var list = [];
  var tried = s.flags.presTries || 0;

  /* 대선 도전 횟수 상한 (CONFIG.lifespan.maxPresRuns). 다 쓰면 선택지가 사라진다. */
  if(tried < CONFIG.lifespan.maxPresRuns && !mustRebuildAfterLoss(s)){
    list.push({ id:'president', label:'대통령 선거에 출마한다',
      hint: tried ? '이번이 ' + (tried + 1) + '번째 도전이다.' : '가장 큰 판이다. 지금 자리는 내려놓아야 한다.',
      effects:{ funds:-16, fame:10, approval:6 }, pt:6,
      result:'출마 선언문을 읽었다. 카메라가 스무 대는 됐다.',
      apply:function(st){ st.flags.presTries = (st.flags.presTries || 0) + 1; st.flags.ranPresident = true; } });
  }

  /* 국회의원 — 35~40세 턴과 같은 조건 */
  list.push({ id:'district', kind:'race', label:'국회의원 지역구에 나간다',
    hint:'현역이면 수월하고, 아니면 공천부터다.',
    effects:{ funds:-12, org:6, approval:4 }, pt:5,
    result:'다시 지역구에 사무실을 냈다.',
    apply:function(st){ st.flags.race='district'; } });
  if(key === 'proportional' || s.flags.entry === 'proportional'){
    list.push({ id:'proportional', kind:'race', label:'비례대표로 다시 나간다',
      hint:'공천 경쟁은 없지만 지역 기반은 여전히 약하다.',
      effects:{ policy:7, fame:5 }, pt:5, result:'다시 명단에 이름을 올렸다.',
      apply:function(st){ st.flags.race='proportional'; } });
  }
  /* 광역단체장 — 국회의원·단체장 경력 */
  if(['district','proportional','mayor','governor'].indexOf(key) >= 0){
    list.push({ id:'governor', kind:'race', label:'광역단체장(시·도지사)에 나간다',
      hint:'판이 크다. 당선되면 대권에 가장 가까워진다.',
      effects:{ funds:-18, org:8, policy:6 }, pt:6,
      result:'도청 앞에서 출마를 선언했다.',
      apply:function(st){ st.flags.race='governor'; } });
  }
  /* 기초단체장 */
  if(['local','mayor','governor'].indexOf(key) >= 0 || s.career === 'poli'){
    list.push({ id:'mayor', kind:'race', label:'기초단체장에 나간다',
      hint:'살림을 직접 맡는다.',
      effects:{ funds:-14, org:7, policy:5 }, pt:5,
      result:'구청 앞에 현수막을 걸었다.',
      apply:function(st){ st.flags.race='mayor'; } });
  }
  /* 현직 재선 */
  if(['district','proportional','mayor','governor','local'].indexOf(key) >= 0){
    list.push({ id:'reelect', kind:'race', label:'현직 그대로 재선에 도전한다',
      hint:'가장 쉽다. 대신 판이 커지지 않는다.',
      effects:{ funds:-8, org:6, approval:8 }, pt:4,
      result:'하던 일을 계속하겠다고 말했다.',
      apply:function(st){ st.flags.race = st.flags.reelectAs = ({ district:'district', proportional:'proportional',
        mayor:'mayor', governor:'governor', local:'local' })[key]; st.flags.isReelect = true; } });
  }
  list.push({ id:'none', kind:'none', label:'이번엔 출마하지 않는다',
    hint:'힘을 아끼고 다음을 본다.',
    effects:{ stamina:8, policy:4 }, pt:5,
    result:'이번 판은 건너뛰기로 했다.',
    apply:function(st){ st.flags.race='none'; } });
  return list;
}

/* ============================================================================
   대선 흐름 (전부 CONFIG.presidential 의 임시값)
   ============================================================================ */
/* 무소속·신당이면 경선이 없다 */
function isOutsiderRun(s){ return !s.party || s.flags.newParty || s.flags.bolted; }

/* 대선 점수 → 내부 등급 (화면에 절대 보이지 않음) */
function presGrade(s){
  var P = CONFIG.presidential, t = TURNS[S.turnIndex];
  var sum = 0;
  ['speech','policy','org','fame'].forEach(function(k){ sum += s.stats[k]; });
  var div = P.statDivisor || CONFIG.grade.statDivisor;
  var statTerm = Math.round(((sum / 4) + s.stats.approval) / (2 * div));
  var luck = rnd(CONFIG.grade.randomRange);
  /* 대선 등급은 '이번 턴 성과'보다 '그동안 쌓은 것'을 더 본다.
     (안전하게 관리한 플레이가 성과 점수 때문에 손해 보지 않도록) */
  var score = Math.round(s.turnPt * (P.ptWeight === undefined ? 1 : P.ptWeight)) + statTerm + luck;
  s.flags.presScore = score;      /* 시험용 기록. 화면에는 쓰지 않는다 */
  var cut = presCutsFor(t.id);
  return score >= cut.high ? 'high' : (score <= cut.low ? 'low' : 'mid');
}
/* ---------- 4차 B-1. 후반 턴이 몇 개든 맞는 보정값들 ---------- */
function presCutsFor(turnId){
  var P = CONFIG.presidential, i = Math.max(0, lateIndexOf(turnId));
  return { high:P.cutsBase.high + i * P.cutsStep, low:P.cutsBase.low + i * P.cutsStep };
}
/* 참신함 — 첫 후반 턴에서 가장 크고 마지막 턴에서 0 */
function freshBonusFor(turnId){
  var P = CONFIG.presidential, n = lateTurnCount(), i = Math.max(0, lateIndexOf(turnId));
  if(n <= 1) return 0;
  return Math.round(P.freshMax * (1 - i / (n - 1)));
}
/* 경륜 — 그 반대로 마지막 턴에서 가장 크다 */
function veteranBonusFor(turnId){
  var P = CONFIG.presidential, n = lateTurnCount(), i = Math.max(0, lateIndexOf(turnId));
  if(n <= 1) return 0;
  return Math.round(P.veteranMax * (i / (n - 1)));
}
/* 세대교체 여론 — 나이가 많으면 붙는 부담 */
function ageBurdenFor(age){
  var t = CONFIG.presidential.ageBurden || [];
  for(var i = 0; i < t.length; i++){ if(age >= t[i].from) return t[i].add; }
  return 0;
}

/* 청렴도가 당선 확률에 주는 영향 */
function integrityAdjust(s){
  var table = CONFIG.presidential.integrityAdjust, v = s.stats.integrity;
  for(var i = 0; i < table.length; i++){ if(v >= table[i].min) return table[i].add; }
  return 0;
}
/* 검증의 시대에는 청렴도가 더 크게 작용한다 (설계 B-2) */
function integrityAdjustExtra(s){
  if(!s.era || !s.era.integrityWeight) return 0;
  var base = integrityAdjust(s);
  return Math.round(base * (s.era.integrityWeight - 1));
}
/* 상대 후보를 정한다 (선거마다 무작위. 강함 수치는 화면에 보이지 않는다) */
function pickRival(s){
  var list = CONFIG.presidential.rivals;
  var r = list[rnd(list.length - 1)];
  s.flags.rival = r.id;
  s.flags.rivalAdjust = r.adjust;
  s.flags.rivalLine = r.line;
  return r;
}
/* 본선 당선 확률을 계산한다 (숫자는 화면에 보여 주지 않는다)
   기본값 + (모든 보정의 합, 단 +bonusCap 까지만) */
function computePresChance(s){
  var P = CONFIG.presidential, t = TURNS[S.turnIndex];
  var g = s.flags.presGrade || 'mid';
  var base = P.baseWinChance[g];
  var bonus = 0;
  bonus += freshBonusFor(t.id) + veteranBonusFor(t.id);
  /* 세대교체 여론 (설계 B-1) — 나이는 화면에 늘 보이므로 숨겨진 수치가 아니다 */
  bonus += ageBurdenFor(s.curAge || 40);
  bonus += P.careerAdjust[(s.politicalCareer && s.politicalCareer.key) || 'outside'] || 0;
  bonus += integrityAdjust(s);
  bonus += staminaElectionAdjust(s);      /* 6차 B-4. 몸이 축나면 대선에서도 밀린다 */
  var tries = Math.max(1, s.flags.presTries || 1);
  bonus += P.repeatAdjust[Math.min(tries, P.repeatAdjust.length) - 1];
  if(isOutsiderRun(s)) bonus += P.outsiderPenalty;
  if(s.flags.mergeDone) bonus += P.mergeBonus;
  bonus += (s.flags.debateSwing || 0);
  bonus += (s.flags.rivalAdjust || 0);
  bonus += (s.flags.presShock ? s.flags.presShock.adjust : 0);
  bonus += integrityAdjustExtra(s);   /* 시대가 검증을 요구하면 청렴도 영향이 커진다 */
  /* 경계선에 오래 머문 원외 인사는 참신함 보너스를 못 받는다 (설계 B-6) */
  if(((s.politicalCareer && s.politicalCareer.key) === 'outside') && s.fence >= CONFIG.fence.freshBonusMax){
    bonus -= freshBonusFor(t.id);
  }
  /* 보너스는 여기까지만. 벌칙은 제한하지 않는다 (잘못하면 확실히 아프게) */
  if(bonus > P.bonusCap) bonus = P.bonusCap;
  return Math.max(P.minChance, Math.min(P.maxChance, base + bonus));
}

/* ---------- 경선 ---------- */
function primaryOptions(s){
  var key = (s.politicalCareer && s.politicalCareer.key) || 'outside';
  return PRIMARY_STRATEGIES.map(function(st){
    var fits = st.fit && st.fit.indexOf(key) >= 0;
    return { id:st.id, label:st.label, hint:st.hint + (fits ? ' (내 경력에 잘 맞는다)' : ''),
      strategy:st, fits:fits };
  });
}
function runPrimary(s, opt){
  var P = CONFIG.presidential;
  var st = opt.strategy;
  var base = s.stats[st.stat];
  var aideBonus = (s.flags.aide === 'organizer') ? P.aideEffect.organizer.primary : 0;
  var fitBonus = opt.fits ? 8 : 0;
  var roll = base + aideBonus + fitBonus + rnd(P.primaryLuck);
  var won = roll >= P.primaryDC[st.id];
  if(st.faction) s.flags.factionDeal = true;
  if(st.debateBonus) s.flags.visionRun = true;
  return won;
}

/* ---------- TV 토론 ---------- */
/* 상대가 던지는 질문 2개를 내 기록에서 뽑는다 */
function pickDebateQuestions(s){
  var hit = DEBATE_QUESTIONS.filter(function(q){ return q.when(s); });
  var out = [];
  /* 기록에서 뽑은 질문을 먼저 쓰고, 모자라면 일반 질문으로 채운다 */
  var personal = hit.filter(function(q){ return ['economy','disaster','vision'].indexOf(q.id) < 0; });
  var general = hit.filter(function(q){ return ['economy','disaster','vision'].indexOf(q.id) >= 0; });
  var need = CONFIG.debate.order.filter(function(x){ return x === 'their'; }).length;
  while(out.length < need && personal.length){ out.push(personal.splice(rnd(personal.length - 1), 1)[0]); }
  while(out.length < need && general.length){ out.push(general.splice(rnd(general.length - 1), 1)[0]); }
  return out;
}
/* 내가 던지는 질문의 결과를 판정한다 (설계 C-1) */
function judgeMyQuestion(s, qid, targetWeakId){
  var D = CONFIG.debate, rival = s.rivalProfile;
  if(qid === 'attack'){
    var real = rival.weak.some(function(w){ return w.id === targetWeakId; });
    var w = RIVAL_WEAKNESSES.filter(function(x){ return x.id === targetWeakId; })[0];
    if(real) return { swing:D.attackHit, line:w.hit, effects:{ speech:3, approval:4 } };
    return { swing:D.attackMiss, line:MY_Q_LINES.attackMiss, effects:{ approval:-3 } };
  }
  if(qid === 'policy'){
    var good = s.stats.policy >= D.policyStatCut;
    return good
      ? { swing:D.policyBase + D.policyBonus, line:MY_Q_LINES.policyGood, effects:{ policy:2, approval:3 } }
      : { swing:0, line:MY_Q_LINES.policyWeak, effects:{} };
  }
  if(qid === 'vision') return { swing:D.visionSwing, line:MY_Q_LINES.vision, effects:{ integrity:2, approval:2 } };
  return { swing:D.commonSwing, line:MY_Q_LINES.common, effects:{ approval:3 } };
}
function judgeDebate(s, q, answerId){
  var P = CONFIG.presidential;
  var aide = (s.flags.aide === 'policy') ? P.aideEffect.policy.debate : 0;
  if(answerId === q.best){
    var swing = P.debateGood + (s.flags.visionRun ? 2 : 0) + (answerId === 'policy' ? aide : 0);
    return { kind:'great', swing:swing, effects:{ speech:4, approval:4 } };
  }
  if((q.good || []).indexOf(answerId) >= 0){
    return { kind:'good', swing:P.debateNeutral + 2, effects:{ speech:2, approval:2 } };
  }
  if((q.bad || []).indexOf(answerId) >= 0){
    return { kind:'bad', swing:P.debateBad, effects:{ approval:-5 } };
  }
  /* 어느 쪽도 아닌 답 — 무난해 보이지만 기회를 놓친 것이다 */
  return { kind:'good', swing:P.debateNeutral, effects:{ speech:1 } };
}

/* ---------- 개표 연출 (설계 2-5) ---------- */
function buildBallotSteps(s, won, chance){
  var early;   /* 출구조사에서 앞섰는가 */
  if(won) early = Math.random() < (chance >= 50 ? 0.75 : 0.35);
  else    early = Math.random() < (chance >= 50 ? 0.55 : 0.2);
  var comeback = won && !early;      /* 역전승 */
  var collapse = !won && early;      /* 역전패 */
  var lines = [];
  lines.push(early ? '출구조사 발표. 근소하게 앞선 것으로 나왔다. 사무실에서 함성이 터졌다.'
                   : '출구조사 발표. 뒤진 것으로 나왔다. 사무실이 조용해졌다.');
  lines.push(early ? '개표율 30%. 아직 앞서 있다. 다들 화면에서 눈을 떼지 못한다.'
                   : '개표율 30%. 격차가 좀처럼 줄지 않는다.');
  if(comeback) lines.push('개표율 70%. 표차가 줄더니 그래프가 교차했다. 누군가 소리를 질렀다.');
  else if(collapse) lines.push('개표율 70%. 앞서던 그래프가 뒤집혔다. 아무도 말을 하지 않았다.');
  else lines.push(early ? '개표율 70%. 격차가 벌어지기 시작했다.' : '개표율 70%. 따라잡기엔 표가 모자란다.');
  if(won) lines.push(comeback ? '확정. 뒤집었다. 새벽 세 시, 대통령 당선이 확정됐다.'
                              : '확정. 대통령 당선이 확정됐다.');
  else    lines.push(collapse ? '확정. 다 잡았던 승리가 손에서 빠져나갔다.'
                              : '확정. 졌다. 예상보다 표차가 컸다.');
  /* 예보가 어긋났던 선거라면 한 줄 덧붙인다 (설계 C-4) */
  if(s.flags.skyWrong) lines.push('내내 읽히던 흐름과 다른 밤이었다. 예상과 다른 흐름이었다고들 했다.');
  /* C-5. 개표 막대가 자랄 값 — 단계마다 두 막대의 길이 (숫자는 화면에 쓰지 않는다) */
  var bars = [];
  var mine0 = early ? 30 : 22, theirs0 = early ? 24 : 32;
  bars.push({ m:mine0, t:theirs0 });
  bars.push({ m:mine0 + 18, t:theirs0 + 16 });
  if(comeback)      bars.push({ m:mine0 + 38, t:theirs0 + 26 });
  else if(collapse) bars.push({ m:mine0 + 26, t:theirs0 + 38 });
  else              bars.push({ m:mine0 + (early ? 36 : 24), t:theirs0 + (early ? 24 : 36) });
  bars.push(won ? { m:96, t:72 } : { m:70, t:96 });
  return { lines:lines, comeback:comeback, collapse:collapse, bars:bars };
}

/* ---------- 턴이 끝날 때 경력 갱신 ---------- */
function finalizeLateTurn(s){
  /* 턴 정리 문구에서 쓰려고 이번 5년의 결과를 먼저 적어 둔다 */
  if(s.flags.electedPresident) s.flags.lastTurnOutcome = 'presWin';
  else if(s.flags.presWait) s.flags.lastTurnOutcome = 'presWait';
  else if(s.flags.ranPresident) s.flags.lastTurnOutcome = 'presLoss';
  else if(s.flags.race && s.flags.race !== 'none') s.flags.lastTurnOutcome = s.flags.won ? 'raceWin' : 'raceLoss';
  else s.flags.lastTurnOutcome = 'none';

  if(s.flags.electedPresident) return;
  if(s.flags.ranPresident){
    /* 대선에 나간 턴에는 기존 자리를 유지하지 못한다 (설계 2-2) */
    if(!s.flags.presWait) s.politicalCareer = CAREER_PATHS.defeated;
    s.politicalCareerExtra = '대선 ' + (s.flags.presTries || 1) + '회 도전';
  } else if(s.flags.race && s.flags.race !== 'none'){
    finalizePoliticalCareer(s);
  }
  /* 다음 턴을 위해 이번 턴 표시를 지운다 */
  s.flags.ranPresident = false; s.flags.presWait = false; s.flags.bolted = false;
  s.flags.mergeDone = false; s.flags.debateSwing = 0; s.flags.factionDeal = false;
  s.flags.visionRun = false; s.flags.isReelect = false;
}

/* ============================================================================
   엔딩 (설계 2-6)
   ============================================================================ */
/* 당선 에필로그 — 청렴도와 공약 일치도로 평가 문구가 달라진다 */
function pledgeConsistency(s){
  /* 35~40세에 내건 공약을 대선까지 얼마나 지켰는가 */
  var score = 0;
  if(s.flags.pledgeShift === 'keep') score += 2;
  else if(s.flags.pledgeShift === 'update') score += 1;
  if(s.flags.factionDealEver) score -= 1;
  if(s.flags.flipRiskEver) score -= 1;
  if(s.flags.mergeDoneEver) score -= 1;
  return score;   /* -3 ~ 2 */
}
function inaugurationText(s){
  var clean = s.stats.integrity, keep = pledgeConsistency(s);
  var lines = [];
  lines.push('취임식 날 아침, 광장에 사람이 가득 찼다. 선서문을 읽는 손이 조금 떨렸다.');
  if(clean >= 70) lines.push('가장 많이 나온 말은 "깨끗한 사람"이었다. 오래 지킨 원칙이 이름이 됐다.');
  else if(clean >= 45) lines.push('평판은 무난했다. 흠이 없진 않았지만 큰 흠도 없었다.');
  else lines.push('축하 기사 옆에 검증 기사가 나란히 실렸다. 지켜보겠다는 말이 많았다.');
  if(keep >= 2) lines.push('십 년 전 공약집과 지금 공약집이 거의 같다는 기사가 화제가 됐다.');
  else if(keep >= 0) lines.push('공약은 시대에 맞게 다듬어졌다. 크게 어긋난 대목은 없었다.');
  else lines.push('말이 여러 번 바뀌었다는 지적이 따라왔다. 이제 결과로 답해야 한다.');

function endingArt(key, s){
  var e = ENDINGS[key] || {};
  var base = GROUP_ART[e.group] || GROUP_ART['낙선'];
  var art = ENDING_ART[key] || {};
  return {
    head:fill(art.head || base.head, s),
    sub:fill(art.sub || base.sub, s),
    moment:art.moment || base.moment,
    verdict:art.verdict || base.verdict,
    hint:art.hint || base.hint
  };
}

/* 몰락 엔딩의 마지막 한 줄 — 남은 것 하나를 짚는다 (설계 D-2) */
function despiteLine(s){
  var left = [];
  if(s.flags.life === '결혼과 가정') left.push('그럼에도 집에 돌아가면 불이 켜져 있었다.');
  if(s.chain && s.chain.localBase) left.push('그럼에도 그 동네 사람들은 여전히 그를 별명으로 불렀다.');
  if(s.chain && s.chain.protege) left.push('그럼에도 그가 가르친 사람은 아직 그 일을 하고 있다.');
  if(s.chain && s.chain.hardPromise) left.push('그럼에도 그가 밀어붙인 법 하나는 지금도 살아 있다.');
  if(s.mentor && s.chain && s.chain.metMentor)
    left.push('그럼에도 ' + s.mentor.name + josaEunNeun(s.mentor.name) + ' 끝까지 그의 편이었다.');
  if(s.stats.integrity >= 60) left.push('그럼에도 그를 아직 믿는 사람이 한 명은 남아 있었다.');
  if(!left.length) left.push('그럼에도 처음 그 마음만은 거짓이 아니었다고, 아는 사람들은 말한다.');
  return left[rnd(left.length - 1)];
}

/* ── 4장. 사람들의 말 ─────────────────────────────────────────────────
   청렴도, 공약 일치도, 몰락 경로 이력, 연쇄 이벤트, 라이벌·멘토에 따라 달라진다. */
/* ── 6차 C-1. 라이벌의 결말 한 줄 ────────────────────────────────────────
   내가 어떻게 끝났는지에 따라 라이벌도 다른 자리에 가 있다. */
const RIVAL_FATE = {
  ally:['끝내 같은 편에 섰고, 지금도 같은 자리에 있다.',
        '손을 잡은 뒤로는 한 번도 등을 돌리지 않았다.'],
  beatenByMe:['그 선거 뒤로 한동안 보이지 않다가, 지역으로 돌아갔다.',
              '내가 올라선 자리 근처에서 오래 머물렀지만 끝내 닿지 못했다.'],
  wonOverMe:['그 사람은 결국 원하던 자리에 앉았다. 나는 그 자리를 오래 바라봤다.',
             '먼저 갔고, 끝까지 앞에 있었다.'],
  quiet:['조용히 정치를 접고 본업으로 돌아갔다.',
         '몇 해 뒤 다른 분야에서 이름이 들렸다.'],
  still:['아직도 어딘가에서 같은 일을 하고 있다.',
         '여전히 현역이다. 언젠가 또 마주칠 것이다.']
};
function rivalFate(s){
  var key;
  if(s.flags.rivalAlly) key = 'ally';
  else if(s.flags.electedPresident) key = 'beatenByMe';
  else if(s.flags.rivalIsNemesis && !s.flags.electedPresident) key = 'wonOverMe';
  else if(s.flags.downfallPath || s.flags.retirePath) key = 'still';
  else key = (s.chain && s.chain.beatRival) ? 'beatenByMe' : 'quiet';
  var pool = RIVAL_FATE[key] || RIVAL_FATE.still;
  return pool[rnd(pool.length - 1)];
}
function peopleLines(s){
  var out = [];
  var clean = s.stats.integrity, keep = pledgeConsistency(s);
  var won = !!s.flags.electedPresident;

  /* 1) 가족 */
  if(s.flags.life === '결혼과 가정'){
    out.push({ who:'배우자', line: won ? '"이제야 얼굴 보겠네."'
      : (s.group === '조용한 결말' ? '"요즘 얼굴이 편해 보인다."' : '"고생했어. 진짜로."') });
  } else if(s.chain && s.chain.helpFriend){
    out.push({ who:'오랜 친구', line:'"그때 네가 준 돈, 아직 안 갚았다."' });
  } else {
    out.push({ who:'어머니', line: clean >= 70 ? '"남한테 싫은 소리 안 듣고 살았으면 됐다."'
                                              : '"밥은 먹고 다녔니."' });
  }
  /* 2) 참모 또는 멘토 */
  if(s.chain && s.chain.metMentor && s.mentor){
    out.push({ who:s.mentor.name, line: (s.chain.refusedMentor
      ? '"그때 내 부탁을 거절한 게 네 인생 제일 잘한 일이다."'
      : (s.chain.owedMentor ? '"내가 자네한테 빚을 지웠어. 미안하네."' : '"지는 법을 먼저 배우라고 했지."')) });
  } else if(s.flags.aide){
    out.push({ who:'캠프 참모', line: won ? '"제가 본 후보 중에 제일 오래 버텼습니다."'
                                        : '"다음엔 더 잘할 수 있었는데요."' });
  } else {
    out.push({ who:'오래 일한 보좌진', line:'"시키신 일보다 안 시키신 일을 더 많이 했습니다."' });
  }
  /* 3) 라이벌 — 6.1차 7. 실제로 만난 적이 없으면 엔딩에서 언급하지 않는다 */
  if(s.rival && s.rival.met){
    var rl;
    if(s.flags.rivalAlly) rl = '"결국 같은 데를 보고 있었더군."';
    else if(won) rl = '"인정한다. 이번엔 당신이 옳았다."';
    else if(s.chain && s.chain.beatRival) rl = '"이겼다고 생각하지 마라. 아직 안 끝났다."';
    else rl = '"우리는 서로를 제일 잘 아는 사이였지."';
    /* 6차 C-1. 라이벌이 어떻게 되었는지 한 줄로 함께 보여 준다 */
    out.push({ who:s.rival.name, line:rl, fate:rivalFate(s) });
  }
  /* 4) 시민 — 청렴도와 공약 일치도, 몰락 이력이 여기서 드러난다 */
  var cl;
  if(s.flags.downfallPath) cl = '"그래도 한때는 기대했었다."';
  else if(clean >= 78 && keep >= 2) cl = '"말한 대로 했다. 그것만으로도 드문 사람이다."';
  else if(clean >= 78) cl = '"적어도 손은 깨끗했다."';
  else if(keep >= 2) cl = '"약속은 지켰다. 마음에 안 드는 약속도 있었지만."';
  else if(clean < 40) cl = '"결국 다들 똑같더라."';
  else cl = '"그럭저럭 했다고 본다."';
  out.push({ who:'시민', line:cl });
  return out.slice(0, 4);
}

/* 어떤 엔딩을 줄지 고른다 */
function decideEnding(s){
  /* 0) 진로도 정하기 전에 그만둔 경우 (5차 A-3의 '은퇴하기') */
  if(!s.career) return 'fenceEnd';
  /* 0-B) 6차 B-2. 은퇴 후에 무엇을 하며 살았는지가 결말을 정한다.
         본업으로 돌아갔으면 진로별 조용한 결말, 후배를 키웠으면 킹메이커 계열. */
  if(s.flags.retirePath){
    var byCareerQuiet = ({ law:'quietLaw', sci:'quietSci', media:'quietMedia',
                           ent:'quietEnt', biz:'quietBiz', poli:'quietPoli' })[s.career] || 'quietLaw';
    var map = { work:byCareerQuiet, family:'retireFamily', memoir:'retireMemoir',
                local:'retireLocal', mentor:(ENDINGS.kingmaker ? 'kingmaker' : byCareerQuiet) };
    var k = map[s.flags.retirePath];
    if(k && ENDINGS[k]) return k;
    return byCareerQuiet;
  }
  /* 1) 몰락 — 청렴도가 매우 낮고 경고가 여러 번 쌓인 뒤에만 */
  /* 1-A) 위기에서 스스로 내려놓은 경우 — 조용한 결말 (진로별) */
  if(s.flags.quietEnding){
    return ({ law:'quietLaw', sci:'quietSci', media:'quietMedia',
              ent:'quietEnt', biz:'quietBiz', poli:'quietPoli' })[s.career] || 'quietLaw';
  }
  /* 1-B) 위기 이벤트에 실패한 경우 — 경로별 몰락 */
  if(s.flags.downfallPath){
    return CRISIS_PATHS[s.flags.downfallPath].endingKey;
  }
  var D = CONFIG.downfall;
  if(!s.flags.electedPresident && s.stats.integrity <= D.integrityMax &&
     (s.flags.integrityWarnings || 0) >= D.warningsNeeded && s.flags.scandalFailed){
    return 'downCorrupt';
  }
  var tries = s.flags.presTries || 0;
  /* 2) 당선했을 때만 열리는 숨은 엔딩 (설계 D-2) */
  if(s.flags.electedPresident){
    if(s.flags.wonWrongForecast) return 'forecastFlip';
    if(hasTrait(s, 'lateBloom') && (s.flags.wonAtAge || 0) >= 50) return 'lateLegend';
    if(s.career === 'ent' && (s.flags.fenceTagged || s.flags.everFence)) return 'entTwist';
  }
  /* 3) 대통령 당선 — 드문 조건부터 본다 */
  if(s.flags.electedPresident){
    if(tries >= 4) return 'presFourth';
    /* 더는 다음이 없던 마지막 턴에서, 세 번 진 끝에 이겼다면 */
    if(tries >= 3 && s.turnIndex >= TURNS.length - 1) return 'presFifth';
    if(tries === 3) return 'presThird';
    if(s.flags.wonByComeback) return 'presComeback';
    if(s.flags.comebackStory) return 'presRisen';
    if(isOutsiderRun(s)) return 'presIndep';
    if(tries <= 1) return 'presFirst';
    if(s.career === 'poli') return 'presPoli';
    return 'presCareer';
  }
  /* 4) 떨어졌을 때만 열리는 숨은 엔딩 */
  if((s.flags.newPartyCount || 0) >= 3) return 'threeParties';
  if(s.flags.oneVote && tries >= 1) return 'oneVote';
  /* 청렴 결벽 — 한 점도 묻히지 않고 대선까지 간 아주 드문 경우 */
  if(tries >= 2 && s.stats.integrity >= CONFIG.statMax &&
     !(s.flags.integrityWarnings || 0) && !s.crisis.corruption && !s.crisis.scandal &&
     s.fence === 0) return 'spotless';
  /* 5) 스스로 고른 마무리 */
  if(s.flags.endingPick === 'partyLeader') return 'partyLeader';
  if(s.flags.endingPick === 'retire'){
    return ({ law:'backLaw', sci:'backSci', media:'backMedia', ent:'backEnt', biz:'backBiz', poli:'backPoli' })[s.career];
  }
  /* 5) 대선에 나간 적이 있는가 */
  if(tries > 0){
    if(tries >= 3) return 'perennial';
    /* 킹메이커는 남의 선거를 여러 번 치러 준 사람에게만 (한 번 승복은 그냥 승복이다) */
    if((s.flags.kingmakerCount || 0) >= 2) return 'kingmaker';
    return 'elder';
  }
  /* 6) 대선 미도전 — 정치에 발만 걸친 채 끝까지 선을 넘지 않았다면 그 이야기로 끝난다 */
  var pk = (s.politicalCareer && s.politicalCareer.key) || 'outside';
  if(pk === 'outside' && (s.flags.everFence || fenceStage(s) !== 'none')) return 'fenceEnd';
  if(s.flags.fenceTagged) return 'fenceEnd';
  if((s.flags.kingmakerCount || 0) >= 2) return 'kingmaker';
  var key = (s.politicalCareer && s.politicalCareer.key) || 'outside';
  if(key === 'governor') return 'famedGovernor';
  if(key === 'district' || key === 'proportional') return 'speaker';
  if(key === 'mayor' || key === 'local') return 'heavyweight';
  return ({ law:'backLaw', sci:'backSci', media:'backMedia', ent:'backEnt', biz:'backBiz', poli:'backPoli' })[s.career];
}

/* ── C-2. 후원자 ─────────────────────────────────────────────────────────
   받을 때는 정체를 알 수 없다. 청렴도나 조직력이 높으면 힌트 한 줄이 붙는다.
   나쁜 후원자는 많이 주지만 비리 위기를 쌓고, 몇 턴 뒤 사고를 치고 돌아온다. */
function donorOffer(s){
  if(!s.donorPick) s.donorPick = pickDonor();
  return s.donorPick;
}
function takeDonor(s, checked){
  var d = s.donorPick || pickDonor();
  var amount = d.amount;
  if(checked) amount = Math.max(1, amount - CONFIG.donor.checkCost);
  applyEffects(s, { funds:amount, org:4 });
  if(d.corrupt) addCrisis(s, 'corruption', checked ? Math.round(d.corrupt * 0.5) : d.corrupt);
  s.donor = { id:d.id, good:d.good, who:d.who, amount:amount,
              turn:s.turnIndex, delay:d.delay || 2, checked:!!checked, done:false };
  (s.donorLog = s.donorLog || []).push(d.id);
  s.donorPick = null;
}
const EVENTS_C = [

{ turn:['t3','t4','late'], careers:'*', title:'후원 제안', forced:true,
  when:function(s){ return !s.donor && !!s.flags.entry && s.flags.entry !== 'declined'; },
  text:function(s){
    var d = donorOffer(s);
    var hint = donorHintShown(s) ? '\n' + d.hint : '';
    return d.who + '이 후원을 하겠다고 한다. ' + d.take + hint;
  },
  options:function(s){
    var d = donorOffer(s);
    var list = [

        effects:{ integrity:7, approval:4, funds:-4 }, pt:1,
        apply:function(st){ st.donorPick = null; st.flags.refusedDonor = true; } }

    if(donorHintShown(s)){

        effects:{ policy:4 }, pt:2, apply:function(st){ takeDonor(st, true); } });
    }
    return list;

/* ---------- 작은 도구들 ---------- */
function rnd(n){ return Math.floor(Math.random() * (n + 1)); }        // 0 ~ n
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){
  return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]; }); }
function val(x, s){ return (typeof x === 'function') ? x(s) : x; }

/* ---------- 빈 문구 안전장치 ----------
   문구가 없거나 계산이 어긋나도 화면에 'undefined' 가 나오지 않게 한다.
   기본 문구는 아래 FALLBACK 에 모아 두었다. */
const FALLBACK = {
  intro:'다음 5년이 시작된다.',
  title:'다음 5년',
  prompt:'무엇을 할까?',
  label:'선택',

/* ---------- 4차 B-2. 문구 안의 {이름} 자리를 채운다 ----------
   {name} 나, {rival} 이번 판의 라이벌, {mentor} 이번 판의 멘토 */
function fill(t, s){
  if(t === undefined || t === null) return t;
  s = s || S;
  var str = String(t);
  if(str.indexOf('{') < 0) return str;
  /* 이름 뒤에 보이지 않는 표시를 붙여 두면 fixJosa 가 조사를 맞춰 준다 (6차 A-2) */
  str = str
    .replace(/\{name\}/g,   ((s && s.name) || '나') + JOSA_MARK)
    .replace(/\{rival\}/g,  ((s && s.rival && s.rival.name) || '경쟁자') + JOSA_MARK)
    .replace(/\{mentor\}/g, ((s && s.mentor && s.mentor.name) || '선배') + JOSA_MARK);
  return fixJosa(str);
}
function safe(x, s, kind){
  var t;
  try{ t = val(x, s); }catch(e){ t = null; }
  if(t === undefined || t === null) return FALLBACK[kind] || '…';
  t = fill(String(t), s);
  if(t.trim() === '' || t.indexOf('undefined') >= 0 || t.indexOf('NaN') >= 0){
    return FALLBACK[kind] || '…';
  }
  return t;
}
/* 이야기 문구를 화면에 내보낼 때 쓰는 짧은 도구 (이름 채우기 + HTML 이스케이프) */
function story(t, s){ return esc(fill(val(t, s || S), s || S)); }
function lastGrade(s){ return s.grades.length ? s.grades[s.grades.length-1].grade : 'mid'; }
/* 등급(high/mid/low)은 내부 계산·분기에만 쓰고 화면에는 절대 표시하지 않는다.
   (설계 추가문서 A절) 플레이어에게는 이야기 문구와 열리고 막히는 선택지로만 드러난다. */

/* ---------- B-1. 재능과 성장률 ----------
   같은 선택을 해도 사람마다 오르는 폭이 다르다. 한계치에 가까우면 느려진다. */
function hasTrait(s, id){ return !!(s.traits && s.traits.some(function(t){ return t.id === id; })); }
function growthMul(s, key, amount){
  if(amount <= 0) return 1;                 /* 깎이는 건 재능과 무관하다 */
  var T = CONFIG.talent;
  var mul = T.growth[s.growthRate || 'normal'].mul;
  /* 특성별 성장 배율 */
  (s.traits || []).forEach(function(t){ if(t.growth && t.growth[key]) mul *= t.growth[key]; });
  /* '늦되는 사람' — 40세 전엔 느리고 뒤엔 빠르다 */
  if(hasTrait(s, 'lateBloom')){
    mul *= (s.curAge && s.curAge >= T.lateBloomAge) ? T.lateBloomLate : T.lateBloomEarly;
  }
  /* 6차 B-3. 나이에 따른 성장 배율 — 젊을수록 같은 선택이 크게 남는다 */
  var age = s.curAge || 17;
  for(var ai = 0; ai < T.ageGrowth.length; ai++){
    if(age >= T.ageGrowth[ai].from){ mul *= T.ageGrowth[ai].mul; break; }
  }
  /* 6차 C-5. 고향에 따른 성장 — 수도권은 이름이, 지방은 조직이 빨리 붙는다.
     (인구 규모와 조직 기반이라는 중립적인 요소만 반영한다) */
  var RT = regionType(s);
  if(RT && RT.growth[key]) mul *= RT.growth[key];
  /* 6차 C-3. 입문 때 만든 당은 조직이 없어 조직력이 더디다 */
  if(key === 'org' && s.flags && s.flags.earlyParty) mul *= CONFIG.earlyParty.orgGrowth;
  /* 한계치에 가까워지면 점점 느려진다 */
  var cap = s.caps && s.caps[key];
  if(cap){
    var now = s.stats[key];
    var soft = cap * T.softStart;
    if(now >= cap) mul *= T.softFloor;
    else if(now > soft){
      var r = (now - soft) / (cap - soft);           /* 0 → 1 */
      mul *= (1 - r) + r * T.softFloor;
    }
  }
  return mul;
}
/* 방금 적용된 변화의 크기 (엔딩의 '중요했던 선택' 고르기에만 쓴다) */
var lastImpact = 0;
/* 연대기에 한 줄 적는다. 그 줄이 얼마나 큰 변화를 불렀는지도 같이 기록한다. */
function logHistory(entry){
  entry.imp = lastImpact;
  entry.age = S ? S.curAge : null;
  S.history[S.history.length] = entry;
  lastImpact = 0;
  return entry;
}
/* 능력치 변화 적용. 바뀐 값 목록을 돌려준다. */
function applyEffects(s, effects, why){
  var out = [];
  if(!effects) return out;
  Object.keys(effects).forEach(function(k){
    if(!STAT_META[k]) return;
    var raw = effects[k];
    /* 능력치가 오를 때만 재능·성장률이 끼어든다. 자금과 지지율은 그대로. */
    if(raw > 0 && ['speech','policy','org','integrity','fame','stamina'].indexOf(k) >= 0){
      raw = Math.max(1, Math.round(raw * growthMul(s, k, raw)));
    }
    var before = s.stats[k];
    var min = (k === 'funds') ? CONFIG.money.debtFloor : CONFIG.statMin;
    var after = Math.max(min, Math.min(CONFIG.statMax, before + raw));
    s.stats[k] = after;
    if(after !== before) out.push({ key:k, diff: after - before });
    /* 6차 E. 메달 판정에 쓰는 기록 — 화면에는 아무것도 나오지 않는다 */
    if(s.medalState){
      if(k === 'integrity' && after < before) s.medalState.integrityDropped = true;
      if(k === 'funds' && after < 0) s.medalState.everDebt = true;
      if(k === 'stamina' && gaugeCellsOf(after) <= 2) s.medalState.staminaLow = true;
    }
    /* 이번 턴에 쓴 능력치로 기록 (안 쓰면 턴 끝에 조금 녹슨다) */
    if(raw > 0 && s.usedStats) s.usedStats[k] = true;
  });
  /* 4차 D-1. 방금 적용한 변화의 크기를 기억해 둔다.
     엔딩 3장에서 '중요했던 선택 3개'를 고르는 데만 쓰인다 (화면에는 숫자로 안 나온다). */
  lastImpact = 0;
  out.forEach(function(d){
    var w = (d.key === 'integrity') ? 1.7 : (d.key === 'approval') ? 1.4
          : (d.key === 'fame') ? 1.1 : (d.key === 'funds') ? 0.45 : 1;
    lastImpact += Math.abs(d.diff) * w;
  });
  lastImpact = Math.round(lastImpact);
  /* 5차 B-2. 그 능력을 처음 '크게 쓰는' 순간 잠재력 칸이 열린다.
     크게 오를 때뿐 아니라 크게 깎일 때도 알게 된다 (체력이 대표적이다). */
  if(s.scoutOpen){
    out.forEach(function(d){
      if(Math.abs(d.diff) >= CONFIG.talent.scout.revealGain) revealScout(s, d.key);
    });
  }
  if(why && out.length) s.bonusNotes.push(why);
  /* 청렴도를 크게 깎는 선택은 '경고'로 쌓아 둔다.
     몰락 엔딩이 경고 없이 갑자기 오지 않게 하기 위함 (설계 2-6) */
  if(effects.integrity && effects.integrity <= -CONFIG.downfall.warnDelta){
    s.flags.integrityWarnings = (s.flags.integrityWarnings || 0) + 1;
  }
  return out;
}

/* ---------- 저장 (실패해도 게임은 그대로 진행) ---------- */
/* ---------- 4차 D-3. 엔딩 도감 저장 ----------
   { best:최고점수, book:{ 엔딩키:{ t:제목, g:분류, last5:[마지막 5줄] } },
     hall:[ {n:이름, c:진로, a:당선 나이, t:칭호} ] }
   저장소를 못 써도 게임은 그대로 돌아간다. */
function loadSave(){
  var d = { best:0, book:{}, hall:[] };
  try{
    var raw = localStorage.getItem(CONFIG.saveKeys.book);
    if(raw){
      var p = JSON.parse(raw) || {};
      d.best = p.best || 0; d.book = p.book || {}; d.hall = p.hall || [];
    }
    /* 옛 저장본이 있으면 최고 점수와 본 엔딩만 옮겨 온다 */
    var b = localStorage.getItem(CONFIG.saveKeys.best);
    if(b) d.best = Math.max(d.best, parseInt(b, 10) || 0);
    var e = localStorage.getItem(CONFIG.saveKeys.endings);
    if(e){
      (JSON.parse(e) || []).forEach(function(x){
        var pp = String(x).split('|');
        var k = pp[0];
        if(k && !d.book[k]) d.book[k] = { t:pp[1] || k, g:pp[2] || '기타', last5:[] };
      });
    }
  }catch(err){ /* 저장소를 못 써도 무시하고 진행 */ }
  return d;
}
function writeSave(score, key, title, group, last5, hallEntry){
  var ok = true;
  try{
    var cur = loadSave();
    if(score > cur.best) cur.best = score;
    cur.book[key] = { t:title, g:group, last5:last5 || [] };
    if(hallEntry){
      cur.hall.unshift(hallEntry);
      cur.hall = cur.hall.slice(0, 10);
    }
    localStorage.setItem(CONFIG.saveKeys.book, JSON.stringify(cur));
  }catch(err){ ok = false; }
  return ok;
}

function rollScout(){
  var SC = CONFIG.talent.scout, keys = SC.keys, n = keys.length;
  var raw = keys.map(function(){ return 0.5 + Math.random(); });   /* 0.5 ~ 1.5 */
  var sum = raw.reduce(function(a, b){ return a + b; }, 0);
  var out = {}, used = 0;
  keys.forEach(function(k, i){
    var v = raw[i] / sum * SC.total;
    v = Math.max(SC.min, Math.min(SC.max, v));
    out[k] = v; used += v;
  });
  /* 자르고 남은(혹은 모자란) 만큼을 여유 있는 칸에 나눠 되돌린다 */
  var gap = SC.total - used, guard = 0;
  while(Math.abs(gap) > 0.05 && guard++ < 40){
    var room = keys.filter(function(k){
      return gap > 0 ? out[k] < SC.max - 0.01 : out[k] > SC.min + 0.01;
    });
    if(!room.length) break;
    var share = gap / room.length;
    room.forEach(function(k){ out[k] = Math.max(SC.min, Math.min(SC.max, out[k] + share)); });
    used = keys.reduce(function(a, k){ return a + out[k]; }, 0);
    gap = SC.total - used;
  }
  /* 소수 첫째 자리까지만 쓰고, 오차는 가장 큰 칸이 떠안는다 */
  var big = keys[0], total2 = 0;
  keys.forEach(function(k){ out[k] = Math.round(out[k] * 10) / 10; total2 += out[k];
    if(out[k] > out[big]) big = k; });
  out[big] = Math.round((out[big] + (SC.total - total2)) * 10) / 10;
  return out;
}
function rollTalent(s){
  var T = CONFIG.talent, SC = T.scout;
  /* 1) 재능 배분 — 이 값이 화면에 보이는 유일한 숫자다 */
  s.scout = rollScout();
  /* 2) 숨은 한계치는 재능 배분에서 계산한다 */
  T.capStats.forEach(function(k){
    var r = (s.scout[k] - SC.lo) / (SC.hi - SC.lo);
    s.caps[k] = Math.round(T.capMin + Math.max(0, Math.min(1, r)) * (T.capMax - T.capMin));
  });
  /* 3) 뚝심은 시작 체력으로 */
  s.stats.stamina = Math.max(30, Math.min(CONFIG.statMax,
    Math.round(CONFIG.startStats.stamina + (s.scout.stamina - SC.total / SC.keys.length) * T.staminaPerPoint)));
  /* 4) 성장률 */
  s.growthRate = T.growthPick[rnd(T.growthPick.length - 1)];
  /* 5) 특성 1~2개 (이름도 문구도 처음에는 보여 주지 않는다) */
  var pool = TRAITS.slice(), n = T.traitMin + rnd(T.traitMax - T.traitMin);
  for(var i = 0; i < n && pool.length; i++){ s.traits.push(pool.splice(rnd(pool.length - 1), 1)[0]); }
  /* 6) 집안 형편 */
  var M = CONFIG.money;
  var bg = M.backgroundPick[rnd(M.backgroundPick.length - 1)];
  s.background = bg;
  s.stats.funds = M.background[bg].start;
  var best = null;
  T.capStats.forEach(function(k){ if(!best || s.caps[k] > s.caps[best]) best = k; });
  s.bestTalent = best;
}

          '사진 한 장이 생각보다 멀리 갔다.'],
    low:['같은 자리에 있어도 나를 기억하는 사람은 적었다.','몇 번을 만나야 이름을 외워 주었다.',
         '눈에 띄는 쪽은 늘 다른 사람이었다.']
  }
};
/* 칸 하나를 연다. 값은 절대 바꾸지 않고, '알게 됐다'는 사실만 기록한다. */
function revealScout(s, key){
  if(!s || !s.scout || !s.scoutOpen) return;
  if(CONFIG.talent.scout.keys.indexOf(key) < 0) return;
  if(s.scoutOpen[key]) return;
  s.scoutOpen[key] = true;
  s.scoutNew = (s.scoutNew || 0) + 1;    /* 6차 A-3: 잠재력 탭에 알림 표시 */
  var SC = CONFIG.talent.scout;
  var hi = s.scout[key] >= (SC.total / SC.keys.length);
  var pool = (SCOUT_REVEAL[key] || {})[hi ? 'high' : 'low'] || [];
  var line = pool.length ? pool[rnd(pool.length - 1)] : '나에 대해 하나 더 알게 됐다.';
  var item = { age:s.curAge || 16, text:line, reveal:true };
  var inPlan = (s.phase === 'intro' || s.phase === 'plan' || s.phase === 'summary');
  if(s.tlFeed && !inPlan) s.tlFeed.push(item);
  else (s.scoutQueue = s.scoutQueue || []).push(item);
  showTip(s, 'scout');   /* 재능 칸이 처음 열릴 때 (5차 C-3) */
  showScoutPop(s, key, line);   /* 6.1차 2. 화면 가운데 알림 */
  pushAlert(s, '재능을 하나 알게 됐다 — ' + ((CONFIG.talent.scout.labels||{})[key] || key));   /* 6.1차 6-2 */
}
/* ══════════════════════════════════════════════════════════════════════════
   6.1차 2 — 잠재력 해금 알림
   아래 탭의 작은 점만으로는 놓치기 쉬워서, 화면 가운데에 잠깐 띄운다.
   열린 능력 이름, 발견 문구, 몇 번째인지를 함께 보여 주고 누르면 잠재력 탭으로 간다.
   움직임 줄이기 설정이면 나타나는 애니메이션 없이 그대로 보여 준다.
   ══════════════════════════════════════════════════════════════════════════ */
var scoutPopTimer = null;
function clearScoutPopTimer(){ if(scoutPopTimer){ clearTimeout(scoutPopTimer); scoutPopTimer = null; } }
function showScoutPop(s, key, line){
  var SC = CONFIG.talent.scout;
  s.scoutPop = {
    key:key,
    name:(SC.labels && SC.labels[key]) || (STAT_META[key] || {}).name || key,
    line:line,
    n:scoutOpenCount(s),
    total:SC.keys.length
  };
  /* 잠깐 떠 있다 사라진다. 저장소나 타이머가 없어도 게임은 그대로 간다. */
  if(typeof setTimeout !== 'function') return;
  clearScoutPopTimer();
  scoutPopTimer = setTimeout(function(){
    if(S && S.scoutPop && S.scoutPop.key === key){ S.scoutPop = null; render(); }
  }, CONFIG.talent.scout.popMs);
}
function scoutPopHTML(){
  if(!S || !S.scoutPop) return '';
  var p = S.scoutPop;
  return '<div class="popbg" data-act="scoutpopgo"></div>' +
    '<div class="scoutpop" data-act="scoutpopgo" role="status">' +
      '<div class="spk">재능 ' + p.n + ' / ' + p.total + ' 발견</div>' +
      '<div class="spn">' + esc(p.name) + '</div>' +
      '<div class="spl">' + esc(p.line) + '</div>' +
      '<div class="spgo">눌러서 캐릭터 보기 ›</div>' +
    '</div>';
}
function revealAllScout(s){
  CONFIG.talent.scout.keys.forEach(function(k){ revealScout(s, k); });
}
function scoutOpenCount(s){
  if(!s || !s.scoutOpen) return 0;
  return CONFIG.talent.scout.keys.filter(function(k){ return s.scoutOpen[k]; }).length;
}

/* 잠재력 카드 — 열린 칸만 숫자와 막대로, 나머지는 물음표로.
   withNow 를 주면 '타고남'과 '지금 등급'을 나란히 보여 준다 (5차 보완 3). */
const SCOUT_BAR_COLOR = ['#5b6fa8', '#6f7f56', '#4f7d8c', '#8a6a86', '#9a5f5f'];
function scoutHTML(s, withNow){
  if(!s || !s.scout) return '';
  var SC = CONFIG.talent.scout;
  var open = scoutOpenCount(s);
  var h = '<div class="scout' + (withNow ? ' wide' : '') + '"><div class="sh"><span class="st">잠재력</span>' +
    '<span class="sn">' + (open >= SC.keys.length
      ? '타고난 것의 합은 ' + SC.total + '입니다'
      : '살면서 알게 됩니다 · ' + open + ' / ' + SC.keys.length) + '</span></div>';
  if(withNow){
    h += '<div class="srow head"><span class="sl"></span><span class="sv">타고남</span>' +
      '<span class="sb"></span><span class="sg">지금</span></div>';
  }
  h += SC.keys.map(function(k, i){
    var now = withNow ? '<span class="sg">' + gradeOf(s.stats[k]) + '</span>' : '';
    if(!s.scoutOpen[k]){
      return '<div class="srow closed"><span class="sl">' + esc(SC.labels[k]) + '</span>' +
        '<span class="sv">?</span><span class="sb"><i class="q"></i></span>' + now + '</div>';
    }
    var v = s.scout[k];
    var pct = Math.max(6, Math.min(100, Math.round((v - SC.min) / (SC.max - SC.min) * 88) + 12));
    return '<div class="srow"><span class="sl">' + esc(SC.labels[k]) + '</span>' +
      '<span class="sv">' + v.toFixed(1) + '</span>' +
      '<span class="sb"><i style="width:' + pct + '%;background:' + SCOUT_BAR_COLOR[i % 5] + '"></i></span>' +
      now + '</div>';
  }).join('');
  if(withNow){
    h += '<div class="snote">타고난 것은 바뀌지 않습니다. 지금 등급은 살면서 오르고 내립니다.</div>';
  }
  return h + '</div>';
}

/* ---------- B-5. 위기 수치 ---------- */
function crisisStage(v){
  var st = CONFIG.crisis.stages, key = st[0].key;
  for(var i = 0; i < st.length; i++){ if(v >= st[i].min) key = st[i].key; }
  return key;
}
function crisisUnlocked(s, path){
  var t = TURNS[Math.min(s.turnIndex, TURNS.length - 1)];
  /* 후반 턴은 턴 수가 늘어도 같은 목록을 쓴다 (설계 B-1) */
  var list = isLateTurnId(t.id) ? CONFIG.crisis.unlockLate : (CONFIG.crisis.unlock[t.id] || []);
  return list.indexOf(path) >= 0;
}
/* 나이에 따른 건강 위기 가속 (설계 B-1) */
function healthAgeMul(age){
  var t = CONFIG.crisis.healthAgeMul || [];
  for(var i = 0; i < t.length; i++){ if(age >= t[i].from) return t[i].mul; }
  return 1;
}
/* 위기 수치를 올린다. 특성과 나이에 따라 빨라지거나 느려진다. */
function addCrisis(s, path, amount){
  if(amount <= 0) return;
  var mulTable = CONFIG.crisis.traitMul[path] || {};
  var mul = 1;
  Object.keys(mulTable).forEach(function(traitId){ if(hasTrait(s, traitId)) mul *= mulTable[traitId]; });
  if(path === 'health') mul *= healthAgeMul(s.curAge || 20);
  s.crisis[path] = Math.max(0, Math.min(100, s.crisis[path] + Math.round(amount * mul)));
}
function easeCrisis(s, path, amount){ s.crisis[path] = Math.max(0, s.crisis[path] - amount); }
/* 지금 터질 위기가 있는가? (열린 경로 중 가장 높은 것) */
function pendingCrisis(s){
  var best = null;
  Object.keys(s.crisis).forEach(function(p){
    if(!crisisUnlocked(s, p)) return;
    if(s.crisis[p] >= CONFIG.crisis.crisisAt && (!best || s.crisis[p] > s.crisis[best])) best = p;
  });
  return best;
}

/* ---------- B-6. 경계선 머물기 ---------- */
function fenceStage(s){
  var st = CONFIG.fence.stages, key = st[0].key;
  for(var i = 0; i < st.length; i++){ if(s.fence >= st[i].min) key = st[i].key; }
  return key;
}
function addFence(s, n){
  s.fence = Math.min(100, s.fence + (n === undefined ? CONFIG.fence.perAction : n));
  /* 한 번이라도 '경계에 서 있다'는 소리를 들었는지 (엔딩 조건에 쓴다) */
  if(fenceStage(s) !== 'none') s.flags.everFence = true;
}
/* 입당·출마·공직 임명이면 경계선이 풀린다 */
function clearFence(s, reason){
  if(s.fence <= 0) return;
  /* 쌓아 둔 인지도와 인맥이 정치 자산으로 바뀐다 */
  var bonus = Math.round(s.fence / 6);
  applyEffects(s, { approval:bonus, org:Math.round(bonus / 2) });
  pushFeed(s, 'news', '경계에 서 있던 사람이 드디어 선을 넘었다.');
  s.fence = 0;
  s.flags.fenceCleared = true;
}

/* ---------- B-7. 체급 ---------- */
function tierScore(s){
  var base = (s.stats.speech + s.stats.policy + s.stats.org + s.stats.fame) / 4;
  base += s.stats.fame * 0.25 + s.stats.approval * 0.2;
  var key = s.politicalCareer && s.politicalCareer.key;
  if(key) base += CONFIG.tier.careerBonus[key] || 0;
  if((s.flags.presTries || 0) > 0) base += CONFIG.tier.presRunBonus;
  /* 경계선에 오래 머물면 체급이 깎인다 (40세 이후) */
  if(s.turnIndex >= 5 && s.fence >= CONFIG.fence.tierDropAt) base -= 12;
  return base;
}
function tierLevel(s){
  var sc = tierScore(s), cuts = CONFIG.tier.cuts, lv = 1;
  for(var i = 0; i < cuts.length; i++){ if(sc >= cuts[i]) lv = i + 1; }
  return lv;
}
function tierName(s){ return CONFIG.tier.names[tierLevel(s) - 1]; }
/* 잠재력 별 — 나이가 들수록 드러난다 */
/* 5차 B. 잠재력 별은 '열린 칸'만 가지고 만든다.
   아직 알지 못하는 재능이 별 개수로 미리 드러나면 안 된다.
   열린 칸 수만큼만 별을 채우고 나머지는 물음표로 둔다. */
function potentialStars(s){
  var SC = CONFIG.talent.scout;
  var keys = SC.keys, opened = [];
  keys.forEach(function(k){ if(s.scoutOpen && s.scoutOpen[k]) opened.push(s.scout[k]); });
  var out = '';
  if(!opened.length) return '?????';
  var avg = opened.reduce(function(a, b){ return a + b; }, 0) / opened.length;
  var mid = SC.total / keys.length;           /* 평균값 (=20) */
  /* 평균보다 얼마나 위인지를 1~5개 별로 */
  var stars = Math.max(1, Math.min(5, Math.round((avg - mid) / 3.2) + 3));
  for(var i = 0; i < keys.length; i++){
    if(i < opened.length) out += (i < stars ? '★' : '☆');
    else out += '?';
  }
  return out;
}

/* ---------- B-3. 한 해의 자금 정산 ---------- */
function settleYear(s){
  var M = CONFIG.money;
  var income = M.incomeByCareer[s.career] || 6;
  var key = s.politicalCareer && s.politicalCareer.key;
  if(key) income += M.incomeByPost[key] || 0;
  income += M.background[s.background].yearly;
  /* 과학 기술은 강연료와 연구 과제로 해마다 소액이 더 들어온다 (설계 A-3) */
  if(s.career === 'sci') income += CONFIG.campaignMoney.sciYearly;
  if(s.era && s.era.incomeMul) income = Math.round(income * s.era.incomeMul);
  /* 경계선에 오래 머물면 본업 수입이 준다 (설계 B-6) */
  var fs = fenceStage(s);
  if(fs === 'clear') income = Math.round(income * 0.85);
  else if(fs === 'heavy') income = Math.round(income * 0.7);

  /* 30세 전에는 생활비를 낮게 잡는다 — 인턴이 사실상 강제가 되던 문제 (설계 A-2) */
  var EM = CONFIG.earlyMoney;
  var cost = ((s.curAge || 20) < EM.livingCostAge) ? EM.livingCostUnder : M.livingCost;
  if(s.flags.entry || key){
    var office = M.officeCost;
    /* 정치 외길은 당사를 함께 쓴다 (설계 A-3의 '당의 지원'을 살림살이까지 넓힌 것) */
    if(s.career === 'poli' && s.party) office = Math.max(0, office - CONFIG.campaignMoney.poliOfficeHelp);
    cost += office;
  }
  if(s.flags.aide) cost += M.aideCost;
  /* 6차 C-3. 내가 만든 당은 운영비를 내가 낸다 */
  if(s.flags.earlyParty) cost += CONFIG.earlyParty.yearlyCost;
  /* ── 6.1차 1. 체급이 오를수록 유지비가 커진다 ──────────────────────────
     사무소가 커지고, 보좌진이 늘고, 다녀야 할 행사가 많아진다.
     잠룡 이상이면 가만히 있어도 돈이 빠진다. */
  cost += upkeepFor(s);

  var net = income - cost;
  s.stats.funds = Math.max(M.debtFloor, Math.min(CONFIG.statMax, s.stats.funds + net));

  /* 자금이 바닥이면 파산 위기가 쌓이고, 넉넉하면 조금 가라앉는다 */
  if(s.stats.funds < M.troubleBelow) addCrisis(s, 'bankrupt', CONFIG.crisis.bankruptPerDebt);
  else if(s.stats.funds > 40) easeCrisis(s, 'bankrupt', 3);
  return net;
}

/* ── 6.1차 1. 재산이 짐이 된다 ────────────────────────────────────────────
   자금이 많을수록 재산 공개와 후원금 의혹이 먼저 날아온다.
   예전에는 경영 진로에만 있던 구조를 모든 진로로 넓혔다. 0 ~ 1 을 돌려준다. */
function richHeat(s){
  var R = CONFIG.richHeat, v = (s && s.stats) ? s.stats.funds : 0;
  if(v <= R.from) return 0;
  return Math.min(1, (v - R.from) / Math.max(1, R.full - R.from));
}
function moneyAttackChance(s){
  var R = CONFIG.richHeat;
  var base = (s.career === 'biz') ? CONFIG.campaignMoney.bizAttackFirst : 0;
  return Math.max(base, R.maxChance * richHeat(s));
}
/* ── 6.1차 1. 체급별 유지비 ────────────────────────────────────────────────
   자금이 쌓이기만 하고 나갈 곳이 없어 파산 위기가 사라지던 문제를 푼다.
   '돈이 많다고 해마다 비율로 깎는' 방식은 쓰지 않았다. 이유 없이 사라져 억지스럽다.
   대신 체급이 오르면 실제로 굴려야 할 살림이 커진다. */
function upkeepFor(s){
  var U = CONFIG.upkeep;
  var lv = tierLevel(s);
  var c = U.byTier[Math.max(0, Math.min(U.byTier.length - 1, lv - 1))] || 0;
  /* 정치를 시작하기 전에는 큰 살림이 없다 */
  if(!s.flags.entry && !s.politicalCareer) c = Math.round(c * U.beforeEntry);
  return c;
}
/* ---------- B-4. 나이에 따른 자연 감소 ---------- */
function ageDecay(s, age){
  var list = CONFIG.decay.staminaByAge, loss = 0;
  list.forEach(function(r){ if(age >= r.from) loss = r.loss; });
  if(hasTrait(s, 'tough')) loss = Math.max(0, loss - 1);
  if(loss > 0) s.stats.stamina = Math.max(0, s.stats.stamina - loss);
  var C = CONFIG.crisis;
  /* 체력이 낮으면 건강 위기가 쌓인다 */
  if(s.stats.stamina < C.lowStamina) addCrisis(s, 'health', C.healthPerLowStamina);
  else if(s.stats.stamina > 72) easeCrisis(s, 'health', 2);
  /* 청렴도가 낮으면 비리 위기가 쌓인다 */
  if(s.stats.integrity < C.lowIntegrity) addCrisis(s, 'corruption', C.corruptionPerLowIntegrity);
  else if(s.stats.integrity > 72) easeCrisis(s, 'corruption', 2);
  /* 6차 B-1. 이름이 알려진 채로 청렴도가 낮으면 구설이 해마다 쌓인다.
     (예전에는 쌓이는 길이 이벤트 실패뿐이라 구설 몰락이 한 번도 나오지 않았다) */
  if(s.stats.integrity < C.lowIntegrity && s.stats.fame >= C.scandalFameCut){
    addCrisis(s, 'scandal', C.scandalPerLowClean);
  } else {
    /* 구설은 조용히 지내면 가라앉는다 */
    easeCrisis(s, 'scandal', C.scandalDecay);
  }
}
/* 턴이 끝날 때, 한 번도 쓰지 않은 능력치가 조금 줄어든다 */
function unusedDecay(s){
  var D = CONFIG.decay;
  ['speech','policy','org','fame'].forEach(function(k){
    if(D.unusedExempt.indexOf(k) >= 0) return;
    if(s.usedStats && s.usedStats[k]) return;
    s.stats[k] = Math.max(0, s.stats[k] - D.unusedLoss);
  });
}

/* ---------- C-3. 여론 피드 ---------- */
const FEED_KIND_LABEL = { news:'뉴스', citizen:'시민', community:'동네', rival:'상대 캠프' };
/* 0-5. 여론 글의 따옴표 규칙을 한곳에서 통일한다.
   뉴스  — 헤드라인 전체를 큰따옴표로 묶고, 안쪽 인용은 작은따옴표로. 마침표는 쓰지 않는다.
   시민·동네 — 혼잣말이라 따옴표 없이, 마침표도 없이.
   상대 캠프 — 문장은 그대로 두고 인용한 말만 큰따옴표로 (데이터에 이미 그렇게 적혀 있다). */
function feedQuote(kind, line){
  line = String(line).trim();
  if(kind === 'news'){
    line = line.replace(/^"|"$/g, '').replace(/"/g, "'").replace(/\.$/, '');
    return '"' + line + '"';
  }
  if(kind === 'citizen' || kind === 'community'){
    return line.replace(/^"|"$/g, '').replace(/\.$/, '');
  }
  return line;
}
/* ══════════════════════════════════════════════════════════════════════════
   6.1차 6-1 · 6-2 — 여론 글의 성격과, 여론/알림 나누기
   box: 'feed' 사람들이 하는 말 / 'alert' 내 상태에 대한 알림
   tone: 'pos' 긍정 / 'mid' 중간 / 'neg' 부정 (여론 글에만 붙는다)
   ══════════════════════════════════════════════════════════════════════════ */
const FEED_TONE = {
  pos:{ mark:'▲', name:'긍정' },
  mid:{ mark:'—', name:'중간' },
  neg:{ mark:'▼', name:'부정' }
};
/* 글이 어느 갈래에서 나왔는지로 성격을 정한다 */
const POOL_TONE = {
  high:'pos', clean:'pos', rich:'mid', low:'mid',
  dirty:'neg', poor:'neg', fence:'neg', press:'neg'
};
function pushFeed(s, kind, text, opt){
  if(!s.feed) s.feed = [];
  opt = opt || {};
  var box = opt.box || 'feed';
  var line = (box === 'alert') ? fill(text, s) : feedQuote(kind, fill(text, s));
  /* 바로 앞 글과 똑같으면 넣지 않는다 (같은 글이 두 번 붙어 보이던 문제) */
  var last = s.feed[s.feed.length - 1];
  if(last && last.text === line) return;
  s.feed.push({ kind:kind, text:line, age:s.curAge || 16, read:false,
                box:box, tone:(box === 'alert') ? null : (opt.tone || 'mid') });
  s.feedUnread = (s.feedUnread || 0) + 1;
  if(s.feed.length > 120) s.feed.shift();
  /* 첫 판에서 여론 피드가 처음 생기면 안내를 한 번 띄운다
     (설계 A-4의 안내를 5차 C-3의 첫 판 도우미로 합쳤다) */
  if(s.feed.length === 1) showTip(s, 'feed');
}
/* 6.1차 6-2. 내 상태에 대한 알림 — 여론과 섞이지 않게 따로 넣는다 */
function pushAlert(s, text){ pushFeed(s, 'self', text, { box:'alert' }); }

/* ── 6.1차 6. 여론의 밀도 ────────────────────────────────────────────────
   구설과 비리가 쌓일수록 부정적인 글이 늘어난다.
   평온하면 긍정과 부정이 반반, 위험하면 대부분이 부정이 된다. 0 ~ 1 을 돌려준다. */
function badMood(s){
  if(!s.crisis) return 0;
  var C = CONFIG.crisis;
  var worst = Math.max(s.crisis.scandal || 0, s.crisis.corruption || 0);
  return Math.max(0, Math.min(1, worst / C.crisisAt));
}
/* 상황에 맞는 글을 한두 개 뽑아 피드에 넣는다 */
function spillFeed(s, situation){
  /* 4차 B-2. 라이벌은 판 내내 소식이 들린다 — 만난 뒤부터 */
  if(!situation && s.rival && s.rival.met && !s.flags.rivalAlly && Math.random() < rivalNoiseChance(s)){
    pushFeed(s, 'rival', s.rival.feed[rnd(s.rival.feed.length - 1)], { tone:'neg' });
    return;
  }
  if(situation){
    var sp = FEED_POOL[situation];
    if(!sp || !sp.length) return;
    var si = sp[rnd(sp.length - 1)];
    pushFeed(s, si.kind, si.text, { tone:POOL_TONE[situation] || 'mid' });
    return;
  }
  /* 6.1차 6. 비리가 높으면 취재·자료 요청 글이 늘어난다 */
  var heat = badMood(s);
  if((s.crisis.corruption || 0) >= CONFIG.crisis.stages[1].min &&
     Math.random() < CONFIG.feedUI.pressChance * heat){
    var pp = FEED_POOL.press;
    pushFeed(s, 'news', pp[rnd(pp.length - 1)].text, { tone:'neg' });
    return;
  }
  /* 갈래를 긍정·중간·부정으로 나눠 두고, 부정 쪽 무게를 위기에 따라 올린다 */
  var good = [], mid = [], bad = [];
  (tierLevel(s) >= 4 ? good : mid).push(tierLevel(s) >= 4 ? 'high' : 'low');
  (s.stats.integrity >= 60 ? good : bad).push(s.stats.integrity >= 60 ? 'clean' : 'dirty');
  if(s.stats.funds >= 35) mid.push('rich');
  else if(s.stats.funds < 10) bad.push('poor');
  if(s.fence >= CONFIG.fence.tagEventAt && FEED_POOL.fence[s.career]) bad.push('fence');

  /* 평온하면 긍정 1 : 중간 1 : 부정 1, 위험하면 부정이 대부분 */
  var bag = [];
  var wGood = Math.max(0, Math.round((1 - heat) * 4));
  var wMid  = 2;
  var wBad  = Math.round(1 + heat * 8);
  function add(list, w){ list.forEach(function(k){ for(var i = 0; i < w; i++) bag.push(k); }); }
  add(good, wGood); add(mid, wMid); add(bad, wBad);
  if(!bag.length) return;
  var key = bag[rnd(bag.length - 1)];
  var pool = (key === 'fence') ? FEED_POOL.fence[s.career] : FEED_POOL[key];
  if(!pool || !pool.length) return;
  var item = pool[rnd(pool.length - 1)];
  pushFeed(s, item.kind, item.text, { tone:POOL_TONE[key] || 'mid' });
}

/* ---------- C-4. 상태 아이콘 (인라인 SVG) ----------
   단계는 색이 아니라 아이콘 옆 점 개수로 구분한다. */

/* ══════════════════════════════════════════════════════════════════════════
   [C 묶음] 연출 — 인라인 SVG 그림들
   원칙(설계 C-1): 배경은 옅게, 글 카드는 흰색, 상태는 색이 아니라 위치와 모양으로.
   주황 계열 노을이나 주황+초록 조합은 쓰지 않는다. 얼굴은 그리지 않는다.

/* ---------- C-2. 캐릭터 실루엣 ----------
   자세 3가지(꼿꼿함·어깨 처짐·벽에 기댐) + 앉음·차렷,
   옷차림 4가지(교복·후드티·정장·코트와 목도리),
   진로별 소지품 6가지, 곁의 사람, 발밑 그림자. */

/* 체력으로 자세가 정해진다 */
function postureOf(s){
  var A = CONFIG.art;
  if(!s) return 'stand';
  if(s.stats.stamina < A.postureWorn) return 'lean';
  if(s.stats.stamina < A.postureTired) return 'slump';
  return 'stand';
}
/* 시기와 체급으로 옷차림이 정해진다 */
function outfitOf(s){
  var A = CONFIG.art;
  if(!s) return 'uniform';
  if(s.turnIndex === 0) return 'uniform';
  var tier = tierLevel(s);
  if(tier >= A.outfitCoatTier) return 'coat';
  if(tier >= A.outfitSuitTier || s.politicalCareer) return 'suit';
  return 'hoodie';
}
/* 진로별 소지품 */
const PROP_SVG = {
  /* 서류 가방 */
  bag:'<rect x="0" y="4" width="15" height="11" rx="1.5"/><path d="M5 4V2h5v2" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  /* 실험용 플라스크 */
  flask:'<path d="M5 0h5v5l5 11a1.5 1.5 0 0 1-1.4 2H1.4A1.5 1.5 0 0 1 0 16L5 5z"/>',
  /* 기자 수첩 */
  note:'<rect x="1" y="1" width="12" height="16" rx="1.5"/><path d="M4 0v3M8 0v3" stroke="currentColor" stroke-width="1.6"/>',
  /* 마이크 */
  mic:'<rect x="4" y="0" width="7" height="11" rx="3.5"/><path d="M1.5 9a6 6 0 0 0 12 0M7.5 15v4M4 19h7" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  /* 확성기 */
  horn:'<path d="M0 6h4l9-5v16l-9-5H0z"/><path d="M15 6a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.5"/>',
  /* 의원 배지 */
  badge:'<circle cx="7" cy="7" r="6"/><path d="M7 2.5l1.3 2.8 3 .3-2.3 2 .7 3L7 9l-2.7 1.6.7-3-2.3-2 3-.3z" fill="#fff"/>'
};
const CAREER_PROP = { law:'bag', sci:'flask', media:'note', ent:'mic', biz:'bag', poli:'badge' };
function propOf(s){
  if(!s) return null;
  if(s.flags && s.flags.wayId && S && S.phase === 'election') return 'horn';
  if(s.politicalCareer) return 'badge';
  return CAREER_PROP[s.career] || null;
}
/* 곁에 선 사람 수 — 참모와 가정 (설계 C-2) */
function matesOf(s){
  if(!s) return 0;
  var n = 0;
  if(s.flags && s.flags.aide) n++;
  if(s.flags && s.flags.life === '결혼과 가정') n++;
  if(s.politicalCareer) n++;
  return Math.min(3, n);
}
/* 발밑 그림자 길이 — 위기가 쌓이면 길고 짙어진다 */
function shadowOf(s){
  if(!s || !s.crisis) return 0;
  var worst = 0;
  Object.keys(s.crisis).forEach(function(p){
    if(crisisUnlocked(s, p) && s.crisis[p] > worst) worst = s.crisis[p];
  });
  var A = CONFIG.art;
  return worst >= A.shadowCrisis ? 2 : (worst >= A.shadowWarn ? 1 : 0);
}

/* 실루엣 하나를 그린다. 좌표계는 0 0 64 104, 발이 y=98 에 온다. */
function figureG(s, o){
  o = o || {};
  var posture = o.posture || postureOf(s);
  var outfit  = o.outfit  || outfitOf(s);
  var prop    = (o.prop !== undefined) ? o.prop : propOf(s);
  var mates   = (o.mates !== undefined) ? o.mates : matesOf(s);
  var shade   = (o.shadow !== undefined) ? o.shadow : shadowOf(s);
  var scale   = o.scale || 1;

  /* 자세마다 몸통이 기울고 어깨가 내려간다 */
  var tilt = { stand:0, slump:0, lean:-9, sit:0, attention:0 }[posture] || 0;
  var drop = { stand:0, slump:4, lean:2, sit:0, attention:0 }[posture] || 0;

  /* 옷차림 — 어깨 너비, 밑단 길이, 덧붙는 것 */
  var cloth = {
    uniform:{ sw:13, hem:58, extra:'<path d="M32 30 l-4 7 4 4 4-4z" fill="#fff" opacity=".85"/>' },
    hoodie: { sw:15, hem:56, extra:'<path d="M23 28 a9 7 0 0 1 18 0 z" opacity=".55"/>' },
    suit:   { sw:14, hem:60, extra:'<path d="M32 30 l-2.5 5 2.5 9 2.5-9z" fill="#fff" opacity=".8"/>' },
    coat:   { sw:16, hem:72, extra:'<path d="M25 30 h14 v3 h-14z" fill="#fff" opacity=".8"/>' +
                                   '<path d="M38 33 l3 12 3-2 -3-11z" opacity=".75"/>' }
  }[outfit] || { sw:14, hem:60, extra:'' };

  var g = '';
  /* 그림자는 위기 단계를 보여 줄 때만 그린다 (0-3).
     평소에 깔던 옅은 타원은 실루엣 아래가 번져 보여서 없앴다. */
  if(shade > 0){
    g += '<ellipse cx="' + (32 + shade * 6) + '" cy="99" rx="' + (16 + shade * 9) + '" ry="3.4" ' +
         'fill="currentColor" opacity="' + (0.18 + shade * 0.16) + '"/>';
  }
  /* 곁에 선 사람 — 뒤에 작게 */
  for(var m = 0; m < mates; m++){
    var mx = 12 - m * 9;
    g += '<g opacity="' + (0.3 - m * 0.06) + '" transform="translate(' + mx + ',14) scale(.78)">' +
         '<circle cx="32" cy="17" r="7.5"/>' +
         '<path d="M32 25 c-8 0-12 5-12 12 l0 45 h24 l0-45 c0-7-4-12-12-12z"/></g>';
  }

  var body = '';
  if(posture === 'sit'){
    body =
      '<circle cx="32" cy="17" r="8.5"/>' +
      '<path d="M32 26 c-' + cloth.sw + ' 0-' + (cloth.sw - 2) + ' 6-' + (cloth.sw - 2) + ' 13 l0 22 h' + (cloth.sw * 2 - 4) + ' l0-22 c0-7 ' + (cloth.sw - 2) + '-13-' + (cloth.sw - 2) + '-13z"/>' +
      '<path d="M22 61 h22 v7 h-22z"/>' +           /* 허벅지 */
      '<path d="M24 68 v22 M40 68 v22" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>' +
      '<path d="M20 96 h12 M36 96 h12" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>';
  } else {
    var armPath;
    if(posture === 'attention'){
      armPath = 'M' + (32 - cloth.sw) + ' 36 v26 M' + (32 + cloth.sw) + ' 36 v26';
    } else if(posture === 'lean'){
      armPath = 'M' + (32 - cloth.sw) + ' 36 l-7 22 M' + (32 + cloth.sw) + ' 36 l5 24';
    } else {
      armPath = 'M' + (32 - cloth.sw) + ' 36 l-3 24 M' + (32 + cloth.sw) + ' 36 l3 24';
    }
    var feet = (posture === 'attention') ? 'M26 96 h5 M33 96 h5' : 'M22 96 h10 M34 96 h9';
    body =
      '<circle cx="32" cy="17" r="8.5"/>' +
      '<path d="M32 26 c-' + cloth.sw + ' 0-' + (cloth.sw + 1) + ' 6-' + (cloth.sw + 1) + ' 13 l-1 ' + (cloth.hem - 39) +
        ' h' + (cloth.sw * 2 + 4) + ' l-1-' + (cloth.hem - 39) + ' c0-7-' + (cloth.sw + 1) + '-13-' + (cloth.sw + 1) + '-13z"/>' +
      '<path d="' + armPath + '" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" fill="none"/>' +
      '<path d="M27 ' + cloth.hem + ' v' + (96 - cloth.hem) + ' M37 ' + cloth.hem + ' v' + (96 - cloth.hem) + '" ' +
        'stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/>' +
      '<path d="' + feet + '" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>';
  }
  g += '<g transform="rotate(' + tilt + ' 32 70) translate(0 ' + drop + ')">' + body + cloth.extra + '</g>';

  /* 손에 든 것 */
  if(prop && PROP_SVG[prop]){
    var px = (posture === 'lean') ? 46 : 44, py = 58;
    g += '<g transform="translate(' + px + ',' + py + ') scale(.95)">' + PROP_SVG[prop] + '</g>';
  }
  /* 벽에 기댄 자세는 기댈 벽을 같이 그린다 */
  if(posture === 'lean') g += '<path d="M9 26 v72" stroke="currentColor" stroke-width="2.5" opacity=".3"/>';

  return g;   /* <g> 안에 들어갈 내용만 돌려준다 (배경과 같은 좌표계에 얹기 위해) */
}

/* ---------- C-4. 판세를 하늘로 (별도 날씨 아이콘은 없앴다) ---------- */
/* 내부 판세를 5단계 하늘로 바꾼다. 0 맑음 → 4 폭풍 */
function skyIndexFor(chance){
  var cuts = CONFIG.art.skyCuts;
  for(var i = 0; i < cuts.length; i++){ if(chance >= cuts[i].min) return cuts[i].k; }
  return 4;
}
/* 선거 운동이 시작될 때 하늘을 정한다.

function setSky(s, chance, uncertain){
  var A = CONFIG.art;
  var idx = skyIndexFor(chance);
  if(uncertain) idx = Math.min(4, idx + A.uncertainStep);
  /* 예보 오차 — 한 판에 최대 한 번 */
  var off = 0;
  if(!s.flags.skyErrorUsed && Math.random() < A.forecastErrorChance){
    off = (Math.random() < 0.5) ? -1 : 1;
    idx = Math.max(0, Math.min(4, idx + off));

  s.sky = idx;

/* ---------- 지금 화면에 맞는 무대를 고른다 (설계 C-3 표) ----------
   { bg, posture, sky, piece } 를 돌려준다. piece 가 있으면 배경 대신 그것을 쓴다. */
function stageFor(s){
  if(!s) return null;
  var ph = s.phase, ti = s.turnIndex;

  /* 대선 단계 연출 (설계 C-5) */
  if(ph === 'pres'){
    var sub = s.presSub;
    /* big:true 인 장면은 그림이 주인공이다. 띠를 크게 두고 선택지는 아래 작은 카드로 (5차 A-1) */
    if(sub === 'strategy' || sub === 'primaryResult' || sub === 'noPrimary' || sub === 'primaryLoss'){
      return { piece:tugSVG(s.primaryPos === undefined ? 0.5 : s.primaryPos), posture:'stand', label:'경선', big:true };
    }
    if(sub === 'debate'){
      return { piece:debateStageSVG(s.flags.debateSwing || 0, s.debateMood), posture:'stand', label:'토론', big:true };
    }
    /* 6차 D-2. 방금 한 마디에 무대가 반응하는 중 */
    if(sub === 'debateReact'){
      return { piece:debateStageSVG(s.flags.debateSwing || 0, s.debateMood, true),
               posture:'stand', label:'토론', big:true };
    }
    if(sub === 'lateAttack' || sub === 'lateResult'){
      return { piece:newspaperSVG(null, sub === 'lateResult' && s.attackGood), posture:'stand', label:'막판 공세', big:true };
    }
    if(sub === 'poll'){ return { bg:'camp', posture:postureOf(s), label:'투표 전날' }; }
    if(sub === 'ballot'){
      var last = s.ballotSteps ? s.ballotSteps.lines.length - 1 : 0;
      if(s.ballotShown >= last){
        /* 확정 순간 밤이 된다. 당선이면 폭죽, 낙선이면 비가 계속 내린다 (설계 C-4) */
        return { piece:resultSceneSVG(!!s.flags.electedPresident), label:'결과', big:true };
      }
      var b = (s.ballotSteps && s.ballotSteps.bars && s.ballotSteps.bars[s.ballotShown]) || { m:10, t:10 };
      return { piece:ballotBarsSVG(b.m, b.t, s.flags.wonByComeback), label:'개표', big:true };
    }
    if(sub === 'pledge' || sub === 'merge'){ return { bg:'camp', posture:postureOf(s), label:'본선 준비' }; }
    return { bg:'camp', posture:postureOf(s), label:'대선' };
  }

  /* 35~40세 등 일반 선거 */
  if(ph === 'election'){
    if(s.electionStage === 'attack' || s.electionStage === 'attackResult'){
      return { piece:newspaperSVG(null, s.electionStage === 'attackResult' && s.attackGood), label:'상대의 공세', big:true };
    }
    if(s.electionStage === 'ballot'){
      var bi = s.ballotInfo || {};
      return { piece:ballotBarsSVG(bi.bigLost ? 70 : 96, bi.bigLost ? 96 : 72, false), label:'개표', big:true };
    }
    /* 6차 D-1. 선거 운동도 그림이 주인공인 화면이다 */
    return { piece:mapSVG(s.flags.wayId, 12, s.sky), label:'선거 운동', big:true };
  }

  /* 흔들림은 위기 화면이 처음 뜰 때 한 번만 (0-1) */
  if(ph === 'crisis') return { bg:bgForTurn(s), posture:'lean', shake:!!s.shakeOnce, label:'위기' };

  /* 시기별 배경 */
  var posture = (ti === 0) ? 'sit' : (inBarracks(s) ? 'attention' : postureOf(s));
  return { bg:bgForTurn(s), posture:posture, label:null };
}

    for(var b = 0; b < 5; b++){

    g += endFigure(s, 128, 44, 0.66, { posture:'slump', shadow:0, mates:0, prop:null });
    for(var c = 0; c < 6; c++){
